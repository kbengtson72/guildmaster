    if(typ && r.types.indexOf(typ)>=0) parts.push({label:(r.n||"Role")+" role on "+typ, n:4});
    else parts.push({label:(r.n||"Role")+" role off-type", n:-4});
  }
  if(r.dark && m && isDarkMission(m)) parts.push({label:(r.n||"Role")+" role on Dark", n:r.dark});
  if(r.lead && party){
    const peers = party.filter(x=>x && x.cls===p.cls);
    const best = Math.max.apply(null, peers.map(x=>x.lv||1));
    if((p.lv||1)>=best) parts.push({label:(r.n||"Sergeant")+" leads the "+(p.cls||"")+"s", n:3});
  }
  return parts;
}

function chemDelta(party){
  if(!party || party.length<2) return 0;
  const counts = {};
  party.forEach(p=>{ counts[p.cls] = (counts[p.cls]||0)+1; });
  let same = 0;
  Object.keys(counts).forEach(k=>{ if(counts[k]>1) same += counts[k]-1; });
  const mixed = Object.keys(counts).length>=2 ? 2 : 0;
  return mixed - same*2;
}

function tickBonds(party, success){
  if(!party || party.length<2) return;
  party.forEach(p=>{
    if(!p.pairWins) p.pairWins = {};
    if(!p.pairFails) p.pairFails = {};
    party.forEach(o=>{
      if(!o || o.id===p.id) return;
      if(success){
        p.pairWins[o.id] = (p.pairWins[o.id]||0)+1;
        if(p.quirk==="oath_kin" && !p.kinId && p.pairWins[o.id]>=3){
          p.kinId = o.id;
          note(p.name+" is oath-kin with "+o.name+".", "level");

      } else {
        p.pairFails[o.id] = (p.pairFails[o.id]||0)+1;
        if(p.quirk==="bitter" && !p.bitterId && p.pairFails[o.id]>=2){
          p.bitterId = o.id;
          note(p.name+" will not walk with "+o.name+" again.", "warn");
        }
      }
    });
  });
}

function quirkPwrParts(p, m, party){
  const q = quirkDef(p);
  const parts = [];
  if(!q) return parts;
  const typ = jobTypeOf(m);
  const qn = q.n || "Quirk";
  if(q.id==="night_step" && m) parts.push({label:isDarkMission(m) ? qn+" on Dark" : qn+" off Dark", n: isDarkMission(m) ? 5 : -5});
  if(q.id==="no_dark" && m && isDarkMission(m)) parts.push({label:qn, n:-5});
  if(q.id==="oath_kin" && p.kinId && party){
    const kin = party.some(x=>x && x.id===p.kinId);
    const kn = ((S.people||[]).find(x=>x.id===p.kinId)||{}).name;
    const who = kn ? kn.split(" ")[0] : "their bond";
    parts.push({label: kin ? qn+" with "+who : qn+" without "+who, n: kin ? 3 : -5});
  }
  if(q.id==="bitter"){
    const hit = p.bitterId && party && party.some(x=>x && x.id===p.bitterId);
    const bn = hit ? (((S.people||[]).find(x=>x.id===p.bitterId)||{}).name||"").split(" ")[0] : "";
    parts.push({label: hit ? qn+", sent with "+bn : qn, n: hit ? -6 : 2});
  }
  if(q.id==="lone_hand"){
    if(party && party.length===1) parts.push({label:qn+" (solo)", n:3});
    else if(party && party.length>1) parts.push({label:qn+" (in a party)", n:-2});
  }
  if(q.id==="soft_hands"){
    if(typ==="Assault"||typ==="Extermination") parts.push({label:qn+" on "+typ, n:-3});
    if(typ==="Gathering"||typ==="Recovery") parts.push({label:qn+" on "+typ, n:2});
  }
  if(q.id==="loud_step"){
    if(typ==="Search"||typ==="Mystery") parts.push({label:qn+" on "+typ, n:-2});
    if(typ==="Escort"||typ==="Assault") parts.push({label:qn+" on "+typ, n:2});
  }
  if((q.id==="short_road" || q.id==="long_strider") && m){
    const d = missionDays(m);
    if(d<4) parts.push({label:qn+" on a short road", n: q.id==="short_road" ? 5 : -5});
    if(d>4) parts.push({label:qn+" on a long road", n: q.id==="short_road" ? -5 : 5});
  }
  return parts;
}

function whyNoSend(p, m){
  if(!p) return "Missing.";
  if(p.status!=="ready") return "Not ready.";
  if(p.sickUntil && S.day < p.sickUntil) return "Fever lock · "+(p.sickUntil-S.day)+"d.";
  if(m && isDarkMission(m) && !canWalkDark(p)) return "Cannot walk Dark.";
  if(m && isHolyMission(m) && !canWalkHoly(p)) return "Cannot walk Holy.";
    if(p.quirk==="bench_doctor" && isDarkMission(m)) return "Bench-doctor will not walk Dark.";
  if(m && !quirkAllows(p,m)) return "A quirk blocks this job.";
  return "";
}
function canSendNow(p, m){
  if(!p || p.status!=="ready") return false;
  if(p.sickUntil && S.day < p.sickUntil) return false;
  if(m && isDarkMission(m) && !canWalkDark(p)) return false;
  if(m && isHolyMission(m) && !canWalkHoly(p)) return false;
  if(m && !quirkAllows(p, m)) return false;
  return true;
}
function hasClassReady(cls, m){
  return (S.people||[]).some(p=>p.cls===cls && canSendNow(p, m));
}
function favorMarks(m){
  return (m.tags||[]).map(t=>{

  }).join("");
}
function hasTypeBonusReady(m){
  const t = (m && (m.kind||m.jobType)) || (MISSION_TYPE[m&&m.t]||{}).type;
  const spec = t && TYPE_TRAIT[t];
  if(!spec) return false;
  return (S.people||[]).some(p=>canSendNow(p, m) && hasTrait(p, spec));
}
function typeMark(m){
  if(m && m.epic) return "👑 Epic Quest";
  const t = (m && (m.kind||m.jobType)) || (MISSION_TYPE[m&&m.t]||{}).type || "Contract";
  const ic = (MISSION_TYPE[m&&m.t]||{}).icon || "📜";
  const tick = hasTypeBonusReady(m) ? ` <span class="fav"><i class="yes">✓</i></span>` : "";
  return ic+" "+t+tick;
}

function scrubOpposites(p){
  if(!p) return p;
  if(blocksDarkWalk(p) && grantsDarkWalk(p)){
    if(p.quirk==="bench_doctor"){
      p.quirk = pickQuirkId(Object.assign({}, p, {quirk:null}));
      if(p.quirk==="bench_doctor") p.quirk = "field_aid";
    }
  }
  if(p.quirk==="bench_doctor" && roleHasDark(p)){
    const pool = (ROLES[p.cls]||[]).filter(x=>!x.dark);
    if(pool.length) p.role = pick(pool).id;
  }
  if(p.quirk==="bench_doctor"){
    const ts = traitList(p).filter(t=>!isDarkTrait(t));
    p.traits = ts;
    p.trait = ts[0];
  }
  return p;
}
function scrubAfraid(p){
  if(!p || p.quirk!=="no_dark") return p;
  const ts = traitList(p).filter(t=>!isDarkTrait(t));
  p.traits = ts;
  p.trait = ts[0];
  const r = (ROLES[p.cls]||[]).find(x=>x.id===p.role);
  if(r && r.dark){
    const pool = (ROLES[p.cls]||[]).filter(x=>!x.dark);
    if(pool.length) p.role = pick(pool).id;
  }
  const f = foodOf(p);
  if(f && f.dark){ p.food = null; p.foodEaten = false; }
  return p;
}
function canWalkDark(p){

  return p.cls==="Cleric" || hasTrait(p,"Night Owl") || hasTrait(p,"Occultist") || p.role==="night" || p.quirk==="night_step" || p.quirk==="no_dark";
}

function canWalkHoly(p){

  return p.cls==="Cleric" || hasTrait(p,"Daywalker") || p.quirk==="dawn_singer";
}

function hardenDark(m){
  if(!m || m.darkened || !isDarkMission(m)) return m;
  m.darkened = true;
  m.diff = (m.diff||1)+2;
  const g0=m.gold?m.gold[0]:10, g1=m.gold?m.gold[1]:20;
  const r0=m.ren?m.ren[0]:1, r1=m.ren?m.ren[1]:2;
  m.gold = [Math.floor(g0*1.4)+4, Math.floor(g1*1.45)+6];
  m.ren = [r0+2, r1+3];
  return m;
}
function hashStr(s){
  let h = 2166136261;
  const t = String(s||"");
  for(let i=0;i<t.length;i++){ h ^= t.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h>>>0;
}

function he(p){ return sexOf(p)==="f"?"she":"he"; }
function He(p){ return sexOf(p)==="f"?"She":"He"; }
function him(p){ return sexOf(p)==="f"?"her":"him"; }
function his(p){ return sexOf(p)==="f"?"her":"his"; }
function sexOf(p){
  if(p.sex==="f"||p.sex==="m") return p.sex;
  p.sex = (hashStr(p.id||p.name)%2) ? "f" : "m";

function portrait(p){
  const sex = sexOf(p);

  const src = FACES[cls+"-"+sex] || FACES["Warrior-m"];

}
function face(p){

  const sex = sexOf(p)==="f" ? "woman" : "man";
  const kin = p.kinId && (S.people||[]).find(x=>x.id===p.kinId && x.status!=="dead");

  const wage = `<div class="wage-pip">${gp(dayFee(p))}/d</div>`;
  return `<div class="facewrap"><div class="avatar ${c.tag} ${p.status||""}" title="${p.cls} · ${sex}">${portrait(p)}</div>${ring}<div class="badge-col"><div class="cls-badge ${c.tag}" title="${p.cls} ${p.lv||1}">${c.icon}<span class="lv-pip">${p.lv||1}</span></div>${wage}</div></div>`;
}
const SPECS = ["Exterminator","Forager","Bodyguard","Tracker","Stormer","Occultist","Hunter","Cartographer","Retriever"];

function traitList(p){
  const raw = (p.traits && p.traits.length) ? p.traits : (p.trait ? [p.trait] : []);
  return raw.map(x=> x==="Stubborn"?"Tough": x==="Scout"?"Eagle Eye": x==="Greedy"?"Treasure Hunter": x==="Pack Mule"?"Investor": x);
}
function hasTrait(p, name){ return traitList(p).indexOf(name)>=0; }
const NEGATIVE_TRAITS = ["Craven","Fragile","Reckless","Unlucky","Wasteful","Spendthrift","Sour","Soft","Shaky","Slack","Fickle","Slow clot","Oath-breaker"];
function isEpic(p){
  const list = traitList(p);
  return list.some(t=>NEGATIVE_TRAITS.indexOf(t)>=0) && list.some(t=>NEGATIVE_TRAITS.indexOf(t)<0);
}
function emult(p){ return isEpic(p)?2:1; }
function traitText(p){
  const list = traitList(p).slice().sort((a,b)=>{
    const na = NEGATIVE_TRAITS.indexOf(a)>=0?1:0;
    const nb = NEGATIVE_TRAITS.indexOf(b)>=0?1:0;
    if(na!==nb) return na-nb;
    return a.localeCompare(b);
  });
  const epic = isEpic(p);
  return list.map(t=>{
    const neg = NEGATIVE_TRAITS.indexOf(t)>=0;
    const label = (TRAIT_ICON[t]||"")+" "+t;
    if(epic && !neg) return `<span class="epic">✦ Epic ${label}</span>`;
    return label;
  }).join(" · ") || "—";
}

    const ban = (TRAIT_CONFLICT[tt] || []).slice();
    const negs = out.filter(x=>NEGATIVE_TRAITS.indexOf(x)>=0).length;
    if(n<3 && negs>=1) ban.push.apply(ban, NEGATIVE_TRAITS);
    pool = pool.filter(x=>ban.indexOf(x)<0);
  }
  return out;
}

function rng(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function uid(){ return Math.random().toString(36).slice(2,9); }
function missionIdEq(a,b){ return a!=null && b!=null && String(a)===String(b); }
function findMission(mid){
  const list = S.missions||[];
  if(mid!=null && mid!=="" && mid!=="undefined"){
    const hit = list.find(x=>x && missionIdEq(x.id, mid));
    if(hit) return hit;
  }
  if(mid==null || mid==="" || mid==="undefined"){
    const bare = list.find(x=>x && (x.id==null || x.id===""));
    if(bare){ bare.id = uid(); return bare; }
  }
  return null;
}
function findMissionIndex(mid){
  const m = findMission(mid);
  return m ? (S.missions||[]).indexOf(m) : -1;
}
function ensureMissionIds(){
  if(!S.missions) S.missions = [];
  const used = {};
  S.missions.forEach(m=>{
    if(!m) return;
    if(m.id==null || m.id==="") m.id = uid();
    else m.id = String(m.id);
    while(used[m.id]) m.id = uid();
    used[m.id] = true;
  });
}

function replaceMissingQuest(hint){
  hint = hint||{};
  const want = 5 + Math.min(2, Math.floor((S.renown||0)/15)) + 2*(S.buildings.briefs||0);
  const openN = (S.missions||[]).filter(m=>m && !m.epic && !(m.party&&m.party.length)).length;
  if(openN >= want){
    closeModal(); render();
    toast("The list is refreshed.");
    return;
  }
  const wantDiff = Math.max(1, +hint.diff || hallComfort() || 3);
  const taken = {};
  (S.missions||[]).forEach(x=>{ if(x && x.t) taken[x.t]=true; });
  const pool = missionPool().filter(src=>{
    if(taken[src.t]) return false;
    const probe = hardenDark(Object.assign({}, src));
    return canPost(probe);
  });
  if(!pool.length){
    closeModal(); render();
    toast("The list is refreshed. No new contract was available.");
    return;
  }
  pool.sort((a,b)=>Math.abs((a.diff||1)-wantDiff)-Math.abs((b.diff||1)-wantDiff));
  const m = hardenDark(Object.assign({}, pool[0]));
  m.id = uid();
  m.party = [];
  if(!S.missions) S.missions = [];
  S.missions.push(m);
  log("Posted a replacement brief: "+m.t+".");
  save(); closeModal(); render();
  toast("New brief: "+m.t+".");
}
function cap(){ return 2 + 2*(S.buildings.barracks||0); }
function bankLv(){ return S.buildings.bank||0; }
function bankCap(){ return 150 * bankLv(); }
function bankInterest(){
  const d = S.deposit||0;
  if(!bankLv() || d<25) return 0;
  let n = Math.min(bankLv(), Math.floor(d/25));
  if(S.bonusInterest){
    n += S.bonusInterest;
    S.bonusInterest = 0;
  }
  return n;
}
function bankDeposit(n){
  if(!bankLv()) return toast("Build the Bank first.");
  const room = Math.max(0, bankCap()-(S.deposit||0));
  const purse = S.gold||0;
  if(room<=0) return toast("Vault full · "+(S.deposit||0)+"/"+bankCap()+".");
  if(purse<=0) return toast("Purse is empty.");
  n = Math.floor(Math.min(n, purse, room));
  if(n<=0) return toast("Nothing to park.");
  S.gold -= n; S.deposit = (S.deposit||0)+n;
  log("Deposited "+n+" in the bank.");
  toast("Parked "+gp(n)+" · vault "+(S.deposit)+"/"+bankCap()+".");
  save(); render();
}
function bankWithdraw(n){
  n = Math.min(n, S.deposit||0);
  if(n<=0) return toast("The vault is empty.");
  S.deposit -= n; S.gold += n;
  log("Withdrew "+n+" from the bank."); save(); render();
}
const COIN='<span class="coin" title="gold"></span>';

function funds(){ return Math.max(0,(S.gold||0)) + Math.max(0,(S.deposit||0)); }
function spend(n){
  n = Math.max(0, Math.floor(Number(n)||0));
  if(!n) return true;
  if(funds() < n) return false;
  let left = n;
  const fromP = Math.min(Math.max(0,S.gold||0), left);
  S.gold = Math.max(0,(S.gold||0) - fromP);
  left -= fromP;
  if(left) S.deposit = Math.max(0,(S.deposit||0) - left);
  return true;
}

function outfitStarter(p){

  p.weapon = (w.length ? pick(w) : {id:"stick"}).id;
  p.armor = (a.length ? pick(a) : {id:"cloth"}).id;

function hirePool(kind, p){
  const list = kind==="weapon" ? WEAPONS : kind==="armor" ? ARMORS : FOODS;
  return list.filter(x=>{
    if(!x || x.unique || (x.r||"") === "artifact") return false;
    if(kind!=="armor" && !canWield(p, Object.assign({}, x, {kind}))) return false;
    return true;
  });
}
function pickWeightedItem(list){
  if(!list.length) return null;
  const w = {junk:25, common:35, uncommon:22, rare:12, epic:6};
  const bag = [];
  list.forEach(it=>{
    const n = w[it.r||"common"] || 10;
    for(let i=0;i<n;i++) bag.push(it);
  });
  return pick(bag.length?bag:list);
}
function outfitHire(p){

  const f = hirePool("food", p);
  p.weapon = (w||{id:"stick"}).id;
  p.armor = (a||{id:"cloth"}).id;

function safeColor(c, fallback){

function loyOf(p){
  if(p.loyalty==null) p.loyalty = rng(2,5);
  return p.loyalty;
}
function bumpLoy(p, d){
  if(!p || p.status==="dead") return;
  p.loyalty = Math.max(0, Math.min(10, loyOf(p)+d));
  if(p.loyalty<=0 && p.status!=="quit"){
    if(!S.quitAsk) S.quitAsk = [];
    if(S.quitAsk.indexOf(p.id)<0) S.quitAsk.push(p.id);
    note(p.name+" is packing. Loyalty hit zero.", "warn");
  }
}

function dayFee(p){ return Math.max(1, Math.floor(wageOf(p)/2)); }
function quitRenownHit(p){
  let n = 1;
  if(isElite(p)) n = 3;
  else if(isGifted(p)) n = 2;
  if((p.lv||1)>=5) n += 1;
  return n;
}
function applyQuitRenown(p){
  const n = quitRenownHit(p);
  const was = S.renown||0;
  S.renown = Math.max(0, was - n);
  return n;
}

function closePersonSheet(){
  if(S._afterPerson==="contest"){ S._afterPerson=null; return openContestSheet(); }
  const back = S._afterPerson;
  S._afterPerson = null;
  S.tapCloseSheet = false;
  if(back==="quit") return openQuitAsk();
  if(back==="restless") return openRestlessAsk();
  if(back==="seek") return openSeekers();
  closeModal();
  render();
}
function openQuitAsk(){
  if(!(S.quitAsk||[]).length) return;
  const id = S.quitAsk[0];
  const p = (S.people||[]).find(x=>x.id===id);
  if(!p || p.status==="dead"){
    S.quitAsk.shift();
    save();
    if((S.quitAsk||[]).length) return openQuitAsk();
    if(S.seekers && S.seekers.length) return openSeekers();
    return;
  }
  const fee = Math.max(2, dayFee(p)*2);
  const canPay = (S.gold||0) + (bankLv()?(S.deposit||0):0) >= fee;
  const sheet = document.getElementById("sheet");
  const modal = document.getElementById("modal");
  if(!sheet||!modal) return;
  sheet.innerHTML = `<h3>Leaving</h3>
    <div id="quitCard">${personLine(p)}</div>
    <p class="tiny">Loyalty 0 · pay ${gp(fee)} to keep them at 1. Tap the card to open the sheet.</p>
    <p class="tiny">${p.name.split(" ")[0]} is walking out. Pay the day's fee from the vault to keep them at loyalty 1. If they leave, the hall loses ${quitRenownHit(p)} Renown.</p>
    <p class="tiny">Purse ${gp(S.gold)}${bankLv()?" · vault "+gp(S.deposit||0):" · no Bank"}</p>
    ${canPay?`<button type="button" class="act" id="quitKeep" style="width:100%;margin-top:8px">Pay ${gp(fee)} (purse / vault)</button>`:`<p class="muted">Need ${gp(fee)}.</p>`}
    <button type="button" class="ghost" id="quitGo" style="width:100%;margin-top:6px">Let them leave</button>`;
  modal.classList.add("show"); modal.style.display="flex";
  sheet.querySelectorAll("[data-person]").forEach(el=>el.onclick=()=>{ S._afterPerson="quit"; openPerson(el.dataset.person); });
  const keep = document.getElementById("quitKeep");
  if(keep) keep.onclick = ()=>keepQuit(p.id);
  document.getElementById("quitGo").onclick = ()=>letQuit(p.id);
}
function keepQuit(id){
  const p = (S.people||[]).find(x=>x.id===id);
  if(!p) return;
  const fee = Math.max(2, dayFee(p)*2);
  if(!payWithBank(fee, p.name.split(" ")[0]+" stay")) return;
  p.loyalty = 1;
  if(p.status==="quit") p.status = "ready";
  S.quitAsk = (S.quitAsk||[]).filter(x=>x!==id);
  log("Paid "+p.name+" "+gp(fee)+" from the vault. They stayed.");
  note(p.name+" took the vault coin and put the bag down.", "success");
  save(); render();
  nextDoorQueue();
}
function letQuit(id){
  const p = (S.people||[]).find(x=>x.id===id);
  if(p){
    p.status = "quit";
    const hit = applyQuitRenown(p);
    log(p.name+" left the hall. −"+hit+" Renown.");
    note(p.name+" packed a bag and left. −"+hit+" Renown.", "fail");
  }
  S.quitAsk = (S.quitAsk||[]).filter(x=>x!==id);
  sweepQuit();
  save(); render();
  nextDoorQueue();
}

function sweepQuit(){
  const gone = S.people.filter(p=>p.status==="quit").map(p=>p.id);
  if(!gone.length) return;
  S.missions.forEach(m=>{ if(m.party) m.party = m.party.filter(id=>gone.indexOf(id)<0); });
  S.people = S.people.filter(p=>p.status!=="quit");
}
function byPower(list){
  return (list||[]).slice().sort((a,b)=>{
    const d = pwrOf(b)-pwrOf(a);
    if(d) return d;
    return String(a.name||"").localeCompare(String(b.name||""));
  });
}
function pwrOf(p){
  if(!p) return 0;
  let n = atkOf(p) + defOf(p)*0.7;
  n += (p.lv||1);
  n += Math.floor((p.maxhp||16)/8);
  const sch = CLASS_SCHOOL[p.cls];
  if(sch) n += (S.buildings[sch]||0);
  if(hasTrait(p,"Lucky")) n += 2*emult(p);
  if(hasTrait(p,"Unlucky")) n -= 2;
  if(hasTrait(p,"Cautious")) n += 1*emult(p);
  if(isElite(p)) n += 3;
  else if(isGifted(p)) n += 1;
  n += foodPwr(p, null);
  if((p.hp||0) < (p.maxhp||1)*0.4) n -= 2;
  return Math.max(1, Math.round(n));
}
function atkOf(p){
  const w = WEAPONS.find(x=>x.id===p.weapon) || WEAPONS[0];
  const off = p.offhand ? (WEAPONS.find(x=>x.id===p.offhand)||{}) : {};
  const half = off.fam==="shield" ? 0 : (off.atk||0)/2;
  const r = roleDef(p);
  return CLASSES[p.cls].atk + p.lv + w.atk + half + (hasTrait(p,"Brave")?2*emult(p):0) + (hasTrait(p,"Craven")?-2:0) + ((r&&r.atk)||0);
}
function defOf(p){
  expandGear(); ensureSlots(p);
  const adef = wornArmor(p).reduce((n,a)=>n+(a.def||0),0) + ((p.offhand && (WEAPONS.find(x=>x.id===p.offhand)||{}).fam==="shield") ? ((WEAPONS.find(x=>x.id===p.offhand)||{}).def||0) : 0);
  const a = {def:adef};
  const r = roleDef(p);
  return CLASSES[p.cls].def + Math.floor(p.lv/2) + a.def + (hasTrait(p,"Tough")?2*emult(p):0) + (hasTrait(p,"Fragile")?-2:0) + ((r&&r.def)||0);
}
function foodOf(p){
  if(!p || !p.food) return null;
  return FOODS.find(x=>x.id===p.food) || null;
}
function foodPwr(p, m){
  const f = foodOf(p);
  if(!f || p.foodSkip) return 0;
  let n = f.pwr||0;
  if(f.dark && m && isDarkMission(m)) n += f.dark;
  return n;
}
function foodBits(f){
  if(!f) return "";
  const bits = [];
  if(f.heal) bits.push("+"+f.heal+" HP");
  if(f.loy) bits.push("+"+f.loy+" loy");
  if(f.pwr) bits.push("+"+f.pwr+" PWR");
  if(f.dark) bits.push("+"+f.dark+" Dark");
  if(f.gold) bits.push("+"+Math.round(f.gold*100)+"% gold");
  if(f.xp) bits.push("+"+f.xp+" XP");
  return bits.join(" · ");
}
function foodBlurb(f){
  if(!f) return "empty";
  const bits = foodBits(f);
  return (f.icon?f.icon+" ":"")+itemNameHtml(f)+(bits?" · "+bits:"");
}
function consumeFood(p){
  if(p){ p.food = null; p.foodEaten = false; }
}
function xpNeed(p){ return 8 + p.lv*6; }
function hpBar(p){
  const pct = Math.max(0, p.hp) / Math.max(1, p.maxhp) * 100;
  const col = pct > 50 ? "#3aaa5a" : pct > 25 ? "#d4b44a" : "#b03a3a";
  return `<div class="bar" title="HP"><i style="width:${pct}%;background:${col}"></i></div>`;
}
function xpBar(p){ const n=xpNeed(p)||1; return `<div class="xpbar" title="XP"><i style="width:${Math.min(100,Math.max(0,(p.xp||0)/n*100))}%"></i></div>`; }
function tryLevel(p){
  while(p.xp >= xpNeed(p) && p.lv < 12){
    p.xp -= xpNeed(p);
    p.lv++;
    p.maxhp += 3;
    p.hp = p.maxhp;
    log(p.name+" reached level "+p.lv+".");
  }
}

    {t:"Dock Knives", d:"A stevedore gang is gutting night crews.", story:"On the Fairwind quay a crew called Dock Knives taxes the late barges. The harbormaster wants the ringleaders named and gone. Wet boards. Short knives. Witnesses who will lie.", diff:6, days:4, gold:[26,48], ren:[3,5], need:2, tags:["Rogue","Warrior"]},
    {t:"Tax Man", d:"A false collector is working the hamlets.", story:"Someone in a borrowed badge is taking the autumn tithe two weeks early. Find the man, the badge, and the sack. The real collector arrives on fifth-day and will not be amused.", diff:5, days:4, gold:[22,40], ren:[3,5], need:2, tags:["Rogue","Cleric"]},
    {t:"Border Walk", d:"Mark the old stones before the duke’s men arrive.", story:"The duke’s surveyors come in a week. Walk the west line, find the fallen march-stones, and chalk what is missing. Wolves use the same path. Do not start a war with a wrong mark.", diff:4, days:4, gold:[16,30], ren:[2,4], need:2, tags:["Rogue","Warrior"]},
    {t:"Old Mine", d:"See if the sealed adit is still sealed.", story:"After the last collapse the copper adit was bricked. Shepherds heard picks. Confirm the brick, map any new hole, and leave if the air goes bad. No treasure hunt. A report only.", diff:6, days:4, gold:[22,40], ren:[3,5], need:2, tags:["Mage","Rogue"]},
    {t:"Starfall Field", d:"Walk the burn where the sky fell.", story:"A streak hit the high pasture and left glass in the grass. The abbey wants a count of stones, a sketch of the crater, and no one pocketing the bright metal. It still ticks at night.", diff:8, days:6, gold:[32,58], ren:[4,7], need:2, tags:["Mage","Cleric"]},
    {t:"Sunken Chest", d:"A barge chest sits in the ford.", story:"A wool barge dumped a bound chest in the south ford. The owner will pay to have it up, lock unbroken. The water is chest-deep and the lock is church-wax. Bring rope and honest hands.", diff:4, days:4, gold:[18,34], ren:[2,4], need:2, tags:["Rogue","Warrior"]},
    {t:"Heirloom Blade", d:"A family sword was sold to the wrong man.", story:"House Dunridge wants the short-sword that went to a pawn in Harrowford. The pawn swears a sellsword bought it. Find the blade. Pay if you must. Take it if you cannot.", diff:5, days:4, gold:[20,38], ren:[2,4], need:1, tags:["Rogue","Warrior"]},
    {t:"Vault Key", d:"The second key left town in a coat.", story:"The counting-house vault needs two keys. One walked out on a clerk’s back. He took the dawn coach. Catch the key before it is copied. The first key stays here.", diff:6, days:4, gold:[24,44], ren:[3,5], need:2, tags:["Rogue","Mage"]},
    {t:"Boar Hide", d:"A tusked boar has taken the low orchard.", story:"Three dogs will not go past the fence. The boar sleeps under the cider press and has already opened a swineherd's calf. The reeve wants it dead and the hide brought back as proof. A spear-arm and a quiet approach. Do not burn the trees.", diff:4, days:4, gold:[16,30], ren:[1,3], need:1, tags:["Warrior","Rogue"]},
    {t:"Crow Loft", d:"The chapel loft is full of crows that will not leave.", story:"They have nested in the rood-beam and the sexton swears they speak names. Clear the loft. Save the thatch. A sling or a patient climb beats a torch.", diff:3, days:2, gold:[10,20], ren:[1,2], need:1, tags:["Rogue","Cleric"]},
    {t:"Beetle Drain", d:"Something clicks in the mill drain.", story:"The miller pulled a beetle the size of a fist from the sluice. More are coming up the wet stone. Scrape the drain before the wheel seizes. Close, dark, and loud.", diff:3, days:2, gold:[12,22], ren:[1,2], need:1, tags:["Rogue","Warrior"]},
    {t:"Salt Hydra", d:"A many-headed thing in the salt marsh.", story:"Eel-men swear a pale coil with too many mouths took a punt. The duke wants it dead before the salt-cutters refuse the flats. Fire helps. So does not standing in the same pool twice.", diff:8, days:6, gold:[36,64], ren:[4,7], need:2, tags:["Mage","Warrior"]},
    {t:"Willow Bark", d:"Strip fever-bark from the river willows.", story:"The infirmary is out of willow. Cut only the marked trees and leave the young ones. Bring the inner bark dry. A gentle hand, not an axe-song.", diff:2, days:2, gold:[8,16], ren:[0,1], need:1, tags:["Cleric","Rogue"]},
    {t:"Salt Pans", d:"Rake the pans before the rain.", story:"The salt-cutters will pay for two extra rakes and a watch against thieves. The crust is thin this week. Fall through and you boil in your boots.", diff:3, days:4, gold:[14,26], ren:[1,2], need:2, tags:["Warrior","Rogue"]},
    {t:"Amber Drip", d:"Gather resin from the old pines.", story:"The chandler needs amber-drip for church candles. It beads on the south trunks after noon heat. Do not nick the trees to death. A full pot is the pay.", diff:2, days:2, gold:[8,14], ren:[0,1], need:1, tags:["Rogue","Cleric"]},
    {t:"Night Berries", d:"Pick the black fruit that only ripens after dark.", story:"Night berries stain the teeth and the chapel uses them for ink. They grow in the ditch behind the Tanneries. Bring a full basket and do not eat them. They lie about being sweet.", diff:2, days:2, gold:[8,16], ren:[1,2], need:1, tags:["Rogue","Mage"]},
    {t:"Census Walk", d:"Walk the clerk who is counting heads.", story:"The duke's clerk cannot count and walk at the same time. Escort him hamlet to hamlet. Keep the dogs off and the numbers honest. He pays extra if no one 'forgets' a son.", diff:3, days:4, gold:[16,28], ren:[1,3], need:2, tags:["Warrior","Cleric"]},
    {t:"Grain Barge", d:"Ride the grain barge to Harrowford.", story:"One barge, two boatmen, and a rumor of hooks at the bend. Stand on the deck until the sacks are on the quay. No swimming for dropped grain.", diff:4, days:4, gold:[18,32], ren:[2,3], need:2, tags:["Warrior","Rogue"]},
    {t:"Sick Friar", d:"Walk Brother Penn to the high chapel.", story:"He has a cough that frightens the low house. The high chapel will take him if he arrives alive and not robbed. Slow walking. Carry his book.", diff:2, days:4, gold:[12,22], ren:[2,3], need:1, tags:["Cleric","Warrior"]},
    {t:"Prize Bull", d:"Lead a prize bull to the fair.", story:"The bull is worth more than the farm. It hates hats and sudden stops. Two people: one on the rope, one on the crowd. Do not let children feed it apples.", diff:4, days:4, gold:[18,34], ren:[1,3], need:2, tags:["Warrior","Rogue"]},
    {t:"Lost Ring", d:"A wedding ring went into the mill race.", story:"She saw it wink once on the stones. The wheel is stopped until it is found or she gives up. Cold water. Fast current. A small hand helps.", diff:3, days:2, gold:[12,22], ren:[1,3], need:1, tags:["Rogue","Cleric"]},
    {t:"Runaway Novice", d:"A novice walked off with a psalter.", story:"Sister Halwen wants the girl home and the book unmarked. She was seen on the salt road with a bundle. Kind words first. The book second.", diff:3, days:4, gold:[12,24], ren:[2,4], need:1, tags:["Cleric","Rogue"]},
    {t:"Empty Cot", d:"A hired man did not come in from the peat.", story:"His cot is made. His boots are not on the peg. Walk the cuttings. If he is sleeping, wake him. If he is not, bring what you can.", diff:4, days:4, gold:[14,26], ren:[2,3], need:1, tags:["Rogue","Warrior"]},
    {t:"Mill Girl", d:"The miller's daughter missed the noon bell.", story:"She took lunch to the upper stones and did not come down. The stones are still. Find her before the father starts moving sacks with his hands.", diff:3, days:2, gold:[12,20], ren:[2,3], need:1, tags:["Rogue","Cleric"]},
    {t:"Bandit Mill", d:"A ruined mill is flying a stolen banner.", story:"Cutpurses have made a kitchen of the old wheel-house. The reeve wants the banner down and the kitchen cold. Kick the door or burn the loft. Not both if you can help it.", diff:6, days:4, gold:[24,44], ren:[3,5], need:2, tags:["Warrior","Rogue"]},
    {t:"Orc Watch", d:"An orc watch sits on the shale saddle.", story:"Three of them, maybe four, with a horn. The shepherds will not use the saddle until the horn is quiet. Fast and ugly. Do not let the horn sound twice.", diff:7, days:4, gold:[28,50], ren:[3,6], need:2, tags:["Warrior","Mage"]},
    {t:"Riot Dock", d:"Stevedores have shut the quay with hooks.", story:"A wage fight turned into a barricade of crates. The harbormaster wants the quay open by dawn and as few skulls opened as possible. Shields help. Fire does not.", diff:5, days:4, gold:[22,40], ren:[2,4], need:2, tags:["Warrior","Cleric"]},
    {t:"Hill Fort", d:"The old hill fort has new smoke.", story:"Someone has reroofed a ring-wall that was supposed to stay empty. The duke wants them out and the roof off. Steep climb. One good door.", diff:7, days:6, gold:[30,54], ren:[4,6], need:2, tags:["Warrior","Mage"]},
    {t:"Whisper Cellar", d:"The counting-house cellar answers back.", story:"Clerks will not fetch wine. Something under the floor repeats the last number said above it, wrong. Find the voice. Stop it. Do not add a new total.", diff:5, days:4, gold:[20,36], ren:[3,5], need:2, tags:["Mage","Rogue"]},
    {t:"Bone Choir", d:"The ossuary hums after vespers.", story:"The stacked skulls have started a note that will not die. The bishop wants silence and no broken relics. A blessing or a careful rearrangement. Not a hammer.", diff:6, days:4, gold:[22,40], ren:[3,6], need:2, tags:["Cleric","Mage"]},
    {t:"Mirror Shop", d:"A glass-seller's mirrors show the wrong hour.", story:"Customers leave pale. One glass showed a room that is not in the shop. Cover, count, and decide which pane leaves town and which stays under cloth.", diff:6, days:4, gold:[24,42], ren:[3,6], need:2, tags:["Mage","Rogue"]},
    {t:"Hollow Oak", d:"The boundary oak has a door in it.", story:"Children swear a seam opened in the old oak after the last storm. The seam is gone by noon. Be there at first light with a light of your own.", diff:5, days:4, gold:[20,36], ren:[3,5], need:1, tags:["Mage","Rogue"]},
    {t:"Grave Fog", d:"Fog sits on the new graves and will not lift.", story:"The sexton can mark the old rows. The new ones he cannot find. Walk the yard at night, find the stones, and see what the fog is feeding. A priest or an owl.", diff:7, days:4, gold:[28,48], ren:[4,6], need:2, tags:["Cleric","Mage"]},
    
    {t:"Dawn Chapel", d:"The chapel will not take the morning light.", story:"The east window stays grey after sunrise. The sexton swept, the priest prayed, the light still stops at the sill. Walk the nave at first light and name what is sitting in the glass.", diff:4, days:3, gold:[16,28], ren:[2,4], need:1, tags:["Cleric"], holy:true},
    {t:"Saint's Relic", d:"A bone of the saint has left the box.", story:"The reliquary lock is whole. The bone is not inside. The abbess wants it back before vespers and will not hear of a night search. A cleric's hands, or a daywalker who can stand the chapel.", diff:5, days:3, gold:[20,36], ren:[3,5], need:1, tags:["Cleric"], holy:true},
    {t:"Hymn House", d:"The choir sings a verse no one wrote.", story:"Four voices. The book has three verses. The fourth comes at noon and the windows brighten until it hurts. Sit the loft through the office and stop the extra line without silencing the rest.", diff:5, days:4, gold:[22,38], ren:[3,5], need:2, tags:["Cleric"], holy:true},
    {t:"Sun Procession", d:"The feast walk will not cross the square.", story:"Every year the sun-banner goes from the well-house to the green. This year the bearers halt at the cobbles and cannot say why. Escort the banner in daylight. Do not let the line break.", diff:6, days:3, gold:[24,40], ren:[3,5], need:2, tags:["Cleric","Warrior"], holy:true},
    {t:"Vow Stone", d:"The oath-stone has gone dull.", story:"Couples still come. The stone does not take the words. Survey the hill, find whether the cut has filled or something drinks the vows, and report before the next market wedding.", diff:6, days:4, gold:[24,42], ren:[3,5], need:2, tags:["Cleric"], holy:true},
    {t:"Mercy Altar", d:"Offerings vanish between noon bells.", story:"Bread and coin laid at the mercy stone are gone when the second bell rings, and no beggar will stand near. Watch the altar in full day. Name the taker.", diff:7, days:4, gold:[28,46], ren:[4,6], need:2, tags:["Cleric","Mage"], holy:true},
    {t:"Golden Censer", d:"The temple censer walks the aisle alone.", story:"It leaves the sacristy at terce, swings the nave, and returns empty. The smoke smells of myrrh and iron. Follow it in daylight and put it back in a hand that is allowed to hold it.", diff:7, days:4, gold:[28,48], ren:[4,6], need:2, tags:["Cleric"], holy:true},
    {t:"Candle Crypt", d:"Candles in the crypt light themselves.", story:"No one admits to striking them. The wax is not the chapel's. Go down, name the source, and leave the dead unmoved.", diff:6, days:4, gold:[24,42], ren:[3,5], need:2, tags:["Cleric","Mage"]},
    {t:"Horse Thief", d:"A branded mare left with a stranger.", story:"The brand is House Vale's. The stranger paid in clipped coin. Find the mare before the fair. Alive is the point. The thief is extra.", diff:4, days:4, gold:[18,34], ren:[2,4], need:1, tags:["Rogue","Warrior"]},
    {t:"Poisoner", d:"Three bowls at the inn went green.", story:"The cook is in the lock-up and swears the salt was swapped. Find who bought the green salt and bring a name the watch can hold.", diff:5, days:4, gold:[20,38], ren:[3,5], need:2, tags:["Rogue","Cleric"]},
    {t:"Debt Knight", d:"A hedge-knight is collecting with a hammer.", story:"He has a letter that might be real. The hamlets want him gone either way. Take the letter. Take him if the letter is false.", diff:6, days:4, gold:[24,44], ren:[3,5], need:2, tags:["Warrior","Rogue"]},
    {t:"Fence Rat", d:"A pawn is moving church plate.", story:"The bishop's mark showed up on a tray in Harrowford. Follow the tray back. The pawn will talk if crowded. The buyer may not.", diff:5, days:4, gold:[22,40], ren:[3,5], need:2, tags:["Rogue","Cleric"]},
    {t:"Flood Marks", d:"Paint last winter's high water on the posts.", story:"The duke's men want a true line, not a hopeful one. Walk the river from mill to ford and mark the stain. Wolves use the same bank.", diff:3, days:4, gold:[14,26], ren:[2,3], need:2, tags:["Rogue","Warrior"]},
    {t:"Standing Stones", d:"Count the ring and note which lean.", story:"A scholar paid in advance for a sketch and a count. Do not 'fix' a stone. Do not sleep inside the ring.", diff:4, days:4, gold:[16,30], ren:[2,4], need:2, tags:["Mage","Rogue"]},
    {t:"Salt Road", d:"Map the washouts on the salt road.", story:"Two carts went over the edge this month. Walk it, mark the slumps, and flag the worst turn. Bring the map back dry.", diff:3, days:4, gold:[14,26], ren:[2,3], need:2, tags:["Rogue","Warrior"]},
    {t:"Cave Mouth", d:"See how far the new cave runs.", story:"A slip on the ridge opened a mouth. The abbey wants a length, a sketch, and a word on the air. Turn back if the candles die.", diff:6, days:4, gold:[22,40], ren:[3,5], need:2, tags:["Mage","Rogue"]},
    {t:"Tithe Cup", d:"The chapel cup left with a guest.", story:"It is silver and has Saint Ora's mark. The guest took the north road. Bring the cup. The guest can keep his horse.", diff:4, days:4, gold:[18,34], ren:[2,4], need:1, tags:["Cleric","Rogue"]},
    {t:"Wedding Band", d:"A pledged band was swapped for tin.", story:"The bride noticed at the door. The tin is still on her hand. The gold went into a coat. Find the coat.", diff:3, days:2, gold:[14,26], ren:[2,3], need:1, tags:["Rogue","Cleric"]},
    {t:"Charter Box", d:"The hall's charter box is in a ditch.", story:"The courier's horse spooked. The box is lacquered and heavy. Find it before the damp takes the seals. Do not open it.", diff:4, days:4, gold:[18,32], ren:[2,4], need:2, tags:["Warrior","Rogue"]},
    {t:"Saint Comb", d:"A relic comb went missing from the side-altar.", story:"Ivory, stained at the teeth. A pilgrim was seen tucking something white. Catch the comb before it is sold as 'old bone'.", diff:3, days:2, gold:[14,28], ren:[2,4], need:1, tags:["Cleric","Rogue"]},
    {t:"Gate Breach", d:"The east postern is off its hinges.", story:"A ram took the small gate at dusk. Four are wanted to hold the gap, reset the bar, and keep looters off the stores until the carpenter comes.", diff:4, days:4, gold:[28,48], ren:[2,4], need:4, tags:["Warrior","Cleric"]},
    {t:"Four Corners Watch", d:"The milestone watch is short four bodies.", story:"North, south, east, west — each corner of the old market wants a face until dawn. Pickpockets work the gaps. Four posts. One night.", diff:5, days:4, gold:[32,54], ren:[2,4], need:4, tags:["Rogue","Warrior"]},
    {t:"Barrow Open", d:"The hill cut opened in the rain.", story:"A barrow mouth sloughed open on Miller’s Ridge. The parish wants four to go in, map the first chamber, and seal it before something walks out.", diff:6, days:6, gold:[40,68], ren:[3,5], need:4, tags:["Cleric","Mage"]},
    {t:"Bridge Hold", d:"The timber span is contested.", story:"Two crews claim the toll. The shire wants four to stand the middle, keep blades down, and hold until the magistrate arrives with paper.", diff:6, days:5, gold:[38,66], ren:[3,5], need:4, tags:["Warrior","Cleric"]},
    {t:"Tithe Vault", d:"The chapel chest was moved in the night.", story:"The iron box left the undercroft. Four are needed: one to track, one to lift, two to watch the street. Bring the chest back unopened.", diff:5, days:5, gold:[36,60], ren:[3,5], need:4, tags:["Rogue","Cleric"]},
    {t:"Beast Drive", d:"Hogs and worse came down off the burn.", story:"A fire on the ridge pushed a pack into the low fields. Four to drive them, cut the mean ones, and burn what will not go back.", diff:7, days:6, gold:[48,80], ren:[3,6], need:4, tags:["Warrior","Rogue"]},
    {t:"High Road Convoy", d:"Three wagons and no spare hands.", story:"Salt, iron, and a locked third wagon. The merchant pays for four: two on the tongue, two on the rear. Bandits like the bend at Ash Ford.", diff:6, days:7, gold:[44,76], ren:[3,5], need:4, tags:["Warrior","Rogue"]},
    {t:"Storm Spire", d:"The signal tower went dark in the blow.", story:"The spire lantern died in last night’s storm. Four to climb, reset the lamp, and sit the watch until the regular crew can walk the ridge.", diff:8, days:6, gold:[56,92], ren:[4,6], need:4, tags:["Mage","Cleric"]},
    {t:"Red Mill Riot", d:"The mill hands have barred the wheel.", story:"Wages, a broken gear, and a man already cut. The reeve wants four to open the yard without burning the mill. Talk first. Steel if talk dies.", diff:7, days:5, gold:[50,84], ren:[4,6], need:4, tags:["Warrior","Cleric"]},
    {t:"Crownless Hall", d:"An empty manor still has a lock worth breaking.", story:"The last heir died on the road. The hall sits. The town wants four to clear the rooms, lift the deed-chest, and put down whatever kept the servants from going back.", diff:9, days:8, gold:[70,110], ren:[5,8], need:4, tags:["Warrior","Mage"]},
    {t:"Lost Lamb", d:"A child lost a lamb past the gate.", story:"A small lamb slipped the pen at dusk and wandered toward the trees. The child is crying at the gate. Find it before dark and walk it home.", diff:1, days:1, gold:[4,8], ren:[0,1], need:1, tags:["Rogue"]},
    {t:"Fence Posts", d:"Three posts fell in the night.", story:"Wind took three fence posts along the south field. The farmer wants them stood back up and lashed before the goats notice.", diff:1, days:1, gold:[4,8], ren:[0,1], need:1, tags:["Warrior"]},
    {t:"Well Bucket", d:"The rope snapped on the village well.", story:"The bucket sits at the bottom and the rope is in two pieces. Lower a new line, hook the bucket, and haul it up.", diff:1, days:1, gold:[4,9], ren:[0,1], need:1, tags:["Rogue"]},
    {t:"Chapel Sweep", d:"The low chapel wants the floor swept.", story:"Sister Halwen wants the nave swept and the candles trimmed before evening prayer. Quiet work. A coin for the trouble.", diff:1, days:1, gold:[3,7], ren:[0,1], need:1, tags:["Cleric"]},
    {t:"Market Crates", d:"Crates need hauling to the square.", story:"A carter's wheel split. Six crates of apples sit on the road. Carry them to the square before the heat turns them.", diff:1, days:1, gold:[5,9], ren:[0,1], need:1, tags:["Warrior"]},
    {t:"Sign Board", d:"The inn sign came off its hook.", story:"The Copper Tap's sign is face down in the mud. Hang it back and tighten the bolts before the dinner crowd.", diff:1, days:1, gold:[4,8], ren:[0,1], need:1, tags:["Rogue"]},
    {t:"Herb Basket", d:"Fetch a basket of common herbs.", story:"The apothecary is short on comfrey and yarrow. The patch is just past the bridge. Fill a basket and bring it back.", diff:1, days:1, gold:[4,8], ren:[0,1], need:1, tags:["Cleric"]},
    {t:"Gate Watch", d:"Stand the gate for an afternoon.", story:"The usual watch is sick. Stand the south gate until dusk, check the carts, and wave them through.", diff:1, days:1, gold:[5,10], ren:[0,1], need:1, tags:["Warrior"]},
    {t:"Broken Cart", d:"A cart lost a wheel on the lane.", story:"A wheel sheared off a league down the lane. Help the driver brace it, fit the spare, and walk it back to town.", diff:2, days:2, gold:[8,14], ren:[0,1], need:1, tags:["Warrior"]},
    {t:"Stray Dog", d:"A mean stray is worrying the hens.", story:"A scarred dog has been at the henhouse three nights running. Drive it off or pen it. The farmer will pay either way.", diff:2, days:1, gold:[7,13], ren:[0,1], need:1, tags:["Rogue"]},
    {t:"River Crossing", d:"Guide a family across the ford.", story:"The ford is up after rain. A family with a handcart needs someone who knows the stones to walk them across.", diff:2, days:2, gold:[8,15], ren:[0,1], need:1, tags:["Rogue"]},
    {t:"Bone Pit", d:"Something old is awake in the pit.", story:"The old quarry pit has been quiet for years. Last week lights moved in it. Go down, find what woke, and end it.", diff:8, days:6, gold:[55,85], ren:[4,6], need:3, tags:["Warrior","Mage"]},
    {t:"Red Marsh", d:"The marsh road is eating travelers.", story:"Two carts vanished on the marsh road. Tracks end at the black water. Find what pulls them under and close it.", diff:8, days:6, gold:[52,82], ren:[4,6], need:3, tags:["Warrior","Cleric"]},
    {t:"Hollow Tower", d:"A tower on the ridge is lit again.", story:"The tower has been dark for a generation. Now a light burns at the top each night. Climb it and deal with whoever is there.", diff:8, days:7, gold:[58,88], ren:[4,7], need:3, tags:["Mage","Rogue"]},
    {t:"Wolf King", d:"A great wolf leads a pack on the farms.", story:"One wolf bigger than the rest is driving the pack into the fields. Hunt it. The pack scatters without it.", diff:8, days:6, gold:[54,84], ren:[4,6], need:3, tags:["Warrior","Rogue"]},
    {t:"Drowned Shrine", d:"A shrine under the lake wants quiet.", story:"Divers say the old shrine is awake. Bells ring with no one to ring them. Go down and still it.", diff:8, days:7, gold:[56,86], ren:[4,6], need:3, tags:["Cleric","Mage"]},
    {t:"Ash Wurm", d:"A wurm is burning the north wood.", story:"A wurm came up through the roots and the north wood is burning from below. Find the head of it and cut it.", diff:9, days:8, gold:[70,110], ren:[5,8], need:4, tags:["Warrior","Mage"]},
    {t:"Black Keep", d:"A keep on the moor has a new lord.", story:"The moor keep was empty. Now banners hang and riders take tithe. Go in and end the new lord's claim.", diff:9, days:8, gold:[72,112], ren:[5,8], need:4, tags:["Warrior","Rogue"]},
    {t:"Storm Crown", d:"A crown of storm sits on the peak.", story:"Lightning walks the peak in clear weather. Something is building a crown of it. Break the working before it finishes.", diff:9, days:8, gold:[74,114], ren:[5,8], need:4, tags:["Mage","Cleric"]},
    {t:"Grave Fleet", d:"Ships of bone are sailing the river.", story:"Boats with no crew are moving upriver at night. They beach and take. Sink the lead ship.", diff:9, days:8, gold:[70,108], ren:[5,8], need:4, tags:["Warrior","Cleric"]},
    {t:"Iron Saint", d:"A saint of iron walks the old road.", story:"A figure of iron walks the old pilgrim road and crushes what it meets. It was meant to guard. Stop it.", diff:9, days:9, gold:[76,116], ren:[5,8], need:4, tags:["Cleric","Warrior"]},
    {t:"Deep Gate", d:"A gate under the hills is opening.", story:"Miners broke into a gate that should have stayed shut. Things are coming through. Close it from this side.", diff:9, days:8, gold:[72,112], ren:[5,8], need:4, tags:["Mage","Warrior"]},
    {t:"Wyrm Mother", d:"The adult has come looking.", story:"The young wurm is dead but the adult followed the scent back. It is bigger and it is angry. End it before it reaches the town.", diff:9, days:9, gold:[78,118], ren:[5,9], need:4, tags:["Warrior","Mage"]},
    {t:"Last Bell", d:"The last bell of the old abbey rings.", story:"The abbey bell rings at midnight with no one to pull it. Each ring takes someone. Silence it.", diff:9, days:8, gold:[74,114], ren:[5,8], need:4, tags:["Cleric","Mage"]}
  ];

function hallComfort(){
  const ready = (S.people||[]).filter(p=>p.status==="ready"||p.status==="wounded");
  const lv = ready.length ? Math.max.apply(null, ready.map(p=>p.lv||1)) : 1;
  const byDay = 2 + Math.floor((S.day||1)/10);
  const byRen = 1 + Math.floor((S.renown||0)/20);
  return Math.max(2, Math.min(8, Math.max(lv+1, byDay, byRen)));
}
function pickFromPool(pool, taken){
  const fresh = pool.filter(x=>!taken[x.t]);
  const base = fresh.length ? fresh : pool;
  const cap = hallComfort();
  const soft = base.filter(x=>(x.diff||1) <= cap);
  const mid = base.filter(x=>{ const d=x.diff||1; return d>cap && d<=cap+2; });
  const roll = Math.random();
  if(S.day < 8){
    const easy = base.filter(x=>(x.diff||1)<=3);
    if(easy.length && roll < 0.7) return pick(easy);
  }
  if(soft.length && roll < 0.65) return pick(soft);
  if(mid.length && roll < 0.9) return pick(mid);
  return pick(base);
}
function dedupeMissions(){
  if(!S.missions) S.missions = [];
  const seen = {};
  const out = [];
  S.missions.forEach(m=>{
    if(!m) return;
    if(m.party && m.party.length){ out.push(m); return; }
    if(m.epic){
      if(seen["__epic__"]) return;
      seen["__epic__"] = true;
      out.push(m);
      return;
    }
    const key = m.t || m.id;
    if(seen[key]) return;
    seen[key] = true;
    out.push(m);
  });
  S.missions = out;
}

function ensureStretchJob(){
  const faces = (S.people||[]).filter(p=>p.status!=="dead");
  const best = faces.length ? Math.max.apply(null, faces.map(p=>p.lv||1)) : 1;
  const open = (S.missions||[]).filter(m=>m && !m.epic && !(m.party&&m.party.length));
  if(open.some(m=>{ const d=m.diff||1; return d>=best+3 && d<=best+4; })) return;
  const have = livingRoster().length;
  const pool = missionPool().filter(m=>{ const d=m.diff||1; return d>=best+3 && d<=best+4 && (m.need||1)<=have && !m.dark && !m.holy && !isDarkMission(m) && !isHolyMission(m) && !open.some(o=>o.t===m.t); });
  if(!pool.length) return;
  const src = pick(pool);
  const m = hardenDark(Object.assign({}, src));
  m.id = uid(); m.party = [];
  if(!S.missions) S.missions = [];
  S.missions.push(m);
}
function ensureComfortJob(){
  const cap = hallComfort();
  const open = (S.missions||[]).filter(m=>!m.party || !m.party.length);
  if(open.some(m=>(m.diff||1) <= cap && !isDarkMission(m))) return;
  const pool = missionPool();
  const taken = {};
  (S.missions||[]).forEach(x=>{ if(x.t) taken[x.t]=true; });
  const fit = pool.filter(x=>!taken[x.t] && (x.diff||1)<=cap);
  if(!fit.length) return;
  const m = hardenDark(Object.assign({}, pick(fit)));
  m.id = uid();
  m.party = [];
  if(!canPost(m)) return;
  if(!S.missions) S.missions = [];
  S.missions.push(m);
}

function refreshMissions(){
  const pool = missionPool();
  const want = 5 + Math.min(2, Math.floor(S.renown/15)) + 2*(S.buildings.briefs||0);
  const active = (S.missions || []).filter(m=>m.party && m.party.length);
  const open = (S.missions || []).filter(m=>!m.party || !m.party.length).filter(m=>!m.classJob);
  S.missions = active.concat(open);
  ensureEpicQuest();
  while(S.missions.filter(m=>!m.epic && (!m.party || !m.party.length)).length < want){
    const taken = {};
    S.missions.forEach(x=>{ if(x.t) taken[x.t]=true; });
    const src = pickFromPool(pool, taken);
    const m = hardenDark(Object.assign({}, src));
    m.id = uid();
    m.party = [];
    if(canPost(m)) S.missions.push(m);
    if(Object.keys(taken).length >= pool.length) break;
  }
  ensureComfortJob();
  ensureStretchJob();
  ensureWritJob();
  ensureEpicQuest();
}
function firstWritEasy(m){
  if(!m || m.epic) return false;
  const n = m.need||1;
  const ready = readyFor(m);
  if(n<=1){
    const chair = bestChairFor(m);
    if(!chair) return false;
    const w = seerWord([chair], m);
    return w==="they walk it" || w==="good chance" || w==="even" || w==="bloody";
  }
  if(n===2){
    if(ready.length<2) return false;
    const party = ready.map(p=>({p, s:power([p], m)})).sort((a,b)=>b.s-a.s).slice(0,2).map(x=>x.p);
    const w = seerWord(party, m);
    return w==="they walk it" || w==="good chance" || w==="even";
  }
  return false;
}
function writCovered(){
  const w = S.writ;
  if(!w || w.done || (S.writWins||0)>=2) return;
  const open = (S.missions||[]).filter(m=>m && (!m.party||!m.party.length) && !m.epic && writMatches(m));
  if(!open.length) return;
  if(open.some(m=>!isDarkMission(m))) return;
  const clearable = open.some(m=>{
    const ready = readyFor(m);
    if(!ready.length) return false;
    const word = seerWord(ready.slice(0, m.need||1), m);
    return ["good chance","they walk it"].indexOf(word)>=0;
  });
  if(clearable) return;
  const taken = {};
  (S.missions||[]).forEach(x=>{ if(x.t) taken[x.t]=true; });
  const pool = missionPool().filter(src=>{
    if(taken[src.t]) return false;
    const probe = hardenDark(Object.assign({}, src));
    if(isDarkMission(probe)) return false;
    return writMatches(probe);
  });
  if(!pool.length) return;
  const src = pool[Math.floor(Math.random()*pool.length)];
  const m = hardenDark(Object.assign({}, src));
  m.id = uid(); m.party = [];
  S.missions.push(m);
  note("An extra "+m.t+" was posted so the writ can be walked.","info");
}
function ensureWritJob(){
  const w = S.writ;
  if(!w || w.done) return;
  if(!S.missions) S.missions = [];
  const open = S.missions.filter(m=>!m.party || !m.party.length);
  const writMatchesOpen = open.filter(m=>writMatches(m) && !m.epic);
  const ready=livingRoster().filter(p=>p.status==="ready");
  const canDark=ready.some(p=>canWalkDark(p));
  const canHoly=ready.some(p=>canWalkHoly(p));
  const canDo = writMatchesOpen.some(m=>!(isDarkMission(m)&&!canDark) && !(isHolyMission(m)&&!canHoly));
  if(writMatchesOpen.length && !canDo && w.type!=="Dark" && w.type!=="Holy"){
    const taken = {};
    S.missions.forEach(x=>{ if(x.t) taken[x.t]=true; });
    const pool = missionPool().filter(src=>{
      if(taken[src.t]) return false;
      const probe = hardenDark(Object.assign({}, src));
      if(isDarkMission(probe)||isHolyMission(probe)) return false;
      if(w.type!=="Any" && !writMatches(probe)) return false;
      return true;
    });
    if(pool.length){
      const add = hardenDark(Object.assign({}, pool[Math.floor(Math.random()*pool.length)]));
      add.id = uid();
      add.party = [];
      S.missions.push(add);
    }
  }
  if((S.writWins||0)===0){
    const match = open.find(m=>writMatches(m) && !m.epic);
    if(match){
      if(!firstWritEasy(match)){
        if((match.need||1)>2) match.need = 1;
        for(let d=match.diff; d>=1; d--){
          match.diff = d;
          if(firstWritEasy(match)) break;
        }
      }
      return;
    }
    const taken = {};
    S.missions.forEach(x=>{ if(x.t) taken[x.t]=true; });
    const pool = missionPool().filter(src=>{
      if(taken[src.t]) return false;
      const probe = hardenDark(Object.assign({}, src));
      if(w.type!=="Any" && !writMatches(probe)) return false;
      return (probe.need||1)<=2;
    });
    let best = null;
    pool.forEach(src=>{
      if(best) return;
      const m = hardenDark(Object.assign({}, src));
      m.party = [];
      if(firstWritEasy(m)) best = m;
    });
    if(!best && pool[0]){
      best = hardenDark(Object.assign({}, pool[0]));
      best.need = 1;
      best.party = [];
      for(let d = best.diff; d>=1; d--){
        best.diff = d;
        if(firstWritEasy(best)) break;
      }
    }
    if(best && !taken[best.t]){
      best.id = uid();
      best.party = [];
      if(canPost(best)) S.missions.push(best);
    }
    return;
  }
  const matches = open.filter(m=>writMatches(m) && !m.epic);
  const plain = matches.filter(m=>!isDarkMission(m) && !isHolyMission(m));
  if(w.type==="Dark" || w.type==="Holy"){
    if(matches.length) return;
  } else if(w.type==="Any"){
    if(plain.length) return;
  } else {
    if(plain.length) return;
  }
  const pool = missionPool();
  const taken = {};
  S.missions.forEach(x=>{ if(x.t) taken[x.t]=true; });
  const match = pool.filter(x=>{
    const probe = {t:x.t};
    if(w.type==="Dark") return isDarkMission(probe);
    if(w.type==="Holy") return isHolyMission(probe);
    if(isDarkMission(probe) || isHolyMission(probe)) return false;
    if(w.type==="Any") return true;
    return jobKind(probe)===w.type;
  });
  const fresh = match.filter(x=>!taken[x.t]);
  const src = fresh.length ? pick(fresh) : null;
  if(!src) return;
  const m = hardenDark(Object.assign({}, src));
  m.id = uid();
  m.party = [];
  if(canPost(m)) S.missions.push(m);
}

function livingRoster(){
  return (S.people||[]).filter(p=>p.status!=="dead");
}
function bunkCount(){
  return (S.people||[]).filter(p=>p && p.status!=="dead" && !p.hero).length;
}
function topHallPower(n){
  const list = livingRoster().map(p=>pwrOf(p)).sort((a,b)=>b-a);
  return list.slice(0, Math.max(1,n)).reduce((s,x)=>s+(+x||0),0);
}
function epicArtifactPool(){
  return WEAPONS.concat(ARMORS).filter(x=>x.unique && !ownsUnique(x.id));
}
function grantEpicArtifact(m){
  const pool = epicArtifactPool();
  if(!pool.length){
    const bonus = 80 + (S.epicWins||0)*15;
    S.gold += bonus;
    note("No artifact remains unclaimed. The town paid "+gp(bonus)+" instead.", "level");
    return;
  }
  const it = m.artifact || pick(pool);
  const kind = WEAPONS.some(x=>x.id===it.id) ? "weapon" : "armor";
  if(!S.pendingLoot) S.pendingLoot = [];
  S.pendingLoot.push({uid:uid(), kind, id:it.id, n:it.n, atk:it.atk||0, def:it.def||0, cost:it.cost||0, unique:true, r:"artifact", tier:"artifact", from:m.t});
  note("Artifact claimed: "+it.n+" from "+m.t+". Keep or sell below.", "level");
  log("Epic reward: "+it.n+".");
}
function makeEpicQuest(){
  const wins = S.epicWins||0;
  const need = wins<=0 ? 2 : (Math.random()<0.5 ? 2 : 3);
  const used = {};
  (S.missions||[]).forEach(x=>{ if(x&&x.t) used[x.t]=true; });
  const pool = EPIC_TALES.filter(x=>!used[x.t]);
  const tale = pick(pool.length?pool:EPIC_TALES);
  const pwr = topHallPower(need);
  const diff = Math.max(4, Math.round((pwr * epicMult())/8) || 4);
  const days = 30 + rng(0, 8);
  const goldLo = 70 + wins*20 + need*10;
  const goldHi = goldLo + 50 + diff*4;
  return {
    id: uid(),
    t: tale.t,
    d: tale.d,
    story: tale.story,
    epic: true,
    kind: "Epic",
    jobType: "Epic",
    need,
    diff,
    days,
    gold: [goldLo, goldHi],
    ren: [4+wins, 8+wins],
    tags: [],
    party: [],
    snapPwr: Math.round(pwr)
  };
}
function ensureEpicQuest(){
  if(!S.missions) S.missions = [];
  if(S.missions.some(m=>m && m.epic)) return;
  if(livingRoster().length < 4) return;
  const m = makeEpicQuest();
  S.missions.unshift(m);
  log("Epic quest posted: "+m.t+".");
  try { note("👑 Epic quest pinned: "+m.t+". "+m.need+" only. "+m.days+" days in the field.", "level"); } catch(e){}
}

function needIcons(n){
  n = Math.max(1, +n||1);
  let s = "";
  for(let i=0;i<n;i++) s += `<span class="seat" title="Need ${n}">👤</span>`;
  return `<span class="seats">${s}</span>`;
}
function missionDays(m){
  if(m && m.epic) return Math.max(30, m.days||30);
  const seerCut = (S.buildings.seer||0)>=4 ? 1 : 0;
  return Math.max(1, (m.days||1) - (S.buildings.stables||0) - seerCut);
}

function loadSet(){
  try { return JSON.parse(storeGet("guildmaster_settings_v1")||"{}") || {}; } catch(e){ return {}; }
}
function saveSet(patch){
  const o = Object.assign(loadSet(), patch||{});
  try { storeSet("guildmaster_settings_v1", JSON.stringify(o)); } catch(e){}
}

const SEASON_ORDER = ["spring","summer","autumn","winter"];
const SEASON_NAME = {spring:"Spring", summer:"Summer", autumn:"Autumn", winter:"Winter"};
const SEASON_ICON={spring:"🌸",summer:"☀️",autumn:"🍂",winter:"❄️"};
const SEASON_INFO={
  spring:"Ready faces heal 3 HP each dawn. Hiring costs 10% less.",
  summer:"Road encounters are more common. Missions of 4 days or more lose power unless you have shade.",
  autumn:"Successful quests pay 15% more gold.",
  winter:"Road encounters are half as common. Wages cost 1 more gold unless you have firewood or grain."
};
function seasonIcon(){ return SEASON_ICON[seasonOf()]||"🌸"; }
function openSeasonInfo(){
  const s=seasonOf();
  const sheet=document.getElementById("sheet");
  const modal=document.getElementById("modal");
  sheet.innerHTML=`<h3>${seasonIcon()} ${SEASON_NAME[s]||s}</h3><p>${SEASON_INFO[s]||""}</p><p class="tiny">${S.seasonLeft==null?30:S.seasonLeft} days left.</p><button type="button" class="act" id="seasonOk" style="width:100%;margin-top:10px">Understood</button>`;
  modal.classList.add("show"); modal.style.display="flex";
  document.getElementById("seasonOk").onclick=()=>closeModal();
}
if(S.buildings){
  const old = Math.max(S.buildings.grounds||0, S.buildings.alley||0, S.buildings.sanctum||0, S.buildings.chapel||0);
  if(old>(S.buildings.yard||0)) S.buildings.yard = old;
  delete S.buildings.grounds; delete S.buildings.alley; delete S.buildings.sanctum; delete S.buildings.chapel;
}
function seasonOf(){ return S.season || "spring"; }
function seasonLabel(){
  const n = SEASON_NAME[seasonOf()]||"Spring";
  const left = S.seasonLeft==null?30:S.seasonLeft;
  return n+" "+left+"d";
}
function tickSeason(){
  if(!S.season) S.season = "spring";
  if(S.seasonLeft==null) S.seasonLeft = 30;
  S.seasonLeft -= 1;
  if(S.seasonLeft===5 && !S.contestWarned && !(S.contestUntil>S.day) && !S.contestDue){
    S.contestWarned = true;
    const r = (S.rival&&S.rival.name)||"the other hall";
    S.contestWarn = {id:"contest_warn", name:r, left:5, them:(S.rival&&S.rival.renown)||0, us:S.renown||0};
  }
  if(S.seasonLeft>0) return;
  const i = SEASON_ORDER.indexOf(S.season);
  S.season = SEASON_ORDER[(i+1)%4];
  S.seasonLeft = 30;
  S.contestWarned = false;
  S.shade = false;
  S.plant = false;
  S.firewood = false;
  if(S.season!=="winter") S.grain = false;
  S.seasonAsk = {id:"season_turn", season:S.season};
  S.contestDue = S.season;
  S.contestAsk = {id:"rival_contest", name:(S.rival&&S.rival.name)||"the other hall"};
  log("Season turned. Contest and season sheets are waiting.");
}
function encChance(){
  const n = loadSet().enc;
  let c = (n==null || n==="") ? 20 : Math.max(0, Math.min(40, +n||0));
  if(seasonOf()==="winter") c = Math.floor(c*0.5);
  if(seasonOf()==="summer") c = Math.min(40, Math.floor(c*1.5));
  return c;
}
function lockChance(){
  const n = loadSet().lock;
  if(n==null || n==="") return 50;
  return Math.max(0, Math.min(100, +n||0));
}
function epicMult(){
  const n = loadSet().epicMul;
  if(n==null || n==="") return 1.25;
  return Math.max(1, Math.min(2, +n||1.25));
}
function retuneEpic(){
  (S.missions||[]).forEach(m=>{
    if(!m || !m.epic || (m.party&&m.party.length)) return;
    const pwr = (m.snapPwr!=null ? m.snapPwr : topHallPower(m.need||2));
    m.diff = Math.max(4, Math.round((pwr * epicMult())/8) || 4);
  });
}

function partyOf(m){
  return (m.party||[]).map(id=>S.people.find(p=>p.id===id)).filter(Boolean);
}
function addDays(m, n){
  n = Math.max(0, n|0);
  if(!n) return;
  m.left = (m.left||1)+n;
  m.span = (m.span||m.days||1)+n;
  partyOf(m).forEach(p=>{ p.daysOut = (p.daysOut||0)+n; });
}
function encXp(party, amt){
  party.forEach(p=>{
    if(p.status==="dead") return;
    p.xp = (p.xp||0)+amt;
    const old = p.lv;
    tryLevel(p);
    if(p.lv>old) note("✦ "+p.name+" reached level "+p.lv+" on the road!", "level");
  });
}
function encHurt(party, chance, lo, hi){
  const hit = [];
  party.forEach(p=>{
    if(p.status==="dead") return;
    if(Math.random()>=chance) return;
    const dmg = rng(lo, hi);
    p.hp = Math.max(1, p.hp-dmg);
    if(p.hp < p.maxhp*0.4) p.status = "away";
    hit.push(p.name.split(" ")[0]);
  });
  return hit;
}

let ENC_Q = [];
let ENC_BUSY = false;
function runEncounters(list, done){
  ENC_BUSY = false;
  ENC_Q = list.slice();
  function next(){
    if(!ENC_Q.length){
      ENC_BUSY = false;
      done();
      return;
    }
    const job = ENC_Q.shift();
    showEncounter(job.enc, job.m, job.party, next, job.locked);
  }
  next();
}
function healPrice(p){
  const miss = Math.max(0, (p.maxhp||0) - (p.hp||0));
  return miss * 2;
}
function openHealerShop(enc, m, party, after, useSheet){
  ENC_BUSY = true;
  const modal = document.getElementById("modal");
  const box = useSheet ? document.getElementById("sheet") : document.getElementById("report");
  if(!box){ ENC_BUSY=false; after(); return; }
  if(useSheet && modal){ modal.classList.add("show"); modal.style.display="flex"; box.onclick=e=>e.stopPropagation(); }
  function paint(){
    const names = party.map(x=>x.name.split(" ")[0]).join(", ");
    const total = party.reduce((n,p)=>n+healPrice(p),0);
    box.style.display = "block";
    box.style.zIndex = useSheet ? "" : "10050";
    box.innerHTML = `<div class="row"><h3>🩹 Road sister</h3><span class="tag">${gp(S.gold)}</span></div>
      <p class="tiny">${MISSION_ICON[m.t]||"📜"} ${m.t} · ${names}</p>
      <p class="tiny">2 gold per missing hit point. Full only.</p>
      ${party.map(p=>{
        const miss = Math.max(0, (p.maxhp||0)-(p.hp||0));
        const cost = healPrice(p);
        return `<div class="card" style="margin:6px 0">
          <div class="row">${face(p)}<div><strong>${escHtml(p.name)}</strong><div class="tiny">HP ${p.hp}/${p.maxhp}${miss?(" · −"+miss):""}</div></div></div>
          <button type="button" class="act" data-heal="${p.id}" ${miss?"":"disabled"} style="width:100%;margin-top:6px">${miss?"Heal to full · "+gp(cost):"Already whole"}</button>
        </div>`;
      }).join("")}
      <button type="button" class="act" id="healAll" ${total?"":"disabled"} style="width:100%;margin-top:8px">${total?"Heal all · "+gp(total):"No one needs her"}</button>
      <button type="button" class="ghost" id="healDone" style="width:100%;margin-top:8px">Walk on</button>`;
    box.querySelectorAll("[data-heal]").forEach(b=>{
      b.onclick=()=>{
        const per = party.find(x=>x.id===b.dataset.heal);
        if(!per) return;
        const cost = healPrice(per);
        if(!cost) return;
        if(funds() < cost) return toast("Need "+gp(cost)+". Have "+gp(S.gold)+".");
        spend(cost);
        const miss = per.maxhp - per.hp;
        per.hp = per.maxhp;
        if(per.status==="wounded" && per.hp>=per.maxhp*0.75) per.status = "ready";
        note(per.name+" was sewn up on the road (−"+miss+" HP, "+gp(cost)+").", "success");
        log("Road sister healed "+per.name+" for "+cost+"g.");
        save(); paint();
      };
    });
    const all = document.getElementById("healAll");
    if(all) all.onclick=()=>{
      const bill = party.reduce((n,p)=>n+healPrice(p),0);
      if(!bill) return;
      if(funds() < bill) return toast("Need "+gp(bill)+". Have "+gp(S.gold)+".");
      party.forEach(per=>{
        const cost = healPrice(per);
        if(!cost) return;
        spend(cost);
        per.hp = per.maxhp;
        if(per.status==="wounded" && per.hp>=per.maxhp*0.75) per.status = "ready";
      });
      note("The sister cleared the party · "+gp(bill)+".", "success");
      log("Road sister healed the party for "+bill+"g.");
      save(); paint();
    };
    const healWalk = ()=>{
      try{
        note("The stool is empty.", "info");
        try{ finishRoadUi(); }catch(e){ ENC_BUSY = false; try{ closeModal(); }catch(x){} }
        after();
      }catch(err){
        ENC_BUSY = false;
        try{ closeModal(); }catch(e){}
        try{ if(after) after(); }catch(e){}
      }
    };
    const healBtn = box.querySelector("#healDone") || document.getElementById("healDone");
    if(healBtn) healBtn.onclick = healWalk;
  }
  paint();
}
function makeEpicRescue(diff){
  const lv = Math.max(1, Math.min(12, (diff||4) + rng(-1,1)));
  const p = makePerson(true, pick(Object.keys(CLASSES)), lv);
  const good = TRAITS.filter(x=>NEGATIVE_TRAITS.indexOf(x)<0);
  const bad = NEGATIVE_TRAITS.slice();
  const g1 = pick(good);
  const g2 = pick(good.filter(x=>x!==g1));
  const b1 = pick(bad);
  p.traits = Math.random()<0.45 ? [g1, g2, b1] : [g1, b1];
  p.trait = p.traits[0];
  p.quirk = pickQuirkId(p);
  if((diff||4) >= 6 && typeof outfitHire==="function") outfitHire(p);
  else if(typeof outfitStarter==="function") outfitStarter(p);
  stampPerson(p);
  p.status = "ready";
  p.mission = null;
  p.daysOut = 0;
  return p;
}
function barracksNextCost(){
  const b = BUILDINGS.barracks;
  const lv = S.buildings.barracks||0;
  if(lv>=b.max) return null;
  return b.base * (lv+1);
}
function startRescue(enc, m, party, after){
  const names = party.map(x=>x.name.split(" ")[0]).join(", ");
  const diff = rng(3,9);
  const pwr = power(party, m);
  const target = diff*6 + rng(0,5);
  const win = pwr/Math.max(1,target) + Math.random()*0.28 > 0.8;
  if(!win){
    party.forEach(hit=>{
      if(Math.random()<0.55) hit.hp = Math.max(1, (hit.hp||1) - rng(2,5));
    });
    note(names+" tried the ring (Diff "+diff+") and could not break it. The stranger went down.", "warn");
    log("Road rescue failed. Diff "+diff+".");
    save();
    try{ finishRoadUi(); }catch(e){ ENC_BUSY = false; }
    after();
    return;
  }
  encXp(party, 2 + diff);
  if(Math.random()<0.35 && party.length){
    const hit = party[Math.floor(Math.random()*party.length)];
    hit.hp = Math.max(1, (hit.hp||1) - rng(1,3));
    note("A stray cut caught "+hit.name.split(" ")[0]+" in the ring.", "warn");
  }
  note(names+" broke the ring (Diff "+diff+"). Someone still breathing.", "success");
  log("Road rescue won. Diff "+diff+".");
  const guest = makeEpicRescue(diff);
  openRescueOffer(guest, m, party, after, diff);
}
function openRescueOffer(guest, m, party, after, diff){
  ENC_BUSY = true;
  guest.hero = true; S.lastHero = S.day;
  const box = document.getElementById("sheet");
  const modal = document.getElementById("modal");
  if(!box || !modal){ ENC_BUSY=false; after(); return; }
  modal.classList.add("show"); modal.style.display="flex";
  function livingCount(){ return bunkCount(); }
  function paint(){
    const full = guest.hero ? false : livingCount() >= cap();
    const next = barracksNextCost();
    const c = CLASSES[guest.cls]||{};
    box.style.display = "block";
    box.innerHTML = `<div class="row"><h3>⚔ They live</h3><span class="tag">${gp(S.gold)}</span></div>
      <p class="tiny">${MISSION_ICON[m.t]||"📜"} ${m.t} · bench ${livingCount()}/${cap()}</p>
      <div class="card cls-${c.tag||""} hero" style="margin:8px 0">
        <div class="row">${face(guest)}<div class="names">${nameHtml(guest,"strong")}${mottoHtml(guest)}
          <div class="tiny">★ Hero · ${c.icon||""} ${guest.cls} ${guest.lv} · PWR ${pwrOf(guest)} · HP ${guest.hp}/${guest.maxhp}</div>
          <div class="tiny">${traitText(guest)} · ${roleLine(guest)} · ${quirkLine(guest)}</div>
        </div></div>
      </div>
      <p>They will sit the Copper Hall if you have a bed. Epic, scaled to Diff ${diff||"?"}.</p>
      ${full && next?`<p class="tiny">Barracks full. Next level is ${gp(next)} and opens two beds.</p>
        <button type="button" class="act" id="resBarracks" style="width:100%;margin-top:8px">Buy Barracks Lv ${(S.buildings.barracks||0)+1} · ${gp(next)}</button>`:""}
      ${full && !next?`<p class="tiny">Barracks are maxed. There is no bed left in the hall.</p>`:""}
      <button type="button" class="act" id="resJoin" ${full?"disabled":""} style="width:100%;margin-top:8px">${full?"Need a bed first":"Take them in"}</button>
      <button type="button" class="ghost" id="resNo" style="width:100%;margin-top:8px">Send them on</button>`;
    const bb = document.getElementById("resBarracks");
    if(bb) bb.onclick=()=>{

function stockRoad(kind){
  const list = kind==="weapon"?WEAPONS:kind==="armor"?ARMORS:FOODS;
  const rank = x=>rarityRank(x.r||"common");
  const normal = list.filter(x=>!x.unique && !x.road && (x.r||"")!=="artifact" && rank(x)<=2);
  const mix = normal.slice().sort(()=>Math.random()-0.5).slice(0, rng(4,6));
  const exclusive = roadList(kind).filter(x=>!ownsUnique(x.id) && (x.r==="rare"||x.r==="epic"));
  const fallback = roadList(kind).filter(x=>!ownsUnique(x.id) && rank(x)>=3);
  const star = exclusive.find(x=>x.smithStar) || pick(exclusive.length?exclusive:fallback);
  const out = mix.slice();
  if(star) out.unshift(star);

}

function roadCombatLoot(diff){
  const top = Math.max(1, ...(S.people||[]).map(p=>p.lv||1));
  const tiers = top>=7?["uncommon","rare"]:top>=5?["common","uncommon"]:top>=3?["junk","common"]:["junk"];
  const bag = WEAPONS.concat(ARMORS).filter(x=>x && tiers.indexOf(x.r)>=0 && !x.unique);

function roadLootPick(diff){

function roadSeerRoll(enc, party, m){

  if(r.win){
    const gear = r.loot ? (r.loot.n+" · "+(r.loot.r||"common")+(r.loot.atk?" +"+r.loot.atk+" ATK":"")+(r.loot.def?" +"+r.loot.def+" DEF":"")) : "no gear";
    return `<div class="seerbox"><p class="tiny">👁 This fight is a win. +${r.xp} XP${r.gold?" · +"+r.gold+" gold":""}${r.renown?" · +1 renown":""}. Gear: ${gear}.</p></div>`;
  }
  const hits = (r.hits||[]).map(h=>h.name+" −"+h.dmg+" HP").join(", ");
  return `<div class="seerbox"><p class="tiny">👁 This fight is a loss. ${hits}.</p></div>`;
}
function fightFlavor(enc, names, win, pwr){
  const foe = enc.title||"the fight";
  const diff = enc.diff||4;
  const ratio = pwr/Math.max(1, diff*6);
  const pick1 = a => a[Math.floor(Math.random()*a.length)];
  if(win){
    if(ratio>=1.6) return pick1([
      names+" fell on "+foe+" and cut through them like butter.",
      names+" barely slowed. "+foe+" was over before it began.",
      names+" walked through "+foe+" as if it were drill."
    ]);
    if(ratio>=0.9) return pick1([
      "A close, ugly fight. "+names+" pulled it out at the end.",
      names+" and the enemy traded blows, and "+names+" landed the last.",
      "Neither side had it easy. "+names+" won it late."
    ]);
    return pick1([
      names+" were outmatched and won anyway, on nerve.",
      "It should have gone the other way. "+names+" found the opening.",
      names+" took the worse of it and still broke "+foe+"."
    ]);
  }
  if(ratio>=1.3) return pick1([
    names+" had the strength and still lost. "+foe+" would not break.",
    "On paper "+names+" had it. The road disagreed."
  ]);
  if(ratio>=0.8) return pick1([
    "A close fight, and it turned. "+names+" broke off and got clear.",
    names+" matched them for a while, then the line gave. They escaped."
  ]);
  return pick1([
    foe+" routed "+names+". They ran, and they ran hurt.",
    names+" were overmatched from the first step. "+foe+" drove them off bleeding."
  ]);
}
function fightCombat(enc, m, party, names, road){
  const diff = enc.diff||4;
  const roll = enc._seerRoll || null;
  const pwr = power(party, m);
  const target = diff*6 + rng(0,5);
  const win = roll ? !!roll.win : (pwr/Math.max(1,target) + Math.random()*0.28 > 0.8);
  if(win){
    encXp(party, roll ? roll.xp : (2 + diff));
    let bits = [fightFlavor(enc, names, true, pwr)];
    const g = roll ? (roll.gold||0) : (Math.random()<0.5 ? rng(4, 6+diff*2) : 0);
    if(g){ S.gold += g; bits.push("+"+gp(g)); }
    const ren = roll ? (roll.renown||0) : (Math.random()<0.35 ? 1 : 0);
    if(ren){ S.renown += ren; bits.push("+"+ren+" Renown"); }
    const drop = roll ? grantRoadLoot(roll.loot) : roadCombatLoot(diff);
    if(drop) bits.push("took "+itemNameHtml(drop));
    if(enc.id==="wargs"){
      const pelt = {kind:"loot", n:"Warg pelt", cost:14, story:"Skinned off the pair on the trail."};
      if(stashRaw(pelt)) bits.push("kept a Warg pelt");
      else { S.gold += sellPrice(pelt); bits.push("sold a Warg pelt"); }
    }
    if(Math.random()<0.4 && (m.left||0)>1){
      m.left -= 1;
      party.forEach(p=>{ p.daysOut = Math.max(1, (p.daysOut||1)-1); });
      bits.push("−1 day");
    }
    if(Math.random()<0.2){
      if(Math.random()<0.45){
        const f = pick(FOODS);
        const item = Object.assign({kind:"food", story:"Taken on the road ("+enc.title+")."}, f);
        if(stashPush("food", f.id) || stashRaw(item)) bits.push("kept "+f.n);
        else { S.gold += sellPrice(f); bits.push("sold "+f.n); }
      } else {
        const junk = [{n:"Notched knife",cost:8},{n:"Bloody purse-cut",cost:10},{n:"Beast tooth",cost:7},{n:"Cult ribbon",cost:6},{n:"Ogre knuckle",cost:12}];
        const j = Object.assign({kind:"loot", story:"Taken on the road ("+enc.title+")."}, pick(junk));
        if(stashRaw(j)) bits.push("kept "+j.n);
        else { S.gold += sellPrice(j); bits.push("sold "+j.n); }
      }
    }
    const hit = encHurt(party, 0.12 + (enc.diff||4)*0.02, 1, 4);
    if(hit.length) bits.push(hit.join(", ")+" still took a mark");
    road(bits.join(" "), "success");
  } else {
    const diff = enc.diff||4;
    const hurt = [];
    const rolled = (roll && roll.hits) ? roll.hits : null;
    party.forEach(p=>{
      if(!p || p.status==="dead") return;
      const pre = rolled ? rolled.find(h=>h.id===p.id) : null;
      const dmg = pre ? pre.dmg : rng(4+diff, 8+diff*2);
      const before = p.hp;
      p.hp = Math.max(1, (p.hp||1) - dmg);
      const lost = before - p.hp;
      hurt.push(p.name.split(" ")[0]+" -"+lost+" HP");
    });
    encXp(party, 1);
    let bits = [fightFlavor(enc, names, false, pwr)];
    if(hurt.length) bits.push(hurt.join(", "));
    const bad = party.filter(p=>p && p.hp <= (p.maxhp||8)*0.5);
    if(bad.length) bits.push(bad.map(p=>p.name.split(" ")[0]).join(", ")+" badly hurt");
    if(Math.random()<0.5){
      addDays(m, 1);
      bits.push("+1 day");
    }
    bits.push("The hurt carries to the quest.");
    road(bits.join(" "), "fail");
  }
}

  if(enc.id==="wolves"){
