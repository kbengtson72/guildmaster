  if(item.kind==="loot") return false;
  if(item.kind==="food"){
    if(p.quirk==="no_dark" && itemHasDark(item)) return false;
    return true;
  }
  if(p.quirk==="no_dark" && itemHasDark(item)) return false;
  if(isShield(item)) return p.cls==="Warrior" || p.cls==="Cleric";
  if(item.kind==="armor"){
    const wt=armorWtOf(item);
    if(p.cls==="Mage" && wt!=="light") return false;
    if(p.cls==="Rogue" && wt==="heavy") return false;
    return true;
  }
  if(item.kind==="weapon"){
    const fam=item.fam||(isWand(item.id)?"wand":isBow(item.id)?"ranged":isBladedWeapon(item.id)?"blade":"blunt");
    const hands = item.hands || (/great|maul|two-hand/i.test(item.n||"") ? 2 : 1);
    if(fam==="shield") return p.cls==="Warrior" || p.cls==="Cleric";
    if(hands>=2 && p.cls!=="Warrior" && p.cls!=="Cleric") return false;
    if(p.cls==="Cleric" && fam!=="blunt") return false;
    if(p.cls==="Mage" && !(fam==="wand" || fam==="dagger" || (fam==="blade" && /dagger|knife/i.test(item.n||"")) || (fam==="blunt" && /staff|stave/i.test(item.n||"")))) return false;
    if(fam==="ranged" && p.cls!=="Warrior" && p.cls!=="Rogue") return false;
    if(fam==="wand" && p.cls!=="Mage") return false;
    return true;
  }
  return true;
}

function catalog(kind, id){
  const list = kind==="weapon" ? WEAPONS : kind==="armor" ? ARMORS : kind==="food" ? FOODS : kind==="kit" ? KITS : [];
  return list.find(x=>x.id===id) || null;
}
function kitOf(p){ return p && p.kit ? catalog("kit", p.kit) : null; }
function kitBits(k){
  if(!k) return "";
  const b=[];
  if(k.pwr) b.push("+"+k.pwr+" power");
  if(k.heal) b.push("+"+k.heal+" HP on return");
  if(k.wound) b.push("safer wound");
  if(k.job) b.push("+"+(k.jobp||0)+" "+k.job);
  if(k.loy) b.push("+"+k.loy+" loyalty");
  return b.join(" · ");
}
function vaultCap(){ return 4 + 3*(S.buildings.racks||0); }
function vaultFull(){ return (S.vault||[]).length >= vaultCap(); }
function stashPush(kind, id){
  const it = catalog(kind, id);
  if(!it) return false;
  if(!S.vault) S.vault = [];
  if(S.vault.length >= vaultCap()) return false;
  S.vault.push({uid:uid(), kind, id:it.id, n:it.n, icon:it.icon||"", atk:it.atk||0, def:it.def||0, heal:it.heal||0, pwr:it.pwr||0, dark:it.dark||0, gold:it.gold||0, xp:it.xp||0, loy:it.loy||0, cost:it.cost||0, unique:!!it.unique, r:it.r||rarityOf(it), desc:it.desc||"", blade:!!it.blade});
  return true;
}
function stashRaw(it){
  if(!S.vault) S.vault = [];
  if(S.vault.length >= vaultCap()) return false;
  S.vault.push(Object.assign({uid:uid()}, it));
  return true;
}
function missionTypeOf(m){ return (MISSION_TYPE[m.t]||{}).type || ""; }
function pickRarityForLoot(diff){
  const d = diff||1;
  const roll = Math.random();
  if(d>=8){
    if(roll<0.16) return "epic";
    if(roll<0.45) return "rare";
    if(roll<0.75) return "uncommon";
    return "common";
  }
  if(d>=6){
    if(roll<0.08) return "epic";
    if(roll<0.28) return "rare";
    if(roll<0.62) return "uncommon";
    if(roll<0.90) return "common";
    return "junk";
  }
  if(d>=4){
    if(roll<0.12) return "rare";
    if(roll<0.40) return "uncommon";
    if(roll<0.78) return "common";
    return "junk";
  }
  if(roll<0.08) return "uncommon";
  if(roll<0.45) return "common";
  return "junk";
}
function pickByRarity(list, r){
  let pool = list.filter(x=> (x.r||"common")===r && !x.road && !(x.unique && ownsUnique(x.id)));
  if(!pool.length) pool = list.filter(x=> (x.r||"common")===r && !x.unique && !x.road);
  return pool.length ? pick(pool) : null;
}
function rollLoot(m){
  const r = Math.random();
  const typ = missionTypeOf(m);
  const title = m.t||"";
  const junkByType = {
    Extermination:[{n:"Gnawed trophy skull", cost:6},{n:"Bundle of burnt whiskers", cost:4},{n:"Sticky ichor vial", cost:7}],
    Gathering:[{n:"Satchel of bruised herbs", cost:5},{n:"Fox pelt, half-cured", cost:8},{n:"Pocket of moonleaf stems", cost:6}],
    Escort:[{n:"Merchant's thank-you coin", cost:9},{n:"Spare mule bell", cost:4},{n:"Cracked way-lantern", cost:5}],
    Search:[{n:"Child's wooden dog", cost:3},{n:"Torn hem with a name sewn in", cost:4},{n:"Bent shepherd hook", cost:5}],
    Assault:[{n:"Notched raider knife", cost:10},{n:"Sooty tent peg", cost:3},{n:"Stolen kettle", cost:6}],
    Mystery:[{n:"Cold well-chain link", cost:7},{n:"Theater mask, one eye gone", cost:8},{n:"Bell-rope fray", cost:5}],
    Bounty:[{n:"Wanted scrap, blood-smeared", cost:6},{n:"False collector's badge", cost:11},{n:"Cut purse, empty", cost:4}],
    Survey:[{n:"Chalked march-stone chip", cost:5},{n:"Crater-glass pebble", cost:9},{n:"Damp survey ribbon", cost:4}],
    Recovery:[{n:"Church-wax seal, broken", cost:7},{n:"Waterlogged lock-plate", cost:8},{n:"Pawn ticket, unpaid", cost:5}]
  };
  const rareByTitle = {
    "Haunted Well":{kind:"weapon",id:"wellspike"},
    "Goblin Camp":{kind:"weapon",id:"ridgefang"},
    "Starfall Field":{kind:"weapon",id:"starrod"},
    "Temple Relic":{kind:"weapon",id:"oathwand"},
    "Fog Ferry":{kind:"armor",id:"fogcloak"},
    "Mask House":{kind:"armor",id:"maskhide"}
  };
  if(r < 0.50){
    const pool = junkByType[typ] || [{n:"Road dust in a twist of cloth", cost:3}];
    const j = Object.assign({kind:"loot", r:"junk", cost:pick(pool).cost||3}, pick(pool));
    j.story = "Lifted from "+title+".";
    return j;
  }
  const rarity = pickRarityForLoot(m.diff||1);
  if(rarity==="junk" || r < 0.72){
    if(Math.random()<0.35){
      const f = pickByRarity(FOODS, rarity==="junk"?"junk":(rarity==="artifact"?"rare":rarity)) || pick(FOODS.filter(x=>!x.unique));
      return Object.assign({kind:"food", tier:rarity}, f);
    }
    const pool = junkByType[typ] || [{n:"Road dust in a twist of cloth", cost:3}];
    const j = Object.assign({kind:"loot", r:"junk"}, pick(pool));
    j.story = "Lifted from "+title+".";
    return j;
  }
  if(rarity==="artifact") rarity = "epic";

  const kindRoll = Math.random();
  const kind = kindRoll<0.28 ? "food" : kindRoll<0.64 ? "weapon" : "armor";
  const list = kind==="food"?FOODS:kind==="weapon"?WEAPONS:ARMORS;
  const it = pickByRarity(list, rarity) || pickByRarity(list, "common") || pick(list.filter(x=>!x.unique));
  if(!it) return null;
  return Object.assign({kind, tier:rarity, r:it.r||rarity}, it);
}

function tryShadowLoot(m){
  const party = (m.party||[]).map(id=>(S.people||[]).find(x=>x.id===id)).filter(Boolean);
  if(!party.some(p=>p.quirk==="second_shadow")) return;
  const first = (S.pendingLoot||[])[(S.pendingLoot||[]).length-1] || null;
  if(!first && Math.random()>=0.35) return;
  if(!S.pendingLoot) S.pendingLoot = [];
  const forbid = first && (first.id||first.n);
  for(let i=0;i<8;i++){
    const roll = rollLoot(m);
    if(!roll) continue;
    let item;
    if(roll.kind==="loot") item = Object.assign({uid:uid(), from:m.t, shadow:true}, roll);
    else if(roll.kind==="food"){
      const it = catalog("food", roll.id) || roll;
      item = Object.assign({uid:uid(), kind:"food", tier:roll.tier, from:m.t, shadow:true}, it);
    } else {
      const it = catalog(roll.kind, roll.id);
      if(!it) continue;
      item = {uid:uid(), kind:roll.kind, id:it.id, n:it.n, atk:it.atk||0, def:it.def||0, cost:it.cost||0, unique:!!it.unique, tier:roll.tier, from:m.t, shadow:true};
    }
    if(item.unique || rarityOf(item)==="artifact") continue;
    if(forbid && (item.id===first.id || item.n===first.n)) continue;
    S.pendingLoot.push(item);
    note("A second shadow found "+item.n+" on "+m.t+".", "success");
    log("Shadow loot: "+item.n);
    return;
  }
}
function giveLoot(m){
  let roll = rollLoot(m);
  if(m.loot!==undefined){ roll = m.loot; m.loot = (m.loot2!==undefined?m.loot2:undefined); m.loot2 = undefined; }
  if(!roll) return null;
  if(!S.pendingLoot) S.pendingLoot = [];
  let item;
  if(roll.kind==="loot"){
    item = Object.assign({uid:uid(), from:m.t}, roll);
  } else if(roll.kind==="food"){
    const it = catalog("food", roll.id) || roll;
    item = Object.assign({uid:uid(), kind:"food", tier:roll.tier, from:m.t}, it);
  } else {
    const it = catalog(roll.kind, roll.id);
    if(!it) return;
    item = {uid:uid(), kind:roll.kind, id:it.id, n:it.n, atk:it.atk||0, def:it.def||0, cost:it.cost||0, unique:!!it.unique, tier:roll.tier, from:m.t};
  }
  S.pendingLoot.push(item);
  const rk = rarityRank(rarityOf(item));
  note((rk>=3?"A fine find: ":"They brought home ")+item.n+" from "+m.t+". Keep or sell below.", rk>=4?"level":"success");
  log("Loot from "+m.t+": "+item.n+".");
  return itemNameHtml(item);
}
function lootLabel(it){
  const name = itemNameHtml(it);
  if(it.kind==="loot") return name+" · salvage · sell "+gp(sellPrice(it));
  if(it.kind==="food") return foodBlurb(catalog("food", it.id)||it)+" · sell "+gp(sellPrice(it));
  if(isShield(it)) return name+" · offhand only · sell "+gp(sellPrice(it));
  if(it.atk) return name+" · weapon +"+it.atk+" ATK · sell "+gp(sellPrice(it));
  if(it.kind==="armor" || it.slot) return name+" · armor +"+(it.def||0)+" DEF · sell "+gp(sellPrice(it));
  return name+" · sell "+gp(sellPrice(it));
}
function keepPending(uid){
  if(!S.pendingLoot) S.pendingLoot = [];
  const ix = S.pendingLoot.findIndex(x=>x.uid===uid);
  if(ix<0) return;
  const it = S.pendingLoot[ix];
  if(vaultFull()){
    openMakeSpace(uid);
    return;
  }
  if(it.kind==="loot") stashRaw(it);
  else if(it.kind==="food") stashPush("food", it.id) || stashRaw(Object.assign({}, it, {kind:"food"}));
  else stashPush(it.kind, it.id);
  S.pendingLoot.splice(ix,1);
  markFindDone(it.n, "kept");
  toast("Kept "+it.n+".");
  save();
  paintDayReport();
  render();
}
function slotItem(p, kind){
  if(kind==="weapon") return catalog("weapon", p.weapon) || WEAPONS.find(x=>x.id===p.weapon);
  if(kind==="armor"){ ensureSlots(p); return catalog("armor", p.slots.chest||p.armor); }
  if(kind==="food") return foodOf(p);
  if(kind==="kit") return kitOf(p);
  return null;
}
function openEquipFind(findUid){

function markFindDone(name, how){
  (DAY||[]).forEach(x=>{
    if(!x || !x.t) return;
    if(x.t.indexOf(name)<0) return;
    if(x.t.indexOf("Keep or sell")<0 && x.t.indexOf("found ")<0) return;

  });
}
function equipPending(findUid, pid, hand){
  if(!S.pendingLoot) S.pendingLoot = [];
  const ix = S.pendingLoot.findIndex(x=>x.uid===findUid);
  if(ix<0) return;
  const it = S.pendingLoot[ix];
  const p = (S.people||[]).find(x=>x.id===pid);
  if(!p) return;
  if(p.status==="dead") return toast("They cannot take gear right now.");
  if(!canWield(p, it)) return toast(p.name+" will not use that.");
  const kind = it.kind;
  let oldId = null;
  ensureSlots(p);
  const slot = kind==="armor" ? armorSlotOf(it) : null;
  if(kind==="weapon") oldId = p.weapon;
  else if(kind==="armor") oldId = p.slots[slot] || (slot==="chest"?p.armor:null);
  else if(kind==="food") oldId = (!p.foodEaten && p.food) ? p.food : null;
  S.pendingLoot.splice(ix,1);
  if(kind==="weapon"){
    if(hand==="off" && canOffhand(p, it)){
      const main = p.weapon ? catalog("weapon", p.weapon) : null;
      if(main && isTwoHand(main)){
        const sheet=document.getElementById("sheet");
        const modal=document.getElementById("modal");
        sheet.innerHTML=`<h3>Equip ${itemNameHtml(it)}</h3>
          <p>${p.name} is holding ${itemNameHtml(main)}, a two-handed weapon. Equipping this shield will unequip it and send it to the armory.</p>
          <button type="button" class="act" id="shYes" style="width:100%;margin-top:10px">Equip the shield</button>
          <button type="button" class="ghost" id="shNo" style="width:100%;margin-top:6px">Cancel</button>`;
        modal.classList.add("show"); modal.style.display="flex";
        document.getElementById("shYes").onclick=()=>{ stashPush("weapon", p.weapon); p.weapon=null; if(p.offhand) stashPush("weapon", p.offhand); p.offhand=it.id; save(); closeModal(); paintDayReport(); render(); afterFind(); };
        document.getElementById("shNo").onclick=()=>{ if(!(S.pendingLoot||[]).some(x=>x.uid===it.uid)) (S.pendingLoot=S.pendingLoot||[]).push(it); closeModal(); showFindsPopup(); };
        return;
      }
      if(p.offhand) stashPush("weapon", p.offhand);
      p.offhand=it.id; save(); paintDayReport(); render(); afterFind(); return;
    }
    const oldMain=p.weapon;
    if(oldMain) stashPush("weapon", oldMain);
    p.weapon=it.id;
    if(!isTwoHand(it) && oldMain && canOffhand(p, catalog("weapon", oldMain))){ save(); openOldHandAsk(p, oldMain); return; }
    save(); paintDayReport(); render(); afterFind(); return;
  }
  else if(kind==="armor"){ p.slots[slot] = it.id; if(slot==="chest") p.armor = it.id; }
  else if(kind==="food"){ p.food = it.id; p.foodEaten = false; }
  else if(kind==="kit") p.kit = it.id;
  if(kind!=="weapon" && oldId && oldId!==it.id){
    if(!stashPush(kind, oldId)){
      const old = catalog(kind, oldId) || {id:oldId, n:oldId, kind};
      S.pendingLoot.push(Object.assign({uid:uid(), kind, from:"taken off "+p.name.split(" ")[0]}, old));
      toast(p.name.split(" ")[0]+" took "+it.n+". Old gear is in Finds — racks were full.");
    } else {
      toast(p.name.split(" ")[0]+" took "+it.n+".");
    }
  } else toast(p.name.split(" ")[0]+" took "+it.n+".");
  log(p.name+" equipped "+it.n+" from a find.");
  markFindDone(it.n, "equipped by "+p.name.split(" ")[0]);
  save(); paintDayReport(); render(); afterFind();
}

          let old = null;
          if(piece.kind==="weapon") old = catalog("weapon", ppl.weapon);
          else if(piece.kind==="armor") old = catalog("armor", ppl.armor);
          else if(ppl.food) old = catalog("food", ppl.food);
          const ix = S.vault.findIndex(x=>x.uid===equipUid);
          if(ix<0) return;
          S.vault.splice(ix,1);
          if(piece.kind==="weapon") ppl.weapon = piece.id;
          else if(piece.kind==="armor") ppl.armor = piece.id;
          else { ppl.food = piece.id; ppl.foodEaten = false; }
          if(old){
            const pay = sellPrice(old);
            S.gold += pay;
            log("Sold "+ppl.name+"'s "+old.n+" for "+pay+" gold to make rack space.");
          }
          log(ppl.name+" took "+piece.n+" off the racks.");
          save();
          paint();
        };
      });
      document.getElementById("equipBack").onclick=()=>paint();
      return;
    }
    sheet.innerHTML = `<h3>Racks full</h3>
      ${goldLine}
      <p class="tiny">Sell or equip something already stored, or buy more racks, to keep the new piece.</p>
      ${rk?`<button type="button" class="act" id="buyRacks" style="width:100%;margin-bottom:8px">Buy Racks Lv ${rk.lv+1} · ${gp(rk.cost)} · ${rk.nextCap} slots</button>`:`<p class="tiny">Racks are maxed.</p>`}
      ${(S.vault||[]).map(it=>`<div class="card"><div class="row"><strong>${itemNameHtml(it)}</strong><span class="muted">${lootLabel(it)}</span></div>
        <button class="ghost" data-dump="${it.uid}" style="width:100%;margin-top:6px">Sell this · ${gp(sellPrice(it))}</button>
        <button class="ghost" data-eq="${it.uid}" style="width:100%;margin-top:6px">Equip to a face</button>
      </div>`).join("")||"<p class='muted'>Armory empty — that should not happen.</p>"}
      <button class="act" id="afterDump" ${full?"disabled":""} style="width:100%;margin-top:8px">${full?"Make a slot first":"Keep the find"}</button>
      <button class="ghost" id="cancelDump" style="width:100%;margin-top:6px">Cancel</button>`;
    const br = document.getElementById("buyRacks");
    if(br) br.onclick=()=>{
      const n = racksNext();
      if(!n) return;
      if((S.raise && S.raise.k==="racks") || (S.raiseQ||[]).some(x=>x.k==="racks")) return toast("Racks are already building or queued.");
      if(funds() < n.cost) return toast("Need "+gp(n.cost)+". Have "+gp(S.gold)+".");
      upgrade("racks");
      toast("Racks queued.");
      paint();
    };
    const tap=(b, fn)=>{ b.onclick=(e)=>{ e.preventDefault(); e.stopPropagation(); fn(); }; b.ontouchend=(e)=>{ e.preventDefault(); e.stopPropagation(); fn(); }; };
    sheet.querySelectorAll("[data-dump]").forEach(b=>{
      tap(b, ()=>{ sellVault(b.dataset.dump, true); toast("Sold."); if(!vaultFull()){ finishKeep(); return; } paint(); });
    });
    sheet.querySelectorAll("[data-eq]").forEach(b=>{
      tap(b, ()=>paint(b.dataset.eq));
    });
    const go = document.getElementById("afterDump");
    if(go) go.onclick=()=>finishKeep();
    document.getElementById("cancelDump").onclick = ()=>{ S._buyHold=null; closeModal(); };
  }
  paint();
}
function sellPrice(it){
  return Math.max(1, Math.floor((it.cost||1)*0.5));
}

function pullShop(item){
  if(!item || !S.shop) return;
  const i = S.shop.findIndex(x=>x && x.id===item.id && (x.kind||item.kind)===(item.kind||x.kind));
  if(i>=0) S.shop.splice(i,1);
}

function buy(item){
  if(!item) return;
  const price = shopCost(item);
  if(vaultFull()){
    if(funds() < price) return toast("Can't afford that. Have "+gp(S.gold)+".");
    S._buyHold = item;
    openMakeSpace(null);
    return;
  }
  if(funds() < price) return toast("Can't afford that. Have "+gp(S.gold)+".");
  spend(price);
  if(item.feat || (S.featItem && S.featItem.id===item.id && S.featItem.kind===item.kind)) S.featItem = null;
  pullShop(item);
  stashPush(item.kind, item.id);
  log("Bought "+item.n+" for the armory.");
  save(); render();
  openBuyEquip(item);
}
function equipFromVault(uid, pid, hand){
  if(!S.vault) S.vault = [];
  const ix = S.vault.findIndex(x=>x.uid===uid);
  if(ix<0) return;
  const it = S.vault[ix];
  const p = S.people.find(x=>x.id===pid);
  if(!p) return;
  if(p.status==="away") return toast("Still out.");
  if(!canWield(p, it)) return toast(p.name+" will not use that.");
  S.vault.splice(ix,1);
  if(it.kind==="weapon"){
    if(hand==="off" && canOffhand(p, it)){
      const main = p.weapon ? catalog("weapon", p.weapon) : null;
      if(main && isTwoHand(main)){ toast("A two-handed weapon fills both hands."); save(); render(); return; }
      if(p.offhand) stashPush("weapon", p.offhand);
      p.offhand=it.id; save(); render(); return;
    }
    const oldMain=p.weapon;
    if(oldMain) stashPush("weapon", oldMain);
    p.weapon=it.id;
    if(!isTwoHand(it) && oldMain && canOffhand(p, catalog("weapon", oldMain))){ save(); openOldHandAsk(p, oldMain); return; }
    save(); render(); return;
  } else if(it.kind==="armor"){
    ensureSlots(p);
    const slot = armorSlotOf(it);
    const old = p.slots[slot] || (slot==="chest"?p.armor:null);
    if(old) stashPush("armor", old);
    p.slots[slot] = it.id;
    if(slot==="chest") p.armor = it.id;
  } else if(it.kind==="food"){
    if(p.food && !p.foodEaten) stashPush("food", p.food);
    p.food = it.id;
    p.foodEaten = false;
  } else if(it.kind==="kit"){
    if(p.kit) stashPush("kit", p.kit);
    p.kit = it.id;
  } else {
    ensureSlots(p);
    const slot = armorSlotOf(it);
    const old = p.slots[slot] || (slot==="chest"?p.armor:null);
    if(old) stashPush("armor", old);
    p.slots[slot] = it.id;
    if(slot==="chest") p.armor = it.id;
  }
  log(p.name+" equipped "+it.n+".");
  closeModal(); save(); render();
}
function eatVaultFood(uid, pid){
  const p = S.people.find(x=>x.id===pid);
  if(!p) return;
  if(p.status==="away") return toast("Still out.");
  if(!S.vault) S.vault = [];
  const ix = S.vault.findIndex(x=>x.uid===uid);
  if(ix<0) return toast("That food is gone.");
  const it = S.vault[ix];
  if(it.kind!=="food") return;
  const f = catalog("food", it.id) || it;
  S.vault.splice(ix,1);
  const bits = [];
  if(f.heal){
    const before = p.hp;
    p.hp = Math.min(p.maxhp, p.hp + f.heal + (p.quirk==="iron_gut"?3:0));
    bits.push("+"+(p.hp-before)+" HP");
    if(p.status==="wounded" && p.hp >= p.maxhp*0.75) p.status = "ready";
  }
  if(f.loy){
    bumpLoy(p, f.loy);
    bits.push("+"+f.loy+" loyalty");
  }
  const hasBonus = !!(f.pwr || f.dark || f.gold || f.xp);
  if(hasBonus && !p.food){
    p.food = f.id || it.id;
    p.foodEaten = true;
    bits.push("bonus waits for the next job");
  } else if(hasBonus && p.food){
    bits.push("road bonus wasted — slot already full");
  }
  log(p.name+" used "+f.n+" from the Armory"+(bits.length?" ("+bits.join("; ")+")":"")+".");
  toast(p.name.split(" ")[0]+" used "+f.n+(bits.length?" · "+bits.join(" · "):""));
  sweepQuit();
  closeModal(); save(); render();
}

function feedOne(pid, src, idx){
  const p = S.people.find(x=>x.id===pid);
  if(!p) return;
  let f = null;
  if(src==="carry"){ f = foodOf(p); if(f) p.food = null; }
  else { f = (S.armory||[])[idx]; if(f) S.armory.splice(idx,1); }
  if(!f) return toast("That food is gone.");
  const heal = f.heal || 2;
  p.hp = Math.min(p.maxhp, (p.hp||0)+heal);
  if(p.hp >= (p.maxhp||1)*0.75) p.status = "ready";
  log(p.name.split(" ")[0]+" ate "+(f.n||"food")+" and healed "+heal+".");
  save();
  openWoundList();
}

function eatAtSend(p, ids){
  const f = foodOf(p);
  p.foodSkip = false;
  if(!f || p.foodEaten) return;
  if(f.heal){
    const before = p.hp||0;
    p.hp = Math.min(p.maxhp, before + f.heal + (p.quirk==="iron_gut"?3:0));
    if(p.hp>before) log(p.name+" ate "+f.n+" on the way out (+"+(p.hp-before)+" HP).");
    const half = Math.floor(f.heal/2);
    if(half) (ids||[]).forEach(id=>{
      const c = S.people.find(x=>x.id===id);
      if(c && c.id!==p.id && c.quirk==="cup_bearer"){
        const b = c.hp||0; c.hp = Math.min(c.maxhp, b+half);
        if(c.hp>b) log(c.name+" drank half of "+p.name+"'s "+f.n+" (+"+(c.hp-b)+" HP).");
      }
    });
  }
  p.foodEaten = true;
}
function eatFood(pid){

  if(p.status==="away") return toast("Still out.");
  const f = foodOf(p);
  if(!f) return toast("No food in that slot.");

  const bits = [];
  if(f.heal){
    const before = p.hp;
    p.hp = Math.min(p.maxhp, p.hp + f.heal + (p.quirk==="iron_gut"?3:0));
    bits.push("+"+(p.hp-before)+" HP");
    if(p.status==="wounded" && p.hp >= p.maxhp*0.75) p.status = "ready";
  }
  if(f.loy){

  const pending = [];
  if(f.pwr) pending.push("+"+f.pwr+" power");
  if(f.dark) pending.push("+"+f.dark+" Dark power");

  if(pending.length) bits.push("next job: "+pending.join(", "));
  else bits.push("no leftover bonus");
  log(p.name+" used "+f.n+" at the Hall"+(bits.length?" ("+bits.join("; ")+")":"")+".");

function unequipFood(pid){

function sellVault(uid, quiet){

function raiseDays(nextLv){ return 5 * Math.max(1, nextLv||1); }
function raiseLine(){
  const r = S.raise;
  if(!r || !BUILDINGS[r.k]) return "";
  const b = BUILDINGS[r.k];
  return (BLD_ICON[r.k]||"")+" "+b.n+" Lv "+r.from+" → "+r.to+" · "+r.left+"d left";
}
function plannedLv(key){
  let n = S.buildings[key]||0;
  if(S.raise && S.raise.k===key) n = Math.max(n, S.raise.to||n+1);
  (S.raiseQ||[]).forEach(j=>{ if(j.k===key) n = Math.max(n, j.to||n+1); });
  return n;
}
function startRaise(key){
  const b = BUILDINGS[key];
  if(!b) return;
  if(S.buildings[key]==null) S.buildings[key]=0;
  const lv = plannedLv(key);
  if(lv>=b.max) return toast("Maxed.");
  const cost = b.base * (lv+1);
  if(!payWithBank(cost, "raise")) return;
  if(S.raise){
    if(!S.raiseQ) S.raiseQ = [];
    let days = raiseDays(lv+1);
    S.raiseQ.push({k:key, from:lv, to:lv+1, left:days, span:days, cost});
    log("Queued "+b.n+" Lv "+(lv+1)+" · "+cost+"g · "+days+"d.");
    toast(b.n+" queued behind the current raise.");
    save(); render();
    return;
  }

  let days = raiseDays(lv+1);
  if(S.roofTax){ days += S.roofTax; S.roofTax = 0; }
  S.raise = {k:key, from:lv, to:lv+1, left:days, span:days, cost:cost};
  offerHearth(S.raise);
  log("Paid "+gp(cost)+" to raise "+b.n+" to Lv "+(lv+1)+" ("+days+"d).");
  toast(b.n+" is raising. "+days+" days.");
  save(); render();
}
function hearthReady(){
  return livingRoster().some(p=>p.quirk==="hearth_hand" && p.status==="ready");
}
function offerHearth(build){
  if(!build) return;
  const h = (S.people||[]).find(p=>p.quirk==="hearth_hand" && p.status==="ready");
  if(!h) return;
  const half = Math.max(1, Math.ceil(build.left/2));
  const sheet=document.getElementById("sheet");
  const modal=document.getElementById("modal");
  sheet.innerHTML=`<h3>Hearth-hand</h3>
    <p>${h.name} can help with this build. It takes ${half} days instead of ${build.left}, and ${h.name} is away until it finishes.</p>
    <button type="button" class="act" id="hearthYes" style="width:100%;margin-top:10px">Send ${h.name.split(" ")[0]} to help</button>
    <button type="button" class="ghost" id="hearthNo" style="width:100%;margin-top:6px">Build without help</button>`;
  modal.classList.add("show"); modal.style.display="flex";
  document.getElementById("hearthYes").onclick=()=>{
    build.left = half; build.span = half; build.helper = h.id;
    h.status="away"; h.daysOut=half; h.mission="build";
    note(h.name+" is helping with the build.","info");
    save(); closeModal(); render();
  };
  document.getElementById("hearthNo").onclick=()=>{ closeModal(); };
}
function tickRaise(){
  if(!S.raise && (S.raiseQ||[]).length){
    const nxt = S.raiseQ.shift();
    S.raise = {k:nxt.k, from:nxt.from, to:nxt.to, left:nxt.left||raiseDays(nxt.to), span:nxt.span||nxt.left};
  }
  if(!S.raise) return;
  const step = 1;
  S.raise.left = Math.max(0, (S.raise.left||1)-step);
  if(S.raise.left>0){
    note(raiseLine()+".");
    return;
  }
  finishRaise("done");
}
function finishRaise(why){
  const r = S.raise;
  if(!r) return null;
  const b = BUILDINGS[r.k];
  S.buildings[r.k] = r.to;
  if(r.k==="armory") restockShop();
  const out = {key:r.k, n:b?b.n:r.k, lv:r.to};
  const helper=(S.people||[]).find(x=>x.id===r.helper);
  if(helper){ helper.status="ready"; helper.daysOut=0; helper.mission=null; note(helper.name+" finished the build and is back.","success"); }
  S.raise = null;
  const msg = out.n+" is now Lv "+out.lv+(why==="writ"?" (writ).":".");
  log(msg); note(msg, "level");
  const nxt = (S.raiseQ||[]).shift();
  if(nxt){
    S.raise = {k:nxt.k, from:nxt.from, to:nxt.to, left:nxt.left||raiseDays(nxt.to), span:nxt.span||nxt.left||raiseDays(nxt.to), cost:nxt.cost||0};
    const nb = BUILDINGS[nxt.k];
    note("Crew moves to "+((nb&&nb.n)||nxt.k)+" Lv "+nxt.to+" · "+S.raise.left+"d.", "level");
    log("Queue: started "+((nb&&nb.n)||nxt.k)+" Lv "+nxt.to+".");
  }
  return out;
}
function cancelRaise(){
  const r = S.raise;
  if(!r) return;
  const back = Math.max(1, Math.floor((r.cost||0)/2));
  const nm = (BUILDINGS[r.k]||{}).n || r.k;
  const box = document.getElementById("report");
  if(!box){ if(confirm("Stop building "+nm+"? You get "+back+"g back.")) doCancelRaise(); return; }
  box.style.display = "block";
  box.innerHTML = `<p>Stop building <b>${nm} Lv ${r.to}</b>?</p><p>You get ${gp(back)} back (half of ${gp(r.cost||0)}). ${r.left||0}d of work is lost.</p><div style="display:flex;gap:8px"><button class="ghost" id="haltNo" style="flex:1">Keep building</button><button class="act" id="haltYes" style="flex:1">Stop · ${gp(back)} back</button></div>`;
  document.getElementById("haltNo").onclick = ()=>{ box.style.display = "none"; };
  document.getElementById("haltYes").onclick = ()=>{ box.style.display = "none"; doCancelRaise(); };
}
function doCancelRaise(){
  const r = S.raise;
  if(!r) return;
  const back = Math.max(1, Math.floor((r.cost||0)/2));
  const helper=(S.people||[]).find(x=>x.id===r.helper);
  if(helper){ helper.status="ready"; helper.daysOut=0; helper.mission=null; }
  S.gold += back;
  const n = (BUILDINGS[r.k]||{}).n || r.k;
  S.raise = null;
  log("Halted "+n+". Refund "+gp(back)+".");
  toast("Halted "+n+". "+gp(back)+" back.");
  save(); render();
}
function upgrade(key){ startRaise(key); }

    }).join("")+`<button type="button" class="ghost" id="bsPop" style="width:100%;margin-top:6px">Cancel last in queue (no refund)</button></div>`;

  html += `<button type="button" class="act" id="bsHall" style="width:100%;margin-top:8px">Go to Hall upgrades</button>
    <button type="button" class="ghost" id="bsClose" style="width:100%;margin-top:8px">Close</button>`;
  sheet.innerHTML = html;
  modal.classList.add("show"); modal.style.display="flex";
  const h=document.getElementById("bsHalt"); if(h) h.onclick=()=>{ closeModal(); cancelRaise(); };
  const pp=document.getElementById("bsPop"); if(pp) pp.onclick=()=>{ if(S.raiseQ&&S.raiseQ.length){ const j=S.raiseQ.pop(); toast("Dropped "+((BUILDINGS[j.k]||{}).n||j.k)+" from queue."); save(); render(); openBuildSheet(); } };
  document.getElementById("bsHall").onclick=()=>{ closeModal(); tab="hall"; render(); };
  document.getElementById("bsClose").onclick=closeModal;
}


function gearNames(p){

const IDB_NAME="copperhall_db";
const IDB_STORE="kv";
let _idbMem = {};
function idbOpen(cb){
  try{
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = function(){
      const db = req.result;
      if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
    };
    req.onsuccess = function(){ cb(req.result); };
    req.onerror = function(){ cb(null); };
  }catch(e){ cb(null); }
}
function idbPut(k,v){
  _idbMem[k]=v;
  idbOpen(function(db){
    if(!db) return;
    try{
      db.transaction(IDB_STORE,"readwrite").objectStore(IDB_STORE).put(v,k);
    }catch(e){}
  });
}
function idbGet(k, cb){
  if(_idbMem[k]!=null){ cb(_idbMem[k]); return; }
  idbOpen(function(db){
    if(!db){ cb(null); return; }
    try{
      const q = db.transaction(IDB_STORE,"readonly").objectStore(IDB_STORE).get(k);
      q.onsuccess = function(){ if(q.result!=null) _idbMem[k]=q.result; cb(q.result||null); };
      q.onerror = function(){ cb(null); };
    }catch(e){ cb(null); }
  });
}

function fillFromFullSave(){
  const bags = [];
  try { if(_idbMem && _idbMem["guildmaster_v1"]) bags.push(JSON.parse(_idbMem["guildmaster_v1"])); } catch(e){}
  try { const raw=storeGet("guildmaster_v1"); if(raw) bags.push(JSON.parse(raw)); } catch(e){}
  bags.forEach(src=>{
    if(!src || typeof src!=="object") return;
    if((src.day||0)!==(S.day||0)) return;
    const ids=(S.people||[]).map(p=>p.id).filter(Boolean).sort().join(",");
    const oids=(src.people||[]).map(p=>p.id).filter(Boolean).sort().join(",");
    if(ids && oids && ids!==oids) return;
    function missing(v){
      return v==null || v==="" || (Array.isArray(v)&&!v.length);
    }
    ["contestUntil","contestParty","contestTheir","rival","rivalWritAsk","raiseQ","featItem","featAsk","bloodAsk","saintAsk","graveAsk","poached","dawnSing","nextFeat","cookUntil","glutUntil","tapDry","roofTax","loan","lastHero","hallEvent","hallEventLog","_roadStall"].forEach(k=>{
      if(missing(S[k]) && src[k]!=null && !missing(src[k])) S[k]=src[k];
    });
    ["plant","shade","grain","firewood","doubleWrit","featBadge","gameOver","forceSeek","writPing"].forEach(k=>{
      if(!S[k] && src[k]) S[k]=src[k];
    });
  });
}
function hallLived(d){
  if(!d) return false;
  if((d.day||1)>1) return true;
  if((d.renown||0)>0) return true;

  if((d.log||[]).length>1) return true;

}
function hallScore(d){

}
function richerHall(a,b){

  if(!hallLived(b)) return a;
  return hallScore(a)>=hallScore(b) ? a : b;
}

function storedHall(){
  let best = null;

  function take(d){ if(d && hallLived(d)) best = richerHall(best, d); }
  try{
    if(_idbMem["guildmaster_slots_v1"]){
      const sl = JSON.parse(_idbMem["guildmaster_slots_v1"]);
      const cur = sl && sl.list && sl.list[sl.current];
      if(cur) take(cur.data);
      if(sl && sl.list) Object.keys(sl.list).forEach(k=>take(sl.list[k].data));
    }
  }catch(e){}
  try{
    if(_idbMem["guildmaster_v1"]) take(JSON.parse(_idbMem["guildmaster_v1"]));
  }catch(e){}
  try{
    const raw = storeGet("guildmaster_slots_v1");
    if(raw){
      const sl = JSON.parse(raw);
      const cur = sl && sl.list && sl.list[sl.current];
      if(cur) take(cur.data);
      if(sl && sl.list) Object.keys(sl.list).forEach(k=>take(sl.list[k].data));
    }
  }catch(e){}
  try{
    const raw = storeGet("guildmaster_v1");
    if(raw) take(JSON.parse(raw));
  }catch(e){}
  return best;
}
function save(force){
  const snap = snapshot();
  const old = storedHall();
  if(!S._wipeOk && hallLived(old) && hallScore(old) > hallScore(snap)+50) return;
  if(!force){
    if(hallLived(old) && !hallLived(snap)) return;
    if(hallLived(old) && (old.day||1) > (S.day||1)) return;
  }
  try { writeName(snap); } catch(e){}
  readSlots();
  if(!SLOTS.list[SLOTS.current]) SLOTS.list[SLOTS.current] = { name:"Hall", data:null };
  SLOTS.list[SLOTS.current].data = snapshot();
  writeSlots();
  storeSet("guildmaster_v1", JSON.stringify(S));

function load(){

  if(cur && hallLived(cur.data) && applySnap(cur.data) && (S.people||[]).length) return true;
  const d = storedHall();
  if(d && applySnap(d) && (S.people||[]).length) return true;
  try{
    const raw = storeGet("guildmaster_v1");
    if(raw){
      const o = JSON.parse(raw);
      if(hallLived(o)){
        Object.assign(S, o);
        if(!S.people) S.people = [];
        if((S.people||[]).length){
          try { healHallEvent(true); } catch(e){}
          SLOTS.list[SLOTS.current].data = snapshot();
          writeSlots();
          return true;
        }
      }
    }
  }catch(e){}
  return !!(S.people && S.people.length);
}

function awayReason(p){
  if(!p) return "";
  if(p.status!=="away") return p.status||"";
  if(p.mission==="contest") return "contest";
  if(p.mission==="build") return "build";
  if(p.homeWhy==="levy") return "levy";
  if(p.homeWhy==="watch") return "watch";
  if(p.homeWhy==="kin" || (p.kinUntil && S.day < p.kinUntil)) return "kin";
  if(p.graveWith) return "grave";
  return "away";
}
function awayLeft(p){
  if(!p || p.status!=="away") return 0;
  if(p.mission==="contest" && S.contestUntil>S.day) return Math.max(1, S.contestUntil-S.day);
  if(p.kinUntil && S.day < p.kinUntil) return Math.max(1, p.kinUntil-S.day);
  if(p.mission==="build" && S.raise) return Math.max(1, S.raise.left||p.daysOut||1);
  if(p.graveWith) return 0;
  return Math.max(0, +p.daysOut||0);
}
function awayOutLine(p){
  if(!p || p.status!=="away") return "";
  const why = awayReason(p);
  if(why==="grave") return " · OUT: grave · with the body";
  const label = (why==="away" && p.mission) ? p.mission : why;
  const left = awayLeft(p);
  if(label && left) return " · OUT: "+label+" · "+left+"d left";
  if(label) return " · OUT: "+label;
  return "";
}
function healContest(){
  const away = (S.people||[]).filter(p=>p && p.status==="away" && p.mission==="contest");
  if(!away.length) return;
  const ids = away.map(p=>p.id);
  const party = (S.contestParty||[]).filter(id=>ids.indexOf(id)>=0);
  ids.forEach(id=>{ if(party.indexOf(id)<0) party.push(id); });
  S.contestParty = party;
  if(!S.contestUntil){
    const left = Math.max(1, ...away.map(p=>Math.max(1, +p.daysOut||1)));
    S.contestUntil = S.day + left;
  }
  if(S.contestUntil>S.day){
    const left = Math.max(1, S.contestUntil - S.day);
    away.forEach(p=>{ p.daysOut = left; });
  }
}
function contestJob(){
  try { healContest(); } catch(e){}
  if(!S.contestUntil || S.day>=S.contestUntil || !(S.contestParty||[]).length) return null;
  const left = Math.max(1, S.contestUntil - S.day);
  const rname = (S.rival && S.rival.name) || "";
  return {
    id:"contest",
    t:"Contest",
    party:S.contestParty.slice(),
    left,
    span:4,
    epic:false,
    contest:true,
    rival:rname
  };
}

function eventAwayChips(){
  const covered = {};
  (typeof fieldJobs==="function"?fieldJobs():[]).forEach(m=>(m.party||[]).forEach(id=>covered[id]=1));
  const icons = {kin:"🏠", levy:"⚖️", watch:"🛡️", build:"🔨", grave:"🪦", contest:"🏴", away:"🚶"};
  const spans = {kin:4, levy:5, watch:2, build:1, contest:4};
  const labels = {kin:"Home", levy:"Levy", watch:"Watch", build:"Build", grave:"Grave", contest:"Contest", away:"Away"};
  return (S.people||[]).filter(p=>p && p.status==="away" && !covered[p.id]).map(p=>{
    const why = p.mission==="contest"?"contest":p.mission==="build"?"build":p.graveWith?"grave":(p.homeWhy||(p.mission?"away":"away"));
    let left = awayLeft(p);
    let span = Math.max(left||1, spans[why]||left||1);
    if(why==="build" && S.raise && S.raise.span) span = Math.max(span, S.raise.span);
    if(why==="grave"){ left = 0; span = 1; }
    if(why!=="grave" && left<1) left = Math.max(1, +p.daysOut||1);
    const pct = why==="grave" ? 0 : Math.max(0, Math.min(1, (span-left)/span));
    const dash = (94.2*(1-pct)).toFixed(1);
    const icon = icons[why]||"🚶";
    const nm = (p.name||"").split(" ")[0];
    const label = (why==="kin"||why==="levy"||why==="watch") ? nm : (labels[why]||"Away");
    const title = why==="grave" ? (nm+" · Grave · with the body") : (nm+" · "+(labels[why]||why)+(left?" · "+left+"d":""));
    const attr = why==="contest" ? 'data-contest="1"' : 'data-awayid="'+p.id+'"';
    const mark = why==="grave" ? "" : String(left);
    return `<div class="meter">
      <button type="button" class="meterChip on fieldChip" ${attr} title="${title}">
        <svg viewBox="0 0 36 36" aria-hidden="true">
          <circle class="rg-bg" cx="18" cy="18" r="15"></circle>
          <circle class="rg-fg" cx="18" cy="18" r="15" style="stroke-dashoffset:${dash}"></circle>
        </svg>
        <span class="fieldIco">${icon}</span>
        ${mark?`<span class="fieldMark">${mark}</span>`:""}
      </button>
      <div class="meterLbl">${label}</div>
    </div>`;
  }).join("");
}

function healPerDawn(){ return 3 + (S.buildings.infirmary||0)*2; }
function daysUntilReady(p){
  if(!p || p.status!=="wounded") return 0;
  const need = (p.maxhp||1)*0.75;
  if((p.hp||0) >= need) return 0;
  const step = Math.max(1, healPerDawn());
  return Math.ceil((need - (p.hp||0)) / step);
}
function paintWoundChip(){
  const wrap = document.getElementById("woundMeter");
  const el = document.getElementById("woundChip");
  const mk = document.getElementById("woundMark");
  const tx = document.getElementById("woundText");
  if(!wrap || !el) return;
  const hurt = (S.people||[]).filter(p=>p.status==="wounded");
  if(!hurt.length){
    wrap.hidden = true;
    return;
  }
  wrap.hidden = false;
  const nextP = hurt.slice().sort((a,b)=>daysUntilReady(a)-daysUntilReady(b))[0];
  const next = daysUntilReady(nextP);
  const need = Math.max(1, (nextP.maxhp||1)*0.75);
  const have = Math.max(0, Math.min(need, nextP.hp||0));
  const pct = Math.max(0.06, Math.min(1, have/need));
  const ring = el.querySelector(".rg-fg");
  if(ring){
    ring.style.strokeDasharray = "94.2";
    ring.style.strokeDashoffset = String(94.2 * (1-pct));
  }
  if(mk){ mk.style.display=""; mk.textContent = String(hurt.length); }
  if(tx) tx.textContent = next<=0 ? "Soon" : next+"d";
  el.title = hurt.length+" wounded · "+(nextP.name||"")+" in "+next+"d";
}
function paintBankChip(){
  const el = document.getElementById("bankChip");
  const ic = document.getElementById("bankIcon");
  const mk = document.getElementById("bankMark");
  const tx = document.getElementById("bankText");
  if(!el) return;
  const cap = bankCap() || 150;
  const d = S.deposit||0;
  const pct = cap ? Math.max(0, Math.min(1, d/cap)) : 0;
  const ring = el.querySelector(".rg-fg");
  if(ring) ring.style.strokeDashoffset = String(94.2 * (1-pct));
  el.className = d>0 ? "on" : "idle";
  const owe = (typeof loanOf==="function" ? loanOf() : (S.loan||0)) > 0;
  if(ring) ring.style.stroke = owe ? "#e07070" : "";
  if(ic) ic.textContent = "🏦";
  if(mk){ mk.style.display=""; mk.textContent = String(d); mk.style.color = owe ? "#e07070" : ""; }
  if(tx){ tx.textContent = d+"/"+cap; tx.style.color = owe ? "#e07070" : ""; }
  el.title = "Vault "+d+" / "+cap;
}

function loanOf(){ const n = Number(S.loan); return Math.max(0, Math.floor(isFinite(n)?n:0)); }
function loanRate(){
  const lv = bankLv();
  if(lv>=4) return 0.01;
  if(lv>=3) return 0.02;
  if(lv>=2) return 0.03;
  return 0.04;
}
function loanRatePct(){ return Math.round(loanRate()*100); }
function loanRoom(){ return Math.max(0, bankCap() - loanOf()); }
function loanInterestDue(){
  const n = loanOf();
  if(n<=0) return 0;
  return Math.max(1, Math.ceil(n * loanRate()));
}
function tickLoan(){
  if(loanOf()<=0) return;
  const due = loanInterestDue();
  let left = due;
  const fromPurse = Math.min(Math.max(0, S.gold||0), left);
  S.gold = Math.max(0, (S.gold||0) - fromPurse);
  left -= fromPurse;
  const fromVault = Math.min(Math.max(0, S.deposit||0), left);
  S.deposit = Math.max(0, (S.deposit||0) - fromVault);
  left -= fromVault;
  const paid = due - left;
  if(left<=0){
    note("Bank took "+gp(paid)+" interest"+(fromVault?" ("+gp(fromVault)+" from the vault)":"")+". Owe "+gp(loanOf())+".","warn");
    log("Bank took "+paid+" interest. Owe "+loanOf()+".");
  } else {
    S.loan = loanOf() + left;
    note("Bank could only take "+gp(paid)+" of "+gp(due)+" interest. Unpaid "+gp(left)+" added to the debt. Owe "+gp(loanOf())+".","fail");
    log("Loan unpaid. +"+left+" · owe "+S.loan+".");
  }
}

function paintWritChip(){
  const el = document.getElementById("writChip");
  const ic = document.getElementById("writIcon");
  const mk = document.getElementById("writMark");
  const tx = document.getElementById("writText");
  if(!el || !ic) return;
  const w = S.writ;
  const live = w && !w.done && S.day >= WRIT_UNLOCK;
  const ring = el.querySelector(".rg-fg");
  if(!live){
    el.className = "idle";
    ic.textContent = "📜";
    if(mk){ mk.textContent=""; mk.style.display="none"; }
    if(ring) ring.style.strokeDashoffset = "94.2";
    if(tx) tx.textContent = "Nothing";
    el.title = "No writ";
    return;
  }
  el.className = "on";
  ic.textContent = w.icon || "📜";
  const left = Math.max(0, (w.due||S.day)-S.day);
  const span = Math.max(1, (w.due||S.day) - (w.posted||S.day));
  const done = Math.max(0, span - left);
  const pct = Math.max(0, Math.min(1, done/span));
  if(mk){ mk.style.display=""; mk.textContent = String(left); }
  if(ring) ring.style.strokeDashoffset = String(94.2 * (1-pct));
  if(tx) tx.textContent = w.title || "Writ";
  el.title = (w.title||"Writ")+" · "+left+"d";
}

      const ia = chain.findIndex(x=>(x.m.id||x.m.t)===(a.id||a.t));
      const ib = chain.findIndex(x=>(x.m.id||x.m.t)===(b.id||b.t));
      if(ia>=0 && ib>=0) return ia-ib;
      if(ia>=0) return -1;
      if(ib>=0) return 1;
    }
    if(a.epic && !b.epic) return -1;
    if(b.epic && !a.epic) return 1;
    return (b.diff||0)-(a.diff||0);
  });
  return roster + (active.length?`<p class="ok" style="margin:4px 8px 8px">⚔ ${active.length} quest${active.length>1?"s":""} in the field</p>`:"") + jobs.map(m=>{
   try {
    const busy = m.party && m.party.length;
    const left = busy ? (m.left!=null?m.left:(S.people.find(p=>m.party.includes(p.id))||{}).daysOut) : 0;
    const span = busy ? (m.span||missionDays(m)||left||1) : missionDays(m);
    const pct = busy ? Math.max(8, 100*left/Math.max(1,span)) : 0;
    const ic = m.epic ? "👑" : (MISSION_ICON[m.t]||"📜");
    const lootPick = !busy && (S.buildings.seer||0)>=1 && bestLootId()===(m.id||m.t);
    return `<div class="card ${busy?"active-job":""} ${lootPick?"loot-pick":""}" ${m.epic||lootPick?'style="border-color:#e0b84a"':""}>
      ${lootPick?`<div class="loot-banner">◆ BEST LOOT · ${((lootChain()[0]||{}).party||[]).map(p=>{const live=(S.people||[]).find(x=>x.id===p.id)||p; return (live.name||"").split(" ")[0];}).join(" · ")||"good chance"}</div>`:""}
      <div class="row"><h3>${busy?"⏳ ":""}${ic} ${m.t||"Quest"}</h3><span class="tag">${m.epic?(busy?left+"d left":"EPIC · Diff "+m.diff+" · "+missionDays(m)+"d"):(busy? left+"d left":"Diff "+m.diff+" · "+missionDays(m)+"d")}</span></div>
      <p class="tiny"><b>${typeMark(m)}</b>${darkMark(m)}${holyMark(m)}${writMatches(m)&&S.writ&&!S.writ.done?" · 📜 writ mark":""}</p>
      <p class="tiny">${m.d}</p>
      ${busy?`<div class="cdbar"><i style="width:${pct}%"></i></div>
      <p class="ok">IN THE FIELD · ${left} day${left===1?"":"s"} remaining</p>
      <p class="tiny">Party: ${m.party.map(id=>{const p=S.people.find(x=>x.id===id); return p? (CLASSES[p.cls].icon+" "+p.name):"";}).join(", ")}</p>
      <button type="button" class="ghost" data-recall="${m.id}" style="width:100%;margin-top:6px">Bring them home</button>`:
      `<p class="tiny">${needIcons(m.need)} · Pay ${payLabel(m)}${m.epic?" · exactly "+m.need+", no extras":" · extra bodies −25% gold each"}</p>
      ${questLootLine(m)}
      ${chainSendBtn(m)}
      ${m.epic?`<p class="tiny">Pinned. ${missionDays(m)} days in the field. Reward: a gold artifact and extra loot.</p>`:""}
      ${seerText(m)}
      ${m.epic?"":`<p class="tiny">Favors ${favorMarks(m)}</p>`}
      <button class="act" data-send="${m.id}" data-title="${escHtml(m.t||"")}" data-diff="${m.diff||1}">Assign party</button>
      ${(S.buildings.briefs||0)&&!m.epic?`<button class="ghost" data-redraw="${m.id}" style="width:100%;margin-top:6px">Break the seal · ${gp(briefCost())}</button>`:""}
      ${thiefBtn(m)}`}
    </div>`;
   } catch(e){ const stk=String(e&&e.stack||"").split("\n").slice(0,3).join(" | "); return `<div class="card"><p class="tiny">This quest could not be drawn.</p><p class="tiny">${String((e&&e.message)||e)}</p><p class="tiny">${stk}</p><button class="ghost" data-send="${m.id}" data-title="${escHtml(m.t||"")}" data-diff="${m.diff||1}">Open</button></div>`; }
  }).join("");
}

function shopCost(it){
  let n = (it && it.cost)||0;
  if((S.glutUntil||0) > S.day) n = Math.max(1, Math.floor(n*0.8));
  const wo = typeof writOil==="function" ? writOil() : null;
  if(wo && it && it.kind==="kit" && it.id===wo.id) n = Math.max(1, Math.floor(n*0.8));
  return n;
}

function raiseOffer(key){
  const b = BUILDINGS[key];
  if(!b) return "";
  const lv = plannedLv(key);
  if(lv>=b.max) return `<p class="tiny">${b.n} is maxed (Lv ${b.max}).</p>`;
  const cost = b.base * (lv+1);
  const days = raiseDays(lv+1);
  const busy = S.raise && S.raise.k===key;
  const queued = (S.raiseQ||[]).some(j=>j.k===key);
  const canPay = funds() >= cost;
  const label = busy ? ("Raising · "+S.raise.left+"d left") : queued ? ("Queued · next "+gp(cost)+" · "+days+"d") : (!canPay ? ("Not enough gold · "+b.n+" Lv "+(lv+1)+" · "+gp(cost)) : ("Raise "+b.n+" to Lv "+(lv+1)+" · "+gp(cost)+" · "+days+"d"));
  const seerNow = ["Live odds only.","Job power, red to gold.","Recommended power and a fill bar.","Auto-picks the best party.","Blesses the job, +4 power."];
  const blurb = key==="seer" ? ("Now: "+(seerNow[lv]||"")+" Next: "+(seerNow[lv+1]||"max.")) : b.desc;
  return `<p class="tiny">${blurb}</p><button type="button" class="act" data-up="${key}" ${lv>=b.max||(!busy&&!queued&&!canPay)?"disabled":""} style="width:100%;margin-top:6px">${label}</button>`;
}
function vaultView(){

  if(!S.vault.length) return `<div class="card"><h3>Armory</h3><p class="muted">Empty racks (${vaultCap()} slots). Buy from the Merchant.</p>${raiseOffer("racks")}</div>`;
  return `<div class="card"><h3>Armory</h3>${raiseOffer("racks")}<p class="tiny">${S.vault.length}/${vaultCap()} on the rack. Equip someone home, or sell for half price. Upgrade Racks for more slots.</p></div>
    ${S.vault.map(it=>`<div class="card"><div class="row"><strong>${it.kind==="food"?(it.icon||(catalog("food",it.id)||{}).icon||"🍖")+" ":""}${itemNameHtml(it)}</strong><span class="muted">${it.kind} · ${rarityOf(it)} · ${it.kind==="food"?foodBits(catalog("food",it.id)||it) : (it.atk?("+"+it.atk+" ATK"):("+"+(it.def||0)+" DEF"))} · sell ${gp(sellPrice(it))}</span></div>
      ${it.kind==="loot"?`<p class="tiny">${it.story||"Salvage. Sell it."}</p>`:`<div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:6px">
        ${it.kind==="food"?`<p class="tiny" style="width:100%;margin:0 0 4px">${(catalog("food",it.id)||it).desc||foodBlurb(it)}</p>`:""}
        ${ready.filter(p=>canWield(p,it)).map(p=>{
          ensureSlots(p);
          const cur = it.kind==="armor" ? catalog("armor", (p.slots||{})[armorSlotOf(it)]|| (armorSlotOf(it)==="chest"?p.armor:null)) : slotItem(p, it.kind);
          const now = cur ? (itemNameHtml(cur)+(it.kind==="weapon"?" +"+cur.atk+" ATK":it.kind==="armor"?" +"+cur.def+" DEF":" "+foodBits(cur))) : "empty";
          const nv = it.kind==="weapon"?(it.atk||0):it.kind==="armor"?(it.def||0):0;
          const ov = cur ? (it.kind==="weapon"?(cur.atk||0):it.kind==="armor"?(cur.def||0):0) : 0;
          const d = nv-ov;
          const delta = (it.kind==="weapon"||it.kind==="armor") ? (d>0?` <b style="color:#7dcea0">(+${d})</b>`:d<0?` <b style="color:#e74c3c">(${d})</b>`:` <span class="tiny">(+0)</span>`) : "";
          const offOk = it.kind==="weapon" && canOffhand(p, it);
          const off = offOk ? catalog("weapon", p.offhand) : null;
          const offNow = off ? (itemNameHtml(off)+" +"+(off.atk||0)+" ATK") : "empty";
          const shield = isShield(it);
          const hands = offOk
            ? `<div class="tiny">Main: ${now}${delta}</div><div class="tiny">Off: ${offNow}</div><div class="row" style="gap:6px;margin-top:4px">${shield?"":`<button type="button" class="act" data-equip="${it.uid}|${p.id}|main" style="flex:1">Main hand</button>`}${(isTwoHand(it)||isTwoHand(catalog("weapon", p.weapon)))?"":`<button type="button" class="ghost" data-equip="${it.uid}|${p.id}|off" style="flex:1">Off hand</button>`}</div>`
            : `<button type="button" class="ghost" data-equip="${it.uid}|${p.id}|main" style="text-align:left;width:100%">${CLASSES[p.cls].icon} ${p.name.split(" ")[0]}<br><span class="tiny">Now: ${now}${delta}</span></button>`;
          return `<div class="card" style="margin:6px 0;text-align:left">${CLASSES[p.cls].icon} ${p.name.split(" ")[0]}${hands}</div>`;
        }).join("")||"<span class='muted'>No one home can use this.</span>"}
      </div>`}
      <button class="ghost" data-sell="${it.uid}" style="width:100%;margin-top:8px">Sell · ${gp(sellPrice(it))}</button>
    </div>`).join("")}`;
}

  });

    const m = findMission(b.dataset.quick) || (S.missions||[]).find(x=>x && x.t===b.dataset.title);

    if(!slot) return;
    const added = ((S._chainAdds||{})[m.id]||[]);
    const ids = slot.party.map(p=>p.id).concat(added);

      const left = chainLeftovers();
      const idx = lootChain().findIndex(x=>(x.m.id||x.m.t)===(m.id||m.t));

  function askFoodUseAll(jobs, packed, ix){

function askArmoryFoodAll(jobs, foods){
  const sheet=document.getElementById("sheet");
  const modal=document.getElementById("modal");
  const list = foods.map((f,i)=>{
    const fd = FOODS.find(x=>x.id===f.id) || {};
    return `<button type="button" class="act" data-afa="${i}" style="width:100%;margin-top:6px">${fd.icon||""} ${fd.n||f.id} · ${fd.desc||""}</button>`;
  }).join("");
  sheet.innerHTML=`<h3>Equip food from the Armory?</h3>
    <p class="tiny">No one is carrying food. The Armory has ${foods.length}.</p>
    ${list}
    <button type="button" class="ghost" id="afaSkip" style="width:100%;margin-top:8px">Go without</button>`;
  modal.classList.add("show"); modal.style.display="flex";
  sheet.querySelectorAll("[data-afa]").forEach(b=>b.onclick=()=>{
    const f = foods[+b.dataset.afa];
    const ids = [...new Set(jobs.flatMap(j=>j.ids))];
    const faces = ids.map(id=>S.people.find(x=>x.id===id)).filter(Boolean);

    sheet.innerHTML=`<h3>Who gets ${fd.n||"the food"}?</h3>
      ${faces.map(p=>`<div class="row" data-who="${p.id}" style="margin:6px 0;cursor:pointer"><div class="who">${face(p)}<div class="names">${nameHtml(p,"strong")}${mottoHtml(p)}<div class="tiny">PWR ${pwrOf(p)} · ${roleLine(p)} · HP ${p.hp}/${p.maxhp}</div><div class="tiny">${quirkLine(p)} · ${traitText(p)}</div>${hpBar(p)}${xpBar(p)}</div></div></div>`).join("")}
      <button type="button" class="ghost" id="afaBack" style="width:100%;margin-top:8px">Back</button>`;
    sheet.querySelectorAll("[data-who]").forEach(w=>w.onclick=()=>{
      const p = S.people.find(x=>x.id===w.dataset.who);
      if(p && f){ p.food = f.id; S.vault = S.vault.filter(x=>x.uid!==f.uid); }
      const packed = jobs.flatMap(j=>j.ids).map(id=>S.people.find(x=>x.id===id)).filter(x=>x && x.food && !x.foodEaten);
      if(packed.length) askFoodUseAll(jobs, packed, 0);
      else { closeModal(); jobs.forEach(j=>send(j.mid, j.ids)); }
    });
    document.getElementById("afaBack").onclick=()=>askArmoryFoodAll(jobs, foods);
  });
  document.getElementById("afaSkip").onclick=()=>{ closeModal(); jobs.forEach(j=>send(j.mid, j.ids)); };
}
document.querySelectorAll("[data-sendall]").forEach(b=>b.onclick=()=>{
    const jobs = lootChain().slice().map(c=>{
      const added = ((S._chainAdds||{})[c.m.id]||[]);
      const auto = (S.buildings.seer||0)>=4 ? chainLeftovers() : [];
      const idx = lootChain().findIndex(x=>(x.m.id||x.m.t)===(c.m.id||c.m.t));
      const ids = c.party.map(p=>p.id).concat(added);
      if(auto[idx]) ids.push(auto[idx].id);
      return {mid:c.m.id, ids};
    });
    const allIds = jobs.flatMap(j=>j.ids);
    const packed = allIds.map(id=>S.people.find(p=>p.id===id)).filter(p=>p && p.food && !p.foodEaten);
    const loose = (S.vault||[]).filter(it=>it.kind==="food");
    if(packed.length){ askFoodUseAll(jobs, packed); return; }
    if(loose.length){ askArmoryFoodAll(jobs, loose); return; }
    jobs.forEach(j=>send(j.mid, j.ids));

      const ids = c.party.map(p=>p.id).concat(added);

      send(c.m.id, ids);

  document.querySelectorAll("[data-redraw]").forEach(b=>b.onclick=()=>redrawJob(b.dataset.redraw));
  document.querySelectorAll("[data-person]").forEach(b=>b.onclick=()=>openPerson(b.dataset.person));
  document.querySelectorAll("[data-shopcat]").forEach(b=>{
    b.onclick=()=>{ shopCat = b.dataset.shopcat; render(); };

function unequip(pid, slot){
  const p = S.people.find(x=>x.id===pid);
  if(!p) return;
  let it = null, clear = ()=>{};
  if(slot==="weapon" && p.weapon){ it = catalog("weapon", p.weapon); clear = ()=>{ p.weapon = null; }; }
  else if(slot==="offhand" && p.offhand){ it = catalog("weapon", p.offhand); clear = ()=>{ p.offhand = null; }; }
  else if(slot==="food" && foodOf(p)){ it = foodOf(p); clear = ()=>{ p.food = null; }; }
  else if(slot==="kit" && p.kit){ it = catalog("kit", p.kit); clear = ()=>{ p.kit = null; }; }
  else if(p.slots && p.slots[slot]){ it = catalog("armor", p.slots[slot]); clear = ()=>{ p.slots[slot] = null; }; }
  if(!it) return toast("Nothing there.");
  if(!S.armory) S.armory = [];
  if(S.armory.length >= vaultCap()) return armoryFullChoice(pid, slot, it, clear);
  clear();
  S.armory.push(it);
  log("Sent "+(it.n||slot)+" to the armory.");
  toast((it.n||slot)+" sent to the armory.");
  save();
  openPerson(pid);
}

function fontPx(){
  try {
    const raw = storeGet("guildmaster_settings_v1");
    if(raw){ const o=JSON.parse(raw); if(o.font) return Math.max(14, Math.min(22, +o.font||18)); }
  } catch(e){}
  return 18;
}
function applyFont(n){
  const px = Math.max(14, Math.min(22, +(n||fontPx())||16));
  const root = document.documentElement;
  root.style.setProperty("--base", px+"px");
  root.style.fontSize = px+"px";
  if(document.body) document.body.style.fontSize = px+"px";
  saveSet({font:px});
}

    <h4><span style="color:#c45a4a">Red border — Flawed</span></h4>
    <p class="tiny">A single flaw and nothing else, <b>or</b> one good trait buried under two flaws. Cheap, risky. If they still have a good trait next to those flaws, that good trait is <span class="epic">✦ Epic</span> and doubles — the flaws still sting.</p>
    <h4>✦ Epic (gold trait text)</h4>

    <h4>How traits get there</h4>
    <p class="tiny">Most faces roll 1 trait. Some roll 2. A few roll 3 (Notice Board helps). Opposites never sit on the same person (Lucky/Unlucky, Brave/Craven, and so on). A two-trait roll will not stack two flaws. Three-trait rolls can mix.</p>
    <p class="tiny">Roles, quirks, and gear do not change the border. Only the trait mix does.</p>
    <p class="tiny">The two who open the hall are common or Gifted only — no flaws, no Epic mix. The two openers arrive in junk or common kit. About one in six packed a cheap snack. Tavern faces can walk in with better kit and food of any common-to-epic grade.</p>`;
  if(id==="class") return `

      return `<p class="tiny">${c.icon} <b>${n}</b> — ATK ${c.atk} · DEF ${c.def} · HP ${c.hp} (+2 HP per level). School: ${school?school.n:"—"}.${extra}</p>
        ${(ROLES[n]||[]).map(r=>`<p class="tiny">&nbsp;&nbsp;${r.icon} <b>${r.n}</b> — ${r.desc}</p>`).join("")}`;

    <p class="tiny">Each hire gets one role for life. Same class, different work.</p>
    <h4>Quirks</h4>
    ${QUIRKS.map(q=>`<p class="tiny">${q.icon} <b>${q.n}</b> — ${q.desc}</p>`).join("")}
    <p class="tiny">Each face gets one role and one quirk for life. Typed roles are +4 on their jobs and −4 on every other type. Sergeant, Cutpurse, and Field have no type swing. A plus and a minus on the same job type never share a person. Two pluses may stack. Items still stack either way except Afraid of the Dark, who cannot wear Dark-bonus gear.</p>
    <h4>Job marks</h4>

    <h4>Company</h4>
    <p class="tiny">Two+ of the same class on one job: −2 power per extra copy. Two different classes: +2 power.</p>
    <p class="tiny">🌙 <b>Dark jobs</b> — Cleric, Night Owl (trait, walk only), Occultist, Night role, or Afraid of the Dark (walk at −5). Harder (+2 diff) and better pay. Chapel Bell adds +2 party power per level on Dark work. Afraid of the Dark cannot also carry Dark bonuses or Dark-bonus items.</p>`;
  if(id==="trait"){
    const pos = TRAITS.filter(t=>NEGATIVE_TRAITS.indexOf(t)<0);

    ${pos.map(t=>`<p class="tiny">${TRAIT_ICON[t]||""} <b>${t}</b> — ${TRAIT_DESC[t]||""}</p>`).join("")}
    <h4>Flaws</h4>
    ${neg.map(t=>`<p class="tiny">${TRAIT_ICON[t]||""} <b>${t}</b> — ${TRAIT_DESC[t]||""}${TRAIT_CONFLICT[t]?" Cannot pair with "+TRAIT_CONFLICT[t].join(", ")+".":""}</p>`).join("")}
    <h4>Job specialists</h4>
    ${Object.keys(TYPE_TRAIT).map(k=>`<p class="tiny">${(Object.values(MISSION_TYPE).find(x=>x.type===k)||{}).icon||"📜"} ${k} → ${TYPE_TRAIT[k]} (+4 power on that type).</p>`).join("")}`;
  }
  if(id==="kits"){
    return `<p class="tiny">A kit sits in its own slot. It fires once, on the next job, then it is gone. Buy them from the merchant.</p>`+
      KITS.map(k=>`<p class="tiny">${k.icon||"🧰"} ${itemNameHtml(k)} — ${gp(k.cost)} · ${k.desc}</p>`).join("");
  }
  if(id==="gear"){ return `<p class="tiny">Bows and crossbows are two-handed. They clear the offhand. Shields stay offhand only.</p>`+helpGearBody(); }
function helpGearBody(){
    const order=["junk","common","uncommon","rare","epic","artifact"];

      const rows=list.filter(x=>(x.r||(x.unique?"artifact":"common"))===r);

      return `<p class="tiny"><b class="${rarityColor(r)}">${r}</b></p>`+list.map(f=>`<p class="tiny">${f.icon||"🍖"} ${itemNameHtml(f)} — ${gp(f.cost)} · ${foodBits(f)}. ${f.desc||""}</p>`).join("");
    }).join("");
    return `
    <p class="tiny">One snack slot per person. Buy it, loot it, or pick it off the road. One use. Color is rarity, same as gear.</p>
    <p class="tiny"><b>Use it when sending</b> — the heal lands right away; power / gold / XP count on that job, then the food is gone. <b>Use on the sheet</b> — heal and loyalty apply now. Power / gold / XP wait for the next job, then the food is gone. You can also Use food sitting in the Armory.</p>
    <p class="tiny"><b>Leave it packed</b> — they eat on the job: heal first, then the wound roll; bonuses apply; then it is gone.</p>
    ${rows}`;
  }
  if(id==="hall") return `
    <p class="tiny">Upgrade on the Hall tab. Cost is base × next level. Pay now; it raises for 5 days × the level you are buying (Lv1 = 5d, Lv2 = 10d, Lv3 = 15d, Lv4 = 20d). You can queue the next raise. Tap the build ring up top to see the current build, the queue, and when each finishes. Halting a raise asks first, then returns half the cost. A finished job pays Renown equal to its difficulty. Charming +1, Sour −1. Charter is gone. Renown is prestige, not coin.</p>
    <p class="tiny"><b>The other hall</b> starts with two faces, traits, quirks, and a specialty. No food, no kit. They do not run a board. When you finish a job they gain Renown equal to its difficulty and roll their own rewards. They pay wages, buy Barracks, and hire from the Tap. Contest uses their two best faces even if one is out. While your pair is out, a Contest ring sits with the quest rings and counts the days left. Tap it to see who went and to open the other hall.</p>
    <p class="tiny">Sealed Briefs: each level adds 2 jobs on the board, and you can pay to replace one open job. Renown still raises hire level and extra faces, and sets the door band.</p>
    <h4>🏦 Bank and the door</h4>
    <p class="tiny">Park gold in the vault. Wages do not touch parked coin. Dawn interest is small. The real reason to build it: the door only knocks if a Bank stands.</p>
    <p class="tiny">Door price comes out of the vault first. A 50g vault adds +1 to the visitor band. Bank Lv3+ with a 70% full vault adds another. Empty vault, weaker knocks.</p>
    ${Object.keys(BUILDINGS).map(k=>{

    <h4>👁️ The Seer</h4>

    <p class="tiny">Sight is free from day one — live odds: they walk it / good chance / even / bloody / a grave.</p>
    <p class="tiny">On a job: Lv1 colors each face’s power for that card, red to gold, and shows the exact gold instead of the range, and marks the best-loot quest that is a good chance or better. After you send it, the mark moves to the next best with the faces still home, until no one is left or nothing is a good chance. Lv2 shows the recommended bar, auto-picks the party, and the exact items the quest will drop. The best-loot mark counts item value. Only one quest on the board is marked. Lv4 blesses the job +4.</p>
    <p class="tiny">On the contest: Lv1 compares your pair to theirs. Lv2 lists their two best faces and opens the full sheet. Lv3 is a picker — the strongest pair starts marked, you choose the two. Lv4 adds +4 when the contest is scored.</p>
    <p class="tiny">Grades vs recommended power: 115%+ walk it · 95%+ good · 78%+ even · 58%+ bloody · else a grave.</p>`;

    <p class="tiny">A green ⚔ line in the header and on the night report is how many parties are still out. Quest, contest, kin, levy, watch, and build absences each get a countdown ring in the upper left, and so does a face on a fever lock (🤒). Tap a quest ring to open the board, or the Contest ring for the other hall.</p>
    <h4>✉️ Break the seal</h4>
    <p class="tiny">That button is <b>Sealed Briefs</b> on the Hall. Pay gold to throw out one <b>open</b> job and draw a different contract in that slot. You cannot seal-break a job that already has a party.</p>
    <p class="tiny">Cost is 24g minus 4g per Briefs level, minimum 8g. Right now: ${seal}. The redraw is a random unused title from the pool — it can be harder, easier, or Dark.</p>

    ${Object.keys(TYPE_TRAIT).map(k=>{
      const titles = Object.keys(MISSION_TYPE).filter(t=>MISSION_TYPE[t].type===k);

function openPatch(){
  const sheet = document.getElementById("sheet");
  const modal = document.getElementById("modal");
  if(!sheet||!modal) return;
  const rows = PATCH_LOG.slice(0,10).map(x=>`<p class="tiny"><b>${x.d}</b> — ${x.t}</p>`).join("");
  sheet.innerHTML = `<h3>Update log</h3>${rows}
    <button type="button" class="act" id="patchClose" style="width:100%;margin-top:10px">Got it</button>`;
  modal.classList.add("show"); modal.style.display="flex";
  document.getElementById("patchClose").onclick=closeModal;
}

function openHelp(page){
  if(page) helpTab = page;
  const tabs = [
    {id:"play", label:"Play"},
    {id:"faces", label:"Faces"},
    {id:"class", label:"Classes"},
    {id:"trait", label:"Traits"},
    {id:"bonuses", label:"Bonuses"},
    {id:"gear", label:"Gear"},
    {id:"food", label:"Food"},
    {id:"kits", label:"Kits"},
    {id:"hall", label:"Hall"},
    {id:"writ", label:"Writ"},
    {id:"missions", label:"Quests"},
    {id:"rival", label:"Rival"}
  ];
  document.getElementById("sheet").innerHTML = `
    <h3>How to keep the Hall</h3>
    <div class="helpnav">
      ${tabs.map(t=>`<button type="button" class="${helpTab===t.id?"on":""}" data-helptab="${t.id}">${t.label}</button>`).join("")}
    </div>
    <div class="helpbody">${helpPage(helpTab)}</div>
    <button type="button" class="act" id="helpClose" style="width:100%;margin-top:10px">Got it</button>`;
  const modal = document.getElementById("modal");
  modal.classList.add("show");
  modal.style.display = "flex";
  document.getElementById("helpClose").onclick = closeModal;
  document.querySelectorAll("[data-helptab]").forEach(b=>{
    b.onclick = e=>{ e.stopPropagation(); openHelp(b.dataset.helptab); };
  });
}
function closeModal(){
  S.tapCloseSheet = false;
  const modal = document.getElementById("modal");
  modal.classList.remove("show");
  modal.style.display = "none";
  const sheet = document.getElementById("sheet");
  if(sheet) sheet.classList.remove("tall");
  if(sheet) sheet.onclick = null;
}

function dbgLoyOne(id){

  save(); render();

  openDbg();
}
function dbgHealAll(){

  });

function dbgLevelOne(id){
  const p = (S.people||[]).find(x=>x.id===id);
  if(!p || p.status==="dead") return;
  p.lv = (p.lv||1)+1;
  p.maxhp = (p.maxhp||16)+3;
  p.hp = p.maxhp;
  p.xp = 0;
  log("DEBUG "+p.name+" → level "+p.lv+".");
  save(); render();
  toast(p.name+" is level "+p.lv+".");
  openDbg();
}
function dbgBestGear(cls, kind){
  const list = kind==="weapon" ? WEAPONS : ARMORS;
  const ok = list.filter(it=>{
    if(kind==="weapon" && isBladedWeapon(it.id) && (cls==="Cleric"||cls==="Mage")) return false;
    return true;
  }).slice().sort((a,b)=>{
    const ra = rarityRank(a.r|| (a.unique?"artifact":"common"));
    const rb = rarityRank(b.r|| (b.unique?"artifact":"common"));
    if(rb!==ra) return rb-ra;
    return ((b.atk||b.def||0)-(a.atk||a.def||0));
  });
  return ok[0] || list[0];
}
function dbgMakeGod(){
  const cls = (document.getElementById("dbgCls")||{}).value || "Warrior";
  let lv = Math.max(1, Math.min(20, +((document.getElementById("dbgLv")||{}).value)||5));
  if(bunkCount() >= cap()){
    S.buildings.barracks = (S.buildings.barracks||1)+1;
  }
  const p = makePerson(true, cls, lv);
  p.lv = lv;
  p.maxhp = CLASSES[cls].hp + lv*2 + 8;
  p.hp = p.maxhp;
  p.loyalty = 10;
  p.status = "ready";
  p.xp = 0;
  const goods = TRAITS.filter(t=>NEGATIVE_TRAITS.indexOf(t)<0);
  const ts = [];
  goods.forEach(t=>{
    if(ts.length>=3) return;
    const ban = TRAIT_CONFLICT[t]||[];
    if(ts.some(x=>ban.indexOf(x)>=0 || (TRAIT_CONFLICT[x]||[]).indexOf(t)>=0)) return;
    ts.push(t);
  });
  p.traits = ts.length?ts:["Lucky","Brave","Tough"].filter(t=>TRAITS.indexOf(t)>=0).slice(0,3);
  p.trait = p.traits[0];
  const w = dbgBestGear(cls, "weapon");
  const a = dbgBestGear(cls, "armor");
  p.weapon = w.id;
  p.armor = a.id;
  const snack = FOODS.filter(f=>f.r==="epic"||f.unique).sort((x,y)=>rarityRank(y.r)-rarityRank(x.r))[0];
  if(snack) p.food = snack.id;
  p.foodEaten = false;
  stampPerson(p);
  S.people.push(p);
  log("DEBUG hired god "+p.name+" "+cls+" "+lv+".");
  save(); render();
  toast(p.name+" sits the bench.");
  closeModal();
  openPerson(p.id);
}
function dbgBumpUpgrade(){
  const key = (document.getElementById("dbgUp")||{}).value;
  const b = BUILDINGS[key];
  if(!b) return;
  const cur = S.buildings[key]||0;
  if(cur >= b.max){ toast(b.n+" is already max (Lv "+b.max+")."); return; }

  log("DEBUG "+b.n+" → Lv "+S.buildings[key]+".");
  save(); render();
  toast(b.n+" is now Lv "+S.buildings[key]+".");
  openDbg(key);
}

function newGame(){
  S.day = 1; S.gold = 40; S.renown = 0; S.nextFeat = 8; S.featItem = null; S.season="spring"; S.seasonLeft=30; S.loan=0; S.rival=null;
  S.hallEvent=null; S.hallEventLog=null; S._roadStall=null; S.seasonAsk=null; S.contestAsk=null; S.contestDue=null; S.contestWarn=null; S.contestWarned=false; S.contestUntil=null; S.contestParty=null; S.rivalWritAsk=null;
  S.buildings = {barracks:1, armory:1, infirmary:1, grounds:0, alley:0, sanctum:0, chapel:0, tavern:1, bank:1, racks:0, board:0, bell:0, briefs:0, seer:0, stables:0};
  S.deposit = 40;
  S.people = []; S.missions = []; S.shop = []; S.vault = []; S.pendingLoot = []; S.hire = []; S.log = []; S.selected = null;
  S.writ = null; S.writWins = 0; S.writFails = 0; S.writChoice = null; S.nextSeek = 1+rng(7,14); S.seekers = null; S.quitAsk = null; S.restlessAsk = null; S.raise = null; S.epicWins = 0;
  const start = Object.keys(CLASSES).slice().sort(()=>Math.random()-0.5);
  S.people.push(makePerson(true, start[0]), makePerson(true, start[1]));
  S.people.forEach(p=>{
    outfitStarter(p);
    const pos = TRAITS.filter(t=>NEGATIVE_TRAITS.indexOf(t)<0);
    const n = 2;
    const pool = pos.slice();
    const ts = [];
    for(let i=0;i<n && pool.length;i++){
      const ix = Math.floor(Math.random()*pool.length);
      ts.push(pool.splice(ix,1)[0]);
    }
    p.traits = ts;
    p.trait = ts[0];
    p.quirk = pickQuirkId(p);
  });
  refreshMissions();
  restockShop();
  restockHire();
  log("The Copper Hall opened. Two hungry adventurers sat the bench.");
  tab = "hall";
  if(!S._wipeOk && hallLived(storedHall()) && hallScore(storedHall()) > hallScore(snapshot())){
    applySnap(storedHall());
    render();
    return;
  }
  save(true);
  render();
}

function bootHall(tries){
  tries = tries||0;
  if(load()){ render(); resumeDoorQueue(); return; }
  const kept = storedHall();
  if(kept && hallLived(kept)){
    applySnap(kept); render(); resumeDoorQueue(); return;
  }
  if(tries<8){ setTimeout(()=>bootHall(tries+1), 200*(tries+1)); return; }
  newGame();
}
function doorQueueWaiting(){
  const e = S.hallEvent;
  if(e && e.id && !hallEventIsOpen()) return true;
  if((S.pendingLoot||[]).length || (S._questResults||[]).length) return true;
  if(S.seekers && S.seekers.length) return true;
  if(S.seasonAsk || S.contestDue || S.contestAsk || S.rivalWritAsk) return true;
  if(S.contestWarn && !(S.contestUntil>S.day) && !S.contestDue) return true;
  if((S.graveAsk||[]).length || (S.saintAsk||[]).length || (S.bloodAsk||[]).length) return true;
  if((S.quitAsk||[]).length || (S.restlessAsk||[]).length) return true;
  return false;
}
function resumeDoorQueue(){
  try{
    if(typeof hasLiveRoadUi==="function" && hasLiveRoadUi()) return;
    if(typeof healRoadStall==="function" && S._roadStall && healRoadStall()) return;
    resumePendingFinds();
    if(doorQueueWaiting()) nextDoorQueue();
  }catch(e){}
}
function recoverHall(){
  if(typeof hasLiveRoadUi==="function" && hasLiveRoadUi()) return false;
  const kept = storedHall();
  const now = snapshot();
  if(kept && hallLived(kept) && hallScore(kept) > hallScore(now)){
    applySnap(kept); render();
    resumeDoorQueue();
    return true;
  }
  resumeDoorQueue();
  return false;
}
