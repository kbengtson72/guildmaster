function briefCost(){
  const lv = S.buildings.briefs||0;
  if(!lv) return 0;
  return Math.max(8, 24 - 4*lv);
}

function openThiefBoard(id){
  const p = (S.people||[]).find(x=>x.id===id);
  if(!p || p.quirk!=="board_thief" || p.status!=="ready") return;
  if(p.thiefUntil && S.day < p.thiefUntil) return toast("The thief sleeps "+(p.thiefUntil-S.day)+"d.");
  const jobs = (S.missions||[]).filter(m=>!m.epic && !(m.party&&m.party.length));
  if(!jobs.length) return toast("No idle quest to swap.");
  const sheet = document.getElementById("sheet");
  const modal = document.getElementById("modal");
  sheet.innerHTML = `<h3>Board-thief</h3>
    <p class="tiny">${p.name} swaps one idle quest. 7 days after.</p>
    ${jobs.map(m=>`<button type="button" class="ghost" data-thiefswap="${m.id}" style="width:100%;margin-top:6px;text-align:left">${MISSION_ICON[m.t]||"📜"} ${m.t} · diff ${m.diff}</button>`).join("")}
    <button type="button" class="ghost" id="thiefNo" style="width:100%;margin-top:10px">Cancel</button>`;
  modal.classList.add("show"); modal.style.display="flex";
  sheet.querySelectorAll("[data-thiefswap]").forEach(b=>b.onclick=()=>doThiefSwap(id, b.dataset.thiefswap));
  document.getElementById("thiefNo").onclick=()=>{ closeModal(); openPerson(id); };
}
function thiefBtn(m){
  if(!m || m.epic || (m.party&&m.party.length)) return "";
  const thieves = (S.people||[]).filter(p=>p.quirk==="board_thief" && p.status!=="dead");
  if(!thieves.length) return "";
  const ready = thieves.find(p=>p.status==="ready" && (!p.thiefUntil || S.day>=p.thiefUntil));
  if(ready) return `<button class="ghost" data-thief="${ready.id}|${m.id}" style="width:100%;margin-top:6px">🃏 Board-thief · swap this</button>`;
  const wait = Math.min(...thieves.map(p=>Math.max(0,(p.thiefUntil||0)-S.day)));
  return `<button class="ghost" disabled style="width:100%;margin-top:6px;opacity:.45">🃏 Board-thief · ${wait}d</button>`;
}
function doThiefSwap(pid, mid){
  const p = (S.people||[]).find(x=>x.id===pid);
  const ix = findMissionIndex(mid);
  if(ix<0 || !p) return;
  const old = S.missions[ix];
  if(old.epic || (old.party&&old.party.length)) return toast("Cannot swap that.");
  const taken = {};
  S.missions.forEach(m=>{ if(m.t) taken[m.t]=true; });
  const pool = missionPool().filter(x=>!taken[x.t]);
  const src = pool.length ? pick(pool) : pick(missionPool());
  const m = hardenDark(Object.assign({}, src));
  m.id = uid();
  m.party = [];
  S.missions[ix] = m;
  p.thiefUntil = S.day + 7;
  log(p.name+" stole a new brief: "+m.t+" (was "+old.t+").");
  toast(old.t+" becomes "+m.t);
  ensureWritJob();
  save(); closeModal(); render();
}
function redrawJob(mid){
  const lv = S.buildings.briefs||0;
  if(!lv) return toast("Build Sealed Briefs on the Hall first.");
  const cost = briefCost();
  if(funds() < cost) return toast("Need "+gp(cost)+".");
  const ix = findMissionIndex(mid);
  if(ix<0) return;
  const old = S.missions[ix];
  if(old.epic) return toast("An epic quest cannot have its seal broken.");
  if(old.party && old.party.length) return toast("Already in the field.");
  const taken = {};
  S.missions.forEach(m=>{ if(m.t) taken[m.t]=true; });
  const pool = missionPool().filter(x=>!taken[x.t]);
  const src = pool.length ? pick(pool) : pick(missionPool());
  const m = hardenDark(Object.assign({}, src));
  m.id = uid();
  m.party = [];
  spend(cost);
  S.missions[ix] = m;
  log("Broke the seal on "+old.t+". Drew "+m.t+".");
  toast("New brief: "+m.t);
  ensureWritJob();
  save(); render();
}

function missionPwrTone(p, m, ready){
  const vals = (ready||[]).map(x=>power([x], m));
  const lo = Math.min.apply(null, vals.length?vals:[0]);
  const hi = Math.max.apply(null, vals.length?vals:[1]);
  const cur = power([p], m);
  const t = hi<=lo ? 1 : (cur-lo)/(hi-lo);
  const stops = [
    [0, [180,48,42]],
    [0.25, [210,110,36]],
    [0.5, [210,180,50]],
    [0.75, [70,160,70]],
    [1, [212,168,70]]
  ];
  let a=stops[0], b=stops[stops.length-1];
  for(let i=0;i<stops.length-1;i++){
    if(t>=stops[i][0] && t<=stops[i+1][0]){ a=stops[i]; b=stops[i+1]; break; }
  }
  const u = (t-a[0])/Math.max(0.001, b[0]-a[0]);
  const rgb = a[1].map((n,i)=>Math.round(n+(b[1][i]-n)*u));
  const ink = t>0.55 ? "#1a140c" : "#f4e6c8";
  return {n: Math.round(cur), col:"rgb("+rgb.join(",")+")", ink};
}
function seerLv(){ return S.buildings.seer||0; }
function seerTarget(m){
  return Math.round((m.diff||1)*8 + 6);
}
function readyFor(m){
  let ready = (S.people||[]).filter(p=>p && p.status==="ready" && !whyNoSend(p,m) && quirkAllows(p,m));
  if(isDarkMission(m)) ready = ready.filter(canWalkDark);
  if(isHolyMission(m)) ready = ready.filter(canWalkHoly);
  return ready;
}
function recoveryOk(m){
  if(!m || !m.recovery) return true;
  const ready = (S.people||[]).filter(p=>p && p.status==="ready" && !whyNoSend(p, m));
  return ready.length >= (m.need||2) && ready.some(p=>p.cls==="Cleric");
}
function bestChairFor(m){
  const ready = readyFor(m);
  if(!ready.length) return null;
  const scored = ready.map(p=>({p, s: power([p], m)})).sort((a,b)=>b.s-a.s);
  return scored[0].p;
}
function bestPartyFor(m){
  const ready = readyFor(m).slice();
  const need = Math.max(1, m.need||1);
  if(!ready.length) return [];
  if(ready.length <= need) return ready;
  const order = ["a grave","bloody","even","good chance","they walk it"];
  function grade(party){ return order.indexOf(seerWord(party, m)); }
  function peak(party){ return Math.max.apply(null, party.map(p=>power([p], m))); }
  let best = null;
  function walk(start, chosen){
    if(chosen.length===need){
      const gd = grade(chosen);
      const pwr = power(chosen, m);
      const pk = peak(chosen);
      const better = !best
        || gd > best.gd
        || (gd===best.gd && pk < best.pk - 1e-9)
        || (gd===best.gd && Math.abs(pk-best.pk)<1e-9 && pwr < best.pwr - 1e-9);
      if(better) best = {party: chosen.slice(), gd, pk, pwr};
      return;
    }
    for(let i=start;i<ready.length;i++){
      chosen.push(ready[i]);
      walk(i+1, chosen);
      chosen.pop();
    }
  }
  walk(0, []);
  return best ? best.party : ready.slice(0, need);
}
function seerWord(party, m){
  const rec = seerTarget(m);
  const pwr = party && party.length ? power(party, m) : 0;
  const ratio = pwr / Math.max(1, rec);
  if(!party || !party.length) return "waiting";
  if(ratio>=1.15) return "they walk it";
  if(ratio>=0.95) return "good chance";
  if(ratio>=0.78) return "even";
  if(ratio>=0.58) return "bloody";
  return "a grave";
}
function seerBarHtml(cur, rec){
  rec = Math.max(1, rec||1);
  const pct = Math.min(100, Math.round(100*cur/rec));
  const over = cur>=rec;
  return `<div class="cdbar" style="${over?"box-shadow:0 0 0 1px var(--gold)":""}"><i style="width:${Math.max(6,pct)}%;background:${over?"linear-gradient(90deg,#e0b44b,#f3d27a)":"linear-gradient(90deg,#6a4ad0,#b08ad0)"}"></i></div>
    <p class="seer-note">Bar ${cur} / ${rec} recommended PWR${over?" · full":""}</p>`;
}
function seerTone(word){
  if(word==="they walk it") return "walk";
  if(word==="good chance") return "good";
  if(word==="even") return "even";
  if(word==="bloody") return "bloody";
  if(word==="a grave") return "grave";
  return "";
}
function seerVerdictHtml(word){
  const tone = seerTone(word);
  let mark = "";
  if(tone==="walk") mark = `<span class="seer-mark walk">✓</span>`;
  else if(tone==="good") mark = `<span class="seer-mark good">✓</span>`;
  else if(tone==="bloody") mark = `<span class="seer-mark" style="border:0;background:transparent;width:auto">🩸</span>`;
  else if(tone==="grave") mark = `<span class="seer-mark" style="border:0;background:transparent;width:auto">💀</span>`;
  const label = tone==="grave" ? "grave" : word;
  return `${mark}<span class="seer-word ${tone}">${label}</span>`;
}
function seerText(m, party, live){
  const lv = seerLv();
  const rec = seerTarget(m);
  const placed = !!(live && party && party.length);
  const slot = (!live && seerLv()>=2) ? lootChain().find(x=>(x.m.id||x.m.t)===(m.id||m.t)) : null;
  const reserved = slot ? slot.party : null;
  let use = placed ? party : (seerLv()>=2 ? (reserved||[]) : bestPartyFor(m));
  const need = m.need||1;
  const readyN = readyFor(m).length;
  if(!placed && m.recovery){
    const rf = (S.people||[]).filter(p=>p && p.status==="ready" && !whyNoSend(p, m));
    const hasC = rf.some(p=>p.cls==="Cleric");
    if(rf.length < need) return `<div class="seerbox"><div class="seer-line"><span class="seer-eye">👁️</span><span class="seer-word">not enough bodies</span></div><p class="seer-note">${rf.length} ready · needs ${need}, one a Cleric</p></div>`;
    if(!hasC) return `<div class="seerbox"><div class="seer-line"><span class="seer-eye">👁️</span><span class="seer-word">needs a Cleric</span></div><p class="seer-note">${rf.length} ready · no Cleric among them</p></div>`;
  }
  if(!placed && readyN < need){
    let why;
    if(isDarkMission(m)){
      why = readyN ? "not enough Dark walkers available" : "no Dark walkers available";
    } else if(isHolyMission(m)){
      why = readyN ? "not enough Holy walkers available" : "no Holy walkers available";
    } else {
      why = readyN ? "not enough bodies available" : "no one ready";
    }
    const held = (S.people||[]).filter(p=>p && p.status==="ready" && readyFor(m).indexOf(p)<0).map(p=>escHtml(p.name.split(" ")[0])+": "+(whyNoSend(p,m)||"cannot take this job").replace(/\.$/,"")).join(" · ");
    return `<div class="seerbox"><div class="seer-line"><span class="seer-eye">👁️</span><span class="seer-word">${why}</span></div>
      <p class="seer-note">${readyN} ready · needs ${need}${held?" · "+held:""}</p></div>`;
  }
  const recommended = !!(reserved && reserved.length);
  if(!use.length){
    if(readyN < need){
      return `<div class="seerbox"><div class="seer-line"><span class="seer-eye">👁️</span><span class="seer-word">no one ready${isDarkMission(m)?" who can walk Dark":isHolyMission(m)?" who can walk Holy":""}</span></div></div>`;
    }
    use = bestPartyFor(m) || [];
  }
  if(!use.length){
    return `<div class="seerbox"><div class="seer-line"><span class="seer-eye">👁️</span><span class="seer-word">no one ready${isDarkMission(m)?" who can walk Dark":isHolyMission(m)?" who can walk Holy":""}</span></div></div>`;
  }
  const word = seerWord(use, m);
  const now = Math.round(power(use, m));
  let prefix = placed ? "" : `<span class="seer-note" style="margin:0;font-size:0.95rem">if you send the best —</span>`;
  let notes = [];
  if(lv>=1 && !placed){
    const names = use.map(p=>p.name.split(" ")[0]+" the "+((roleDef(p)||{}).n||p.cls));
    if(names.length && (recommended || seerLv()<2)) notes.push("Picks "+names.join(", "));
  }
  if(lv>=2) notes.push(placed ? ("Recommended PWR "+rec+" · now "+now) : ("Recommended PWR "+rec));
  if(!placed && lv>=3) notes.push("Will pick the party for you.");
  if(lv>=4) notes.push(placed ? "Blessed." : "Blessing ready.");
  const bar = (lv>=2) ? seerBarHtml(placed?now:now, rec) : "";
  return `<div class="seerbox"><div class="seer-line"><span class="seer-eye">👁️</span>${prefix}${seerVerdictHtml(word)}</div>${notes.length?`<p class="seer-note">${notes.join(" · ")}</p>`:""}${bar}</div>`;
}


function rosterBestRank(kind){
  let best = 0;
  (S.people||[]).forEach(p=>{
    if(!p || p.status==="dead") return;
    let it = null;
    if(kind==="weapon") it = catalog("weapon", p.weapon);
    else if(kind==="armor") it = catalog("armor", p.armor);
    else it = foodOf(p);
    if(it) best = Math.max(best, rarityRank(rarityOf(it)));
  });
  return best;
}
function pickFeatItem(){
  const kinds = ["weapon","armor","food"];
  const kind = pick(kinds);
  const lists = {weapon:WEAPONS, armor:ARMORS, food:FOODS};
  const want = Math.min(4, rosterBestRank(kind)+1);
  const pool = (lists[kind]||[]).filter(x=>!x.road && rarityRank(x.r||"common")===want);
  const fallback = (lists[kind]||[]).filter(x=>!x.road && rarityRank(x.r||"common")<=want && rarityRank(x.r||"common")>=Math.max(1,want-1));
  const src = (pool.length?pool:fallback);
  if(!src.length) return null;
  const it = pick(src);
  return Object.assign({kind, feat:true, unique:true}, it);
}
function injectFeatShop(){
  if(!S.featItem) return;
  if(!S.shop) S.shop = [];
  S.shop = S.shop.filter(x=>!x.feat);
  S.shop.unshift(Object.assign({}, S.featItem));
}
function tickFeatured(){
  if(!S.nextFeat) S.nextFeat = S.day + 7;
  if(S.day < S.nextFeat) { injectFeatShop(); return; }
  const it = pickFeatItem();
  S.nextFeat = S.day + 7;
  if(!it){ injectFeatShop(); return; }
  S.featItem = it;
  S.featBadge = true;
  injectFeatShop();
  S.featAsk = {id:"featured", name:it.n, kind:it.kind, r:it.r||rarityOf(it)};
}
function restockShop(){
  const cap = shopRarityCap();
  function take(list, kind, n, always){
    const ok = list.filter(x=>{
      if(x.unique || rarityRank(x.r||"common")>cap) return false;
      if(kind==="armor" && (x.def||0)>1 && Math.random()<0.45) return false;
      return true;
    });
    const out = [];
    (always||[]).forEach(id=>{
      const it = ok.find(x=>x.id===id);
      if(it && !out.find(y=>y.id===it.id)) out.push(it);
    });
    const pool = ok.slice().sort(()=>Math.random()-0.5);
    for(let i=0;i<pool.length && out.length<n;i++){
      if(!out.find(y=>y.id===pool[i].id)) out.push(pool[i]);
    }
    out.forEach(it=>{
      if(S.shop.some(x=>x.id===it.id && x.kind===kind)) return;
      S.shop.push(Object.assign({kind}, it));
    });
  }
  S.shop = [];
  take(WEAPONS, "weapon", 6, ["stick"]);
  take(ARMORS, "armor", 6, ["cloth"]);
  take(FOODS, "food", 5, ["hardtack","rations"]);
  take(KITS, "kit", KITS.length, KITS.map(x=>x.id));
  injectFeatShop();
}
function ensureFoodStock(){
  if(!S.shop) S.shop = [];
  if(S.shop.some(x=>x.kind==="food")) return;
  restockShop();
}

function pwrPart(parts, label, n){
  if(!n) return 0;
  parts.push({label, n});
  return n;
}
function fmtPwrPart(n, signed){
  const neg = n<0;
  const abs = Math.abs(n);
  const whole = Math.abs(abs - Math.round(abs)) < 1e-9;
  const body = whole ? String(Math.round(abs)) : (Math.round(abs*10)/10).toFixed(1);
  if(n===0) return "0";
  if(!signed && !neg) return body;
  return (neg?"−":"+")+body;
}
function bodyParts(p, who){
  expandGear(); ensureSlots(p);
  const out=[]; const add=(l,n)=>{ if(n) out.push({label:who+l, n}); };
  const w = WEAPONS.find(x=>x.id===p.weapon) || WEAPONS[0];
  const off = p.offhand ? (WEAPONS.find(x=>x.id===p.offhand)||{}) : {};
  const shield = off.fam==="shield";
  const r = roleDef(p); const em = emult(p);
  add("Base attack ("+p.cls+")", CLASSES[p.cls].atk);
  add("Level "+p.lv+" attack", p.lv);
  add("Weapon ("+(p.weapon?(w.n||"weapon"):"bare hands")+")", w.atk);
  if(!shield) add("Offhand ("+(off.n||"offhand")+", half)", (off.atk||0)/2);
  if(hasTrait(p,"Brave")) add((em>1?"Epic ":"")+"Brave", 2*em);
  if(hasTrait(p,"Craven")) add("Craven", -2);
  if(r&&r.atk) add(r.n+" role attack", r.atk);
  const k=0.7, D=" DEF ×0.7";
  add("Base defense ("+(CLASSES[p.cls].def)+D+")", CLASSES[p.cls].def*k);
  add("Level defense ("+Math.floor(p.lv/2)+D+")", Math.floor(p.lv/2)*k);
  const ad = wornArmor(p).reduce((n,a)=>n+(a.def||0),0);
  add("Armor ("+ad+D+")", ad*k);
  if(shield) add("Shield ("+(off.n||"shield")+", "+(off.def||0)+D+")", (off.def||0)*k);
  if(hasTrait(p,"Tough")) add((em>1?"Epic ":"")+"Tough ("+(2*em)+D+")", 2*em*k);
  if(hasTrait(p,"Fragile")) add("Fragile (−2"+D+")", -2*k);
  if(r&&r.def) add(r.n+" role defense ("+r.def+D+")", r.def*k);
  return out;
}
function power(party, m, detail){
  const parts = [];
  let pwr = 0;
  const seer = (S.buildings&&S.buildings.seer||0);
  if(m && m.recovery && m.watcherId) pwr += pwrPart(parts, "Grave-watcher recovery", 10);
  (party||[]).forEach(p=>{
    const who = (party && party.length>1) ? ((p.name||"They").split(" ")[0]+": ") : "";
    const epic = isEpic(p);
    const body = atkOf(p) + defOf(p)*0.7;
    pwr += body;
    const bp = bodyParts(p, who);
    if(Math.abs(bp.reduce((n,x)=>n+x.n,0)-body)<1e-6 && bp.length){ bp[0].base=true; bp.forEach(x=>parts.push(x)); }
    else parts.push({label: who+"Attack and armor", n: body, base:true});
    if(m && m.tags && m.tags.includes(p.cls)) pwr += pwrPart(parts, who+"Favored class ("+p.cls+")", 4);
    if(hasTrait(p,"Night Owl") && isDarkMission(m)){
      if(p.cls==="Cleric") pwr += pwrPart(parts, who+(epic?"Epic ":"")+"Night Owl Cleric on Dark", epic?8:4);
      else if(epic) pwr += pwrPart(parts, who+"Epic Night Owl on Dark", 4);
    }
    if(hasTrait(p,"Daywalker") && isHolyMission(m)){
      if(p.cls==="Cleric") pwr += pwrPart(parts, who+(epic?"Epic ":"")+"Daywalker Cleric on Holy", epic?8:4);
      else if(epic) pwr += pwrPart(parts, who+"Epic Daywalker on Holy", 4);
    }
    if(hasTrait(p,"Lucky")) pwr += pwrPart(parts, who+(epic?"Epic ":"")+"Lucky", 2*emult(p));
    if(hasTrait(p,"Unlucky")) pwr += pwrPart(parts, who+"Unlucky", -2);
    if(hasTrait(p,"Eagle Eye") && m && m.t && m.t.match(/Lost|Trace|Herb|Wood|Trail|Shepherd|Ledger/)) pwr += pwrPart(parts, who+(epic?"Epic ":"")+"Eagle Eye on this job", 3*emult(p));
    if(hasTrait(p,"Near-sighted") && m && m.t && m.t.match(/Lost|Trace|Herb|Wood|Trail|Shepherd|Ledger/)) pwr += pwrPart(parts, who+"Near-sighted on this job", -3);
    if(hasTrait(p,"Cautious")) pwr += pwrPart(parts, who+(epic?"Epic ":"")+"Cautious", 1*emult(p));
    if(hasTrait(p,"Hardened") && m && m.diff>=6) pwr += pwrPart(parts, who+(epic?"Epic ":"")+"Hardened on a hard job", 2*emult(p));
    if(hasTrait(p,"Shaky") && m && m.diff>=6) pwr += pwrPart(parts, who+"Shaky on a hard job", -2);
    if(hasTrait(p,"Keen") && m && m.diff<=3) pwr += pwrPart(parts, who+(epic?"Epic ":"")+"Keen on an easy job", 2*emult(p));
    if(hasTrait(p,"Slack") && m && m.diff<=3) pwr += pwrPart(parts, who+"Slack on an easy job", -2);
    const days = missionDays(m);
    if(hasTrait(p,"Stayer") && days>=4) pwr += pwrPart(parts, who+(epic?"Epic ":"")+"Stayer on a long job", 2*emult(p));
    if(hasTrait(p,"Sprinter") && days<=3) pwr += pwrPart(parts, who+(epic?"Epic ":"")+"Sprinter on a short job", 2*emult(p));
    if(hasTrait(p,"Pack leader") && party && party.length>=3) pwr += pwrPart(parts, who+(epic?"Epic ":"")+"Pack leader", 2*emult(p));
    if(hasTrait(p,"Lone wolf")) pwr += pwrPart(parts, who+"Lone wolf"+(party && party.length<=1?" (solo)":" (in a party)"), party && party.length<=1 ? 2*emult(p) : -2);
    const mt = (MISSION_TYPE[m&&m.t]||{}).type;
    const spec = mt && TYPE_TRAIT[mt];
    if(spec && specOf(p)===spec) pwr += pwrPart(parts, who+(epic?"Epic ":"")+(specOf(p))+" on "+mt, 4*emult(p));
    const sch = CLASS_SCHOOL[p.cls];
    if(sch) pwr += pwrPart(parts, who+((BUILDINGS[sch]&&BUILDINGS[sch].n)||"Training Grounds"), (S.buildings[sch]||0));
    if(seasonOf()==="summer" && !S.shade && missionDays(m)>=4) pwr += pwrPart(parts, who+"Summer heat", -1);
    const foodN = foodPwr(p, m);
    if(foodN){
      const fd = foodOf(p);
      const darkBit = fd && fd.dark && m && isDarkMission(m);
      pwr += pwrPart(parts, who+"Food ("+((fd&&fd.n)||"packed")+")"+ (darkBit?" on Dark":""), foodN);
    }
    const kk = kitOf(p);
    if(kk){
      if(kk.pwr) pwr += pwrPart(parts, who+"Kit ("+(kk.n||"kit")+")", kk.pwr);
      if(kk.job && jobTypeOf(m)===kk.job) pwr += pwrPart(parts, who+"Kit ("+(kk.n||"kit")+") on "+kk.job, kk.jobp||0);
    }
    if(p.quirk==="cup_bearer" && party){
      let cup = 0;
      party.forEach(o=>{
        if(o && o.id!==p.id && !o.foodSkip) cup += Math.floor(foodPwr(o, m)/2);
      });
      pwr += pwrPart(parts, who+"Cup-bearer (half of the party's food)", cup);
    }
    rolePwrParts(p, m, party).forEach(x=>{ pwr += pwrPart(parts, who+x.label, x.n); });
    const typ = jobTypeOf(m);
    const rep = repTier(repMarks(p, typ));
    if(rep && rep.bonus) pwr += pwrPart(parts, who+(rep.n==="veteran"?"Veteran":"Known")+" on "+(typ||"this job"), rep.bonus);
    quirkPwrParts(p, m, party).forEach(x=>{ pwr += pwrPart(parts, who+x.label, x.n); });
  });
  const chem = chemDelta(party);
  if(chem) pwr += pwrPart(parts, chem>0?"Mixed classes":"Same-class penalty", chem);
  if(isDarkMission(m)||isHolyMission(m)) pwr += pwrPart(parts, "Chapel Bell", (S.buildings.bell||0)*2);
  if(seer>=4) pwr += pwrPart(parts, "Seer blessing", 6);
  if(m && m.blessPwr) pwr += pwrPart(parts, "Blessing on this job", m.blessPwr);
  if(detail) return {total:pwr, parts, shown:Math.round(pwr)};
  return pwr;
}

function jobKind(m){
  return (m && (m.kind||m.jobType)) || (MISSION_TYPE[m&&m.t]||{}).type || "";
}
function writNeed(){
  if(S.day < 15) return 2;
  if(S.day < 28) return 3;
  return 4;
}
function writSpan(){ return S.day < 15 ? 18 : 16;   writCovered();
}
function writMatches(m){
  const w = S.writ;
  if(!w || w.done) return false;
  if(w.type==="Any") return true;
  if(w.type==="Dark") return isDarkMission(m);
  if(w.type==="Holy") return isHolyMission(m);
  return jobKind(m)===w.type;
}
function postWrit(forceType){
  let pool = WRIT_POOL.slice();
  if(SEASON_ORDER.indexOf(seasonOf()) < 2) pool = pool.filter(x=>x.type!=="Dark" && x.type!=="Holy");
  if(livingRoster().length < 4) pool = pool.filter(x=>x.type!=="Mystery");
  if(forceType) pool = pool.filter(x=>x.type===forceType).concat(pool);
  const prev = S.writ && S.writ.id;
  pool = pool.filter(x=>x.id!==prev);
  const seasonN = Math.floor((S.day||1)/30)+1;
  if(seasonN<3) pool = pool.filter(t=>t.type!=="Dark" && t.type!=="Holy");
  if((S.writWins||0)===0 && !forceType){
    const can = pool.filter(t=>{
      return missionPool().some(src=>{
        const probe = hardenDark(Object.assign({}, src));
        if(t.type!=="Any" && t.type!=="Dark" && jobKind(probe)!==t.type) return false;
        if(t.type==="Dark" && !isDarkMission(probe)) return false;
        return firstWritEasy(probe);
      });
    });
    if(can.length) pool = can;
  }
  const t = pick(pool.length?pool:WRIT_POOL);
  S.writ = {
    id:t.id, title:t.title, type:t.type, icon:t.icon, blurb:t.blurb,
    need:writNeed(), have:0, due:S.day+writSpan(), posted:S.day, done:null
  };
  S.writPing = true;
  log("Town writ posted: "+t.title+".");
  ensureWritJob();
}

function creditWrit(m){

  const crew = (m.party||[]).map(id=>(S.people||[]).find(p=>p.id===id)).filter(Boolean);

function cheapestHallKeys(){
  const opts = [];
  Object.keys(BUILDINGS).forEach(k=>{
    const b = BUILDINGS[k];
    if(!b || b.pay==="renown") return;
    const lv = S.buildings[k]||0;
    if(lv >= b.max) return;
    opts.push({k, n:b.n, lv, next:lv+1, cost:b.base*(lv+1)});
  });
  if(!opts.length) return [];
  const min = Math.min.apply(null, opts.map(o=>o.cost));
  return opts.filter(o=>o.cost===min);
}
function applyWritHall(key){

    return finishRaise("writ");

  const b = BUILDINGS[key];
  if(!b || b.pay==="renown") return null;
  const lv = S.buildings[key]||0;
  if(lv >= b.max) return null;
  const cost = b.base*(lv+1);
  S.buildings[key] = lv+1;

  return {key, n:b.n, lv:S.buildings[key], cost};
}

function grantWritHallAuto(){

function sealWrit(ok){

      writCongrats(w, grant, ren);

    } else if(grant.kind==="choice"){
      note("📜 Writ sealed: "+w.title+" — +"+ren+" "+rn()+". The town will raise one "+gp(grant.opts[0].cost)+" hall. Choose which.", "success");
      log("Writ sealed: "+w.title+". Waiting on hall pick.");

      log("Writ sealed: "+w.title+". Hall maxed. +"+gold+"g, +"+ren+" renown.");

  } else {

      note("📜 Writ lapsed: "+w.title+". The town shrugged. No fine — you are still new.", "info");
      log("Writ lapsed softly: "+w.title+".");

}
function tickWrit(){
  if(S.day < WRIT_UNLOCK) return;
  if(!S.writ){

    note("📜 NEW WRIT: "+S.writ.title+". Need "+S.writ.need+" "+S.writ.type+" jobs by day "+S.writ.due+".", "success");

  }
  if(!S.writ.done && S.day > S.writ.due){
    sealWrit(false);

  if(S.writ.done){
    const wait = S.day < 20 ? 48 : 32;
    if(S.day >= (S.writ.due||0)+wait || S.day >= (S.writ.posted||0)+wait+writSpan()){
      postWrit();
      note("📜 NEW WRIT: "+S.writ.title+". Need "+S.writ.need+" "+S.writ.type+" jobs by day "+S.writ.due+".", "success");
    }
  } else if(S.writ && !S.writ.done){

    if(left===2 || left===1) note("📜 Writ due in "+left+" day"+(left===1?"":"s")+": "+S.writ.title+" ("+(S.writ.have||0)+"/"+(S.writ.need||1)+" "+S.writ.type+").", "warn");
  }
}

function lockPay(m){
  if(!m) return 0;
  if(m.pay==null){
    const a=m.gold?m.gold[0]:8, b=m.gold?m.gold[1]:16;
    const v = rng(Math.min(a,b), Math.max(a,b));
    try { m.pay = v; } catch(e){ return v; }
  }
  return m.pay;
}


function lockLoot(m){
  if(!m) return null;
  try {
    if(m.loot===undefined || m.loot===null) m.loot = rollLoot(m);
    if(m.epic && m.loot2===undefined) m.loot2 = rollLoot(m);
    if(m.epic && m.artifact===undefined){
      const pool = epicArtifactPool();
      m.artifact = pool.length ? pick(pool) : null;
    }
  } catch(e){}
  return m.loot || null;
}
function lootValue(m){
  lockLoot(m);
  let n = 0;
  if(m.loot && m.loot.cost) n += m.loot.cost;
  if(m.loot2 && m.loot2.cost) n += m.loot2.cost;
  if(m.artifact && m.artifact.cost) n += m.artifact.cost;
  return n;
}
function lootScore(m){
  lockPay(m);
  const writ = (typeof writMatches==="function" && writMatches(m)) ? 35 : 0;
  return (m.pay||0) + lootValue(m) + writ;
}
function partyFromPool(m, pool){
  const need = Math.max(1, m.need||1);
  const legal = (pool||[]).filter(p=>readyFor(m).some(x=>x.id===p.id))
    .slice().sort((a,b)=>power([b], m)-power([a], m));
  if(legal.length < need) return [];
  const ok = x => { const w = seerWord(x, m); return w==="they walk it" || w==="good chance"; };
  const top = legal.slice(0, need);
  if(ok(top)) return top;
  if(need===1){
    const one = legal.find(p=>ok([p]));
    return one ? [one] : [];
  }
  for(let i=0;i<legal.length;i++){
    for(let j=i+1;j<legal.length && need>=2;j++){
      const pair = [legal[i], legal[j]];
      if(need===2 && ok(pair)) return pair;
      if(need>=3){
        for(let k=j+1;k<legal.length;k++){
          const trio = [legal[i], legal[j], legal[k]];
          if(ok(trio)) return trio.slice(0, need);
        }
      }
    }
  }
  return [];
}
function lootChain(){
  if((S.buildings.seer||0)<1) return [];
  let pool = (S.people||[]).filter(p=>p.status==="ready");
  const open = (S.missions||[]).filter(m=>m && !(m.party&&m.party.length))
    .slice().sort((a,b)=>lootScore(b)-lootScore(a));
  const chain = [];
  open.forEach(m=>{
    if(!pool.length) return;
    const cand = partyFromPool(m, pool);
    if(cand.length < Math.max(1, m.need||1)) return;
    const w = seerWord(cand, m);
    if(w!=="they walk it" && w!=="good chance") return;
    chain.push({m:m, party:cand, extra:0});
    const take = {};
    cand.forEach(p=>take[p.id]=true);
    pool = pool.filter(p=>!take[p.id]);
  });
  if((S.buildings.seer||0)>=3 && pool.length){
    const used = {};
    chain.forEach(c=>used[c.m.id||c.m.t]=true);
    const left = open.filter(m=>!used[m.id||m.t]);
    while(pool.length){
      let best=null, bestParty=null, bestScore=-1;
      left.forEach(m=>{
        if(used[m.id||m.t]) return;
        const need = Math.max(1, m.need||1);
        const legal = pool.filter(p=>readyFor(m).some(x=>x.id===p.id))
          .slice().sort((a,b)=>power([b], m)-power([a], m));
        if(legal.length < need) return;
        for(let extra=1; extra<=legal.length-need && extra<=3; extra++){
          const party = legal.slice(0, need+extra);
          const w = seerWord(party, m);
          if(w!=="they walk it" && w!=="good chance") continue;
          const cut = Math.pow(0.75, extra);
          const score = Math.floor((m.pay||0)*cut) + lootValue(m);
          if(score>bestScore){ bestScore=score; best=m; bestParty=party; }
        }
      });
      if(!best) break;
      const extra = bestParty.length - Math.max(1, best.need||1);
      chain.push({m:best, party:bestParty, extra:extra});
      used[best.id||best.t]=true;
      const take = {};
      bestParty.forEach(p=>take[p.id]=true);
      pool = pool.filter(p=>!take[p.id]);
    }
  }
  return chain;
}

function chainSlot(m){
  if(!m || (S.buildings.seer||0)<2) return null;
  return lootChain().find(x=>(x.m.id||x.m.t)===(m.id||m.t)) || null;
}
function chainLeftovers(){
  if((S.buildings.seer||0)<3) return [];
  const used = {};
  lootChain().forEach(c=>c.party.forEach(p=>used[p.id]=true));
  const adds = S._chainAdds || {};
  Object.keys(adds).forEach(k=>(adds[k]||[]).forEach(id=>used[id]=true));
  return (S.people||[]).filter(p=>p.status==="ready" && !used[p.id]);
}
function chainSendBtn(m){
  const slot = chainSlot(m);
  if(!slot || !slot.party.length) return "";
  const added = ((S._chainAdds||{})[m.id]||[]).map(id=>S.people.find(p=>p.id===id)).filter(Boolean);
  if((S.buildings.seer||0)>=4){
    const left = chainLeftovers();

    if(left[idx]) added.push(left[idx]);
  }
  const all = slot.party.concat(added);
  const names = all.map(p=>CLASSES[p.cls].icon+" "+p.name.split(" ")[0]).join(" · ");
  const idx = lootChain().findIndex(x=>(x.m.id||x.m.t)===(m.id||m.t));
  const tag = (idx===0 ? "1 BEST" : (idx+1)+" NEXT") + (slot.extra? " · +"+slot.extra+" extra":"");
  const left = chainLeftovers();
  const addBtn = left.length ? `<button class="ghost" data-add="${m.id}" data-who="${left[0].id}" style="margin-top:6px;margin-left:6px">Add ${left[0].name.split(" ")[0]}</button>` : "";
  return `<p class="tiny" style="color:#e0b84a">Seer ${tag}: ${names}</p>

function bestLootId(){

function itemStatBits(it){
  if(!it) return "";
  const src = catalog(it.kind, it.id) || it;
  const bits = [];
  if(src.atk) bits.push("+"+src.atk+" ATK");
  if(src.def) bits.push("+"+src.def+" DEF");
  if(src.hp) bits.push("+"+src.hp+" HP");
  if(src.heal) bits.push("heals "+src.heal);
  if(src.pwr) bits.push("+"+src.pwr+" PWR");
  return bits.length ? " ("+bits.join(", ")+")" : "";
}
function questLootLine(m){
  if((S.buildings.seer||0)<2) return "";
  lockLoot(m);
  const bits = [];
  const stats = (S.buildings.seer||0)>=3;
  if(m.artifact) bits.push(itemNameHtml(m.artifact)+(stats?itemStatBits(m.artifact):"")+" · worth "+gp(m.artifact.cost||0));
  [m.loot, m.loot2].forEach(it=>{
    if(!it) return;
    const name = it.n || (catalog(it.kind, it.id)||{}).n || it.id;
    bits.push((it.icon||"")+" "+itemNameHtml(it.n?it:Object.assign({}, it, {n:name}))+(stats?itemStatBits(it):"")+" · worth "+gp(it.cost||0));
  });
  if(!bits.length) bits.push("no extra loot");
  return `<p class="tiny" style="color:#e0b84a;font-weight:700">Drops: ${bits.join(" · ")}</p>`;
}
function payLabel(m){
  if((S.buildings&&S.buildings.seer||0)>=1) return gp(lockPay(m));
  return gp(m.gold[0])+"–"+gp(m.gold[1]);
}
function questFlavor(m, names, success, pwr){
  const ratio = pwr/Math.max(1,(m.diff||1)*8);
  const pick1=a=>a[Math.floor(Math.random()*a.length)];
  if(success){
    if(ratio>=1.5) return pick1([names+" made "+m.t+" look easy.","It was never in doubt. "+names+" finished "+m.t+" clean."]);
    if(ratio>=0.9) return pick1(["A fair job. "+names+" got "+m.t+" done.",names+" worked for it, and "+m.t+" came through."]);
    return pick1([names+" were stretched thin and still finished "+m.t+".","It nearly went wrong. "+names+" pulled "+m.t+" off."]);
  }
  return pick1([names+" could not finish "+m.t+" and came home hurt.",m.t+" broke them. "+names+" limped back."]);
}

function resolveMission(m){
  const party = m.party.map(id=>S.people.find(p=>p.id===id)).filter(Boolean);
  if(!party.length) return;
  const pwr = power(party, m);
  const target = m.diff * 8 + rng(3,9);
  const ratio = pwr / target;
  const success = ratio + Math.random()*0.16 > 0.98;
  if(m.winback){
    const rec = (S.poached||{})[m.wbId];
    if(success && rec){
      const back = Object.assign({}, rec); back.status="ready"; back.loyalty=1; back.mission=null; back.daysOut=0; delete back.tries;
      S.people.push(back);
      delete S.poached[m.wbId];
      note(rec.name+" came back. Loyalty 1.","success");
    } else {
      S.renown = Math.max(0, (S.renown||0)-1);
      if(rec){ rec.tries = (rec.tries||0)+1; postWinBack(rec, rec.tries); }
      note("The win-back failed. -1 Renown.","bad");
    }
    return;
  }
  if(m.recovery){
    if(success){
      const fallen=(S.people||[]).find(x=>x.id===m.fallenId);
      const ren=m.renown||((m.diff||1)*2);
      S.renown=(S.renown||0)+ren;
      if(fallen){ fallen.status="wounded"; fallen.hp=Math.max(1,Math.floor((fallen.maxhp||8)*0.5)); fallen.wound=2; log(fallen.name+" was brought home, with what they carried. +"+ren+" renown."); note(fallen.name+" came home wounded. The gear came with them.", "success"); }
      const watcher=(S.people||[]).find(x=>x.id===m.watcherId);
      if(watcher){ watcher.status="ready"; watcher.daysOut=0; watcher.graveWith=null; note(watcher.name+" comes back with the body.", "success"); }
      else log("The body was recovered. +"+ren+" renown.");
    } else {
      party.forEach(p=>{ p.status="wounded"; p.hp=Math.max(1,Math.floor((p.maxhp||8)*0.5)); });
      log("Failed to bring them home. The quest stays on the board.");
      note("The recovery failed. It is still on the board.", "fail");
    }
    party.forEach(p=>{ if(p.status!=="wounded") p.status="ready"; p.mission=null; });
    m.party=[];
    if(success) S.missions=S.missions.filter(x=>x.id!==m.id);
    save(); return;
  }
  tickBonds(party, success);
  let gold = (m.pay!=null?m.pay:rng(m.gold[0], m.gold[1]));
  let ren = Math.max(1, m.diff||m.need||1);
  if(party.some(p=>hasTrait(p,"Treasure Hunter")) && success) gold = Math.floor(gold*(party.some(p=>hasTrait(p,"Treasure Hunter")&&isEpic(p))?1.4:1.2));
  if(success){
    const inv = party.filter(p=>hasTrait(p,"Investor")).length;
    const leak = party.filter(p=>hasTrait(p,"Spendthrift")).length;
    if(inv){
      const room = Math.max(0, bankCap()-(S.deposit||0));
      const add = Math.min(room, 5*inv);
      if(add){ S.deposit = (S.deposit||0)+add; log("Investor parked "+add+" in the vault."); }
    }
    if(leak){
      let take = 5*leak;
      const fromV = Math.min(S.deposit||0, take);
      S.deposit = (S.deposit||0)-fromV; take -= fromV;
      if(take){ const fromP = Math.min(S.gold||0, take); S.gold -= fromP; take -= fromP; }
      log("Spendthrift drained "+(5*leak)+" from the vault.");
    }
  }
  if(m.beggarGold && success) gold = Math.floor(gold * (1+m.beggarGold));
  if(party.some(p=>hasTrait(p,"Wasteful")) && success) gold = Math.max(1, Math.floor(gold*0.8));
  if(success){
    party.forEach(p=>{
      if(hasTrait(p,"Charming")) ren += 1;
      if(hasTrait(p,"Sour")) ren -= 1;
      if(hasTrait(p,"Tithe-hand") && writMatches(m)) ren += 1;
    });
  }
  if(success){
    party.forEach(p=>{
      const r = roleDef(p);
      if(r && r.gold) gold = Math.max(1, Math.floor(gold * (1 + r.gold)));
      const q = quirkDef(p);
      if(q && q.id==="basket" && jobTypeOf(m)==="Gathering") gold = Math.max(1, Math.floor(gold * 1.15));
    });
  }
  const extraHands = Math.max(0, party.length - (m.need||1));
  if(extraHands) gold = Math.max(1, Math.floor(gold * (1 - 0.25*extraHands)));
  const foodNotes = [];
  if(success){
    party.forEach(p=>{
      const f = foodOf(p);
      if(f && f.gold && !p.foodSkip){
        const before = gold;
        gold = Math.max(1, Math.floor(gold * (1 + f.gold)));
        p._foodGold = gold - before;
      }
    });
  }
  const names = party.map(p=>p.name).join(", ");
  const icon = (typeof MISSION_ICON!=="undefined" && MISSION_ICON[m.t]) ? MISSION_ICON[m.t]+" " : "";

  party.forEach(p=>{
    const f = p.foodSkip ? null : foodOf(p);
    let healed = 0;
    const ateAtHall = !!(f && p.foodEaten);
    if(f && f.heal && !ateAtHall){
      const before = p.hp||0;
      const extra = (p.quirk==="iron_gut") ? 3 : 0;
      p.hp = Math.min(p.maxhp, before + f.heal + extra);
      healed = p.hp - before;
      party.forEach(c=>{
        if(c && c.id!==p.id && c.quirk==="cup_bearer"){
          const half = Math.floor((f.heal||0)/2);
          if(half){
            const b = c.hp||0;
            c.hp = Math.min(c.maxhp, b + half);
            if(c.hp>b) log(c.name+" drank half of "+p.name+"'s "+f.n+" (+"+(c.hp-b)+" HP).");
          }
        }
      });
    }
    p.mission = null;
    p.daysOut = 0;
    if(success){
      let sage = 0;
      party.forEach(x=>{ const rr=roleDef(x); if(rr&&rr.xp) sage += rr.xp; });
      p.xp += 4 + m.diff + (S.buildings[CLASS_SCHOOL[p.cls]]||0) + (f && f.xp ? f.xp : 0) + sage;
      const oldLv = p.lv;
      tryLevel(p);
      if(p.lv > oldLv) note("✦ "+p.name+" reached level "+p.lv+"!", "level");
      bumpLoy(p, 1);
      if((roleDef(p)||{}).loy || p.quirk==="oathbound") bumpLoy(p, 1);
      if(hasTrait(p,"Blooded")) bumpLoy(p, 1);
      if(p.quirk==="dawn_singer" && isHolyMission(m)) S.dawnSing = p.name.split(" ")[0];
      const typ = jobTypeOf(m);
      if(typ){
        const n = addRep(p, typ);
        if(n===3 || n===6) note(p.name+" is now "+repTier(n).n+" on "+typ+" jobs.", "success");
      }
      const hurt = Math.random() < (0.28 + m.diff*0.045 - defOf(p)*0.008 + (hasTrait(p,"Reckless")?0.14:0)+(kitOf(p)&&kitOf(p).wound?kitOf(p).wound:0));
      if(hurt){
        p.hp = Math.max(1, p.hp - rng(4,11));
        p.status = p.hp < p.maxhp*0.4 ? "wounded" : "ready";
        note(woundStory(p, m, false), "warn");
        bumpLoy(p, -1);
        if(saintReady(p)) queueSaint(p);
      } else p.status = "ready";
    } else {
      if(hasTrait(p,"Fickle")) bumpLoy(p, -1);
      p.hp = Math.max(0, p.hp - (rng(8,16) + Math.max(0,(m.diff||1)-1)*4));
      if(p.hp <= 0){
        const oddsWord = seerWord(party, m);
        const oddsCut = oddsWord==="good chance"?0.05:oddsWord==="even"?0.10:oddsWord==="bloody"?0.15:oddsWord==="a grave"?0.20:0;
        if(Math.random() < 0.35 + S.buildings.infirmary*0.1 + (hasTrait(p,"Grim")?0.15*emult(p):0) + (hasTrait(p,"Soft")?-0.15:0) - oddsCut){
          p.hp = 1; p.status = "wounded";
          log(p.name+" nearly died on "+m.t+" but was dragged home.");
          note(woundStory(p, m, true), "warn");
        } else {
          const savior = (!m._bloodUsed) && party.filter(x=>x && x.id!==p.id && x.quirk==="blood_debt" && x.status!=="dead").sort((a,b)=>(b.lv||1)-(a.lv||1))[0];
          if(savior){
            m._bloodUsed = true;
            p.hp = 1; p.status = "wounded";
            savior.hp = 1; savior.status = "wounded";
            if(!S.bloodAsk) S.bloodAsk = [];
            if(S.bloodAsk.indexOf(savior.id)<0) S.bloodAsk.push(savior.id);
            log(savior.name+" took the killing blow for "+p.name+" on "+m.t+".");
            note(savior.name+" took the blow meant for "+p.name+". Both live wounded.", "warn");
          } else {
            p.status = "dead";
            log(p.name+" fell on "+m.t+".");
            note(p.name+" fell on "+m.t+".", "fail");
            postRecovery(p, m);
          }
        }
      } else {
        p.status = "wounded";
        note(woundStory(p, m, false), "warn");
      }
      if(p.status==="wounded") bumpLoy(p, -1);
    }
    if(f){
      const bits = [];
      if(ateAtHall) bits.push("used at the Hall");
      if(healed>0) bits.push("healed "+healed+" HP");
      else if(f.heal && !ateAtHall) bits.push("already full");
      if(f.pwr) bits.push("+"+f.pwr+" power");
      if(f.dark && isDarkMission(m)) bits.push("+"+f.dark+" Dark power");
      if(p._foodGold) bits.push("+"+gp(p._foodGold)+" extra");
      if(success && f.xp) bits.push("+"+f.xp+" XP");
      const line = (f.icon||"🍖")+" "+p.name+(ateAtHall?" 's "+f.n+" paid off on "+m.t:" ate "+f.n+" on "+m.t)+(bits.length?" — "+bits.join(", "):"")+".";
      foodNotes.push(line);
      log(p.name+" ate "+f.n+" on "+m.t+(bits.length?" ("+bits.join(", ")+")":"")+".");
      delete p._foodGold;
      consumeFood(p);
    }
    delete p.foodSkip;
    const kk = kitOf(p);
    if(kk){
      if(kk.heal && p.status!=="dead"){
        p.hp = Math.min(p.maxhp, (p.hp||0)+kk.heal);
      }
      if(kk.loy && p.status!=="dead") bumpLoy(p, kk.loy);
      p.kit = null;
      log(p.name+" used "+kk.n+".");
    }
  });
  const fallen = party.filter(x=>x.status==="dead");
  if(fallen.length){
    party.forEach(w=>{
      if(w.quirk==="grave_watcher" && w.status!=="dead"){
        w.status = "away";
        w.daysOut = 999;
        w.mission = null;
        w.graveWith = fallen[0].id;
        note(w.name+" stays with the body.", "warn");
      }
    });
  }
  sweepQuit();
  const live = party.filter(p=>p.status!=="dead");
  let healAmt = 0;
  live.forEach(p=>{
    const r = roleDef(p);
    if(r && r.heal) healAmt += r.heal;
    if(p.quirk==="field_aid") healAmt += 2;
  });
  if(healAmt){
    live.forEach(p=>{
      if(p.status==="dead") return;
      p.hp = Math.min(p.maxhp, (p.hp||0)+healAmt);
      if(p.status==="wounded" && p.hp >= p.maxhp*0.4) p.status = "ready";
    });
    note("Party patched "+healAmt+" HP on the road home.", "success");
  }
  const chem = chemDelta(party);
  if(chem>0) note("Mixed company worked well on "+m.t+" (+"+chem+" power).", "info");
  else if(chem<0) note("Same-class party crowded the work on "+m.t+" ("+chem+" power).", "info");

  if(success){
    if(success && seasonOf()==="autumn") gold = Math.floor(gold*1.15);
    if(success && S.plant) gold += 2;
    if(success && party.some(p=>p.quirk==="purse_split")){
      const room = Math.max(0, bankCap()-(S.deposit||0));
      const sip = Math.min(room, Math.floor(gold*0.1));
      if(sip){
        gold -= sip;
        S.deposit = (S.deposit||0)+sip;
        log("Purse-split parked "+sip+" in the vault.");
      }
    }
    S.gold += gold; S.renown += ren;
    rivalClear(m);
    log("Success: "+m.t+". +"+gp(gold)+", +"+ren+" "+rn()+". "+names);
    const cheers = ["VICTORY","THEY DID IT","JOB DONE","THE HALL CHEERS","A CLEAN WIN"];
    note(pick(cheers)+": "+icon+m.t+" — "+names+" brought home +"+gp(gold)+" and +"+ren+" "+rn()+"!", "success");
    const wc = creditWrit(m);
    if(wc===1) note("📜 Writ mark "+S.writ.have+"/"+S.writ.need+" on "+S.writ.title+".", "success");
    foodNotes.forEach(t=>note(t, "success"));
    const got = giveLoot(m);
    tryShadowLoot(m);
    (S._questResults=S._questResults||[]).push({title:m.t, story:questFlavor(m, names, true, pwr), line:"+"+gp(gold)+" · +"+ren+" renown"+(got?" · took "+got:"")});
    if(m.epic){
      grantEpicArtifact(m);
      giveLoot(m);
      S.epicWins = (S.epicWins||0)+1;
      note("The epic is done. A new one will pin when the board steadies.", "level");
    }
  } else {
    const pity = Math.floor(gold*0.2);
    S.gold += pity;
    log("Failed: "+m.t+". The party limped home with "+gp(pity)+".");
    note(icon+m.t+" FAILED. "+names+" limped home with "+gp(pity)+".", "fail");
    (S._questResults=S._questResults||[]).push({title:m.t, story:questFlavor(m, names, false, pwr), line:"Failed · limped home with "+gp(pity)});
    foodNotes.forEach(t=>note(t, "info"));
  }
}

function doorWaiting(){ return !!(S.seekers && S.seekers.length); }
function checkGameOver(){
  if(S.gameOver) return;
  const living = livingRoster();
  if(living.length) return;
  const cheapest = 45;
  if((S.gold||0) >= cheapest) return;
  S.gameOver = true;

    <h3 style="margin:8px 0">${name}</h3>
    <p class="tiny" style="font-style:italic">Here lies a hall with no one left to answer the door.</p>
    <p class="tiny">The last face is gone and the purse is empty. No one will come for this.</p>
    <button type="button" class="act" id="restartHall" style="width:100%;margin-top:14px">Restart hall</button>
  </div>`;
  modal.classList.add("show"); modal.style.display="flex";
  document.getElementById("restartHall").onclick=()=>{ S.gameOver=false; closeModal(); newGame(); };
}
function endDay(){
  checkGameOver();
  hideNightReport();
  if(typeof hasLiveRoadUi==="function" && hasLiveRoadUi()){
    return toast("Decide the road first.");
  }
  if(S._roadStall){
    return toast("Decide the road first.");
  }
  if(ENC_BUSY){
    if(typeof hasLiveRoadUi==="function" && hasLiveRoadUi()) return toast("Decide the road first.");
    ENC_BUSY = false;
  }
  if(doorWaiting()){
    toast("Faces at the door first.");
    openSeekers();
    return;
  }
  if(!S.hallEvent && !S.seasonAsk && !S.contestAsk && !S.rivalWritAsk){
    closeModal();
  }
  DAY = [];
  let wages = 0;
  S.people.forEach(p=>{
    if(p.status==="dead") return;
    if(p.status==="wounded"){
      const was = p.status;
      let dawnHeal = 3 + S.buildings.infirmary*2;
      if(hasTrait(p,"Quick mend")) dawnHeal += 2;
      if(hasTrait(p,"Slow clot")) dawnHeal -= 2;
      if(S.dawnSing) dawnHeal += 1;

      p.hp = Math.min(p.maxhp, p.hp + Math.max(0, dawnHeal));
      if(p.hp >= p.maxhp*0.75) {
        p.status = "ready";
        note(p.name+" recovered enough to work.");
      }
    } else if(p.status==="ready"){
      if(p.sickUntil && S.day < p.sickUntil) p.status = "wounded";
      else p.hp = Math.min(p.maxhp, p.hp + 2);
    }
    if((S.cookUntil||0) > S.day && p.status!=="away" && p.status!=="dead"){
      p.hp = Math.min(p.maxhp, (p.hp||0)+3);
    }
    if(seasonOf()==="spring" && p.status!=="away" && p.status!=="dead"){
      p.hp = Math.min(p.maxhp, (p.hp||0)+1);
    } else if(p.status==="away" && p.kinUntil){
      if(S.day >= p.kinUntil){
        p.status = "ready";
        p.daysOut = 0;
        p.mission = null;
        p.kinUntil = null;
        bumpLoy(p, 1);
        note(p.name+" came home"+(p.homeWhy==="levy"?" from the levy":p.homeWhy==="watch"?" from the watch":" from kin")+". Loyalty "+loyOf(p)+".");
        p.homeWhy = null;
      }
    } else if(p.status==="away" && p.quirk==="grave_watcher" && !p.graveWith && !(S.missions||[]).some(m=>m.party&&m.party.indexOf(p.id)>=0)){
      p.daysOut = Math.max(0, (p.daysOut||1)-1);
      if(p.daysOut<=0){ p.status="ready"; p.mission=null; note(p.name+" came back from the grave-watch."); }
    }
    if(p.status!=="away" && p.status!=="dead") {
      const w = dayFee(p);
      if(funds() >= w){
        wages += w;
        spend(w);
      } else if(p.hiredOn===S.day){
        note(p.name+" was hired today. No wage is due tonight.", "info");
      } else {
        bumpLoy(p, -1);
        note(p.name+" went unpaid. Loyalty "+loyOf(p)+".", "warn");
      }
    }
  });
  sweepQuit();
  if(wages) note("Wages paid: "+gp(wages)+".");
  if(S.dawnSing){
    S.renown = (S.renown||0)+1;
    note(S.dawnSing+" sang the dawn. +1 Renown. Wounded healed +1.", "success");
    S.dawnSing = null;
  }
  if(S.deposit > bankCap()) S.deposit = bankCap();
  tickLoan();
  const interest = bankInterest();
  if(interest){
    S.deposit += interest;
    if(S.deposit > bankCap()){
      const extra = S.deposit - bankCap();
      S.deposit = bankCap();
      S.gold += extra;
      /* interest stays off the night report */
    } else {
    }
    log("Bank paid "+interest+" interest.");
  }

  const chance = encChance();
  const hits = [];
  (S.missions||[]).forEach(m=>{
    if(!m || !m.party || !m.party.length) return;
    if(m.epic) return;
    const members = partyOf(m).filter(p=>p.status==="away");
    if(!members.length) return;
    const left = Math.max(m.left||0, ...members.map(p=>+p.daysOut||0));
    if(left < 1) return;
    if(m.lastEnc && (S.day - m.lastEnc) < 5) return;
    if(chance>0 && Math.random()*100 < chance){
      const enc = pickRoadEnc();
      if(enc){
        m.lastEnc = S.day;
        hits.push({m, party:members, enc, locked: !!(enc.combat && Math.random()*100 < lockChance())});
      }
    }
  });
  if(hits.length){
    note("The road forced a choice.", "warn");
    return runEncounters(hits, ()=>tickMissions());
  }
  tickMissions();
}
function tickMissions(){
  (S.missions||[]).forEach(m=>{
    if(!m.party || !m.party.length) return;
    const members = m.party.map(id=>S.people.find(p=>p.id===id)).filter(Boolean);
    if(!members.length){ m.party=[]; return; }
    members.forEach(p=>{ if(p.status!=="dead") p.status="away"; p.daysOut = Math.max(0, (Number(p.daysOut)||Number(m.left)||1)-1); });
    m.left = Math.max(0, (Number(m.left)||1)-1);
    if(m.left<=0 || members.every(p=>p.daysOut<=0)){
      resolveMission(m);
      if(m.recovery && (S.missions||[]).some(x=>x.id===m.id)){
        m.party = [];
        m.left = null;
        m.span = null;
        m.done = false;
      } else if(m.epic && !m.epicWon){
        m.party = [];
        m.left = null;
        m.span = null;
      } else m.done = true;
    } else {
      /* field status is the green night-report block */
    }
  });
  S.missions = S.missions.filter(m=>!m.done);
  S.day++;
  const before = S.missions.filter(m=>!m.party || !m.party.length).length;
  refreshMissions();
  const after = S.missions.filter(m=>!m.party || !m.party.length).length;
  restockHire();
  [tickRaise, tickWrit, tickRestless, tickSeekers, tickSeason, tickRival, tickHallEvent, tickFeatured].forEach(fn=>{
    try { if(typeof fn==="function") fn(); } catch(e){}
  });
  log("A new day in the hall.");

  render();
  showDayReport();
  nextDoorQueue();
}

function posNeg(p){
  const t = traitList(p);
  const neg = t.filter(x=>NEGATIVE_TRAITS.indexOf(x)>=0).length;
  return { t, pos: t.length-neg, neg };
}
function isFlawedOnly(p){
  const s = posNeg(p);
  return (s.t.length===1 && s.neg===1) || (s.pos===1 && s.neg===2);
}
function isGifted(p){
  const s = posNeg(p);
  return (s.pos===2 && s.neg===0) || (s.pos===2 && s.neg===1);
}
function isElite(p){
  const s = posNeg(p);
  return (s.pos===3 && s.neg===0);
}
function renownDisc(){
  return Math.min(0.50, Math.max(0, (S.renown||0))*0.01);
}
function afterRenown(n){
  return Math.max(1, Math.floor(n * (1-renownDisc())));
}
function wageOf(p){
  if(p && p.hero) return 0;
  const base = 4 + (p.lv||1);
  let w = base;
  if(seasonOf()==="winter" && !S.firewood && !S.grain) w += 1;
  if(isFlawedOnly(p)) w = Math.max(1, Math.floor(base/2));
  else if(isElite(p)) w = Math.max(1, base*2);
  else if(isGifted(p)) w = Math.max(1, Math.ceil(base*1.5));
  return afterRenown(w);
}

function hireCost(p){
  const band = {1:45, 2:80, 3:125, 4:180, 5:250, 6:330, 7:420, 8:520};
  const lv = Math.max(1, Math.min(8, p.lv||1));
  let cost = (band[lv]||125) + (p.cls==="Mage"||p.cls==="Cleric"?15:0);
  if(isFlawedOnly(p)) cost = Math.max(10, Math.floor(cost/2));
  if(isElite(p)) cost = cost*3;
  else if(isGifted(p)) cost = cost*2;
  return afterRenown(cost);
}
function hireMaxLv(){
  return Math.max(1, Math.min(5, 1 + Math.floor((S.renown||0)/12)));

function restockHire(){
  if((S.tapDry||0) > S.day){
    S.hire = [];
    return;
  }
  const n = hireCount();
  const maxLv = hireMaxLv();
  S.hire = [];
  const used = {};
  for(let i=0;i<n;i++){
    const keys = Object.keys(CLASSES).filter(k=>!used[k]);
    const cls = keys.length ? pick(keys) : pick(Object.keys(CLASSES));
    const lv = rng(1, maxLv);
    const p = makePerson(true, cls, lv);
    p.lv = lv;
    p.maxhp = CLASSES[p.cls].hp + lv*2;
    p.hp = p.maxhp;
    p.wage = 4 + lv;
    used[p.cls] = true;
    outfitHire(p);
    S.hire.push(p);
  }

function rivalPlay(){
  const r = ensureRival();
  if(r.gold==null) r.gold = 40;
  if(!r.blv){ r.blv = Math.max(1, Math.min(BUILDINGS.barracks.max, Math.ceil(((r.bunks||2)-2)/2))); }
  if(r.braise && r.braise.left>0){
    r.braise.left -= 1;
    if(r.braise.left<=0){
      r.blv = r.braise.to; r.braise = null;
      rivalNote(r, "Barracks reached Lv "+r.blv+" ("+(2+2*r.blv)+" bunks).");
      note(r.name+" finished Barracks Lv "+r.blv+".", "info");
    }
  }
  r.bunks = 2 + 2*r.blv;
  if(!r.faces) r.faces = [];
  fleshRival(r);
  const wageBill = r.faces.reduce((n,f)=>n+(f&&f.status!=="dead"?dayFee(f):0),0);
  const stipend = Math.max(6, wageBill);
  r.gold = (r.gold||0) + stipend;
  r.faces.slice().forEach(f=>{
    if(!f || f.status==="away" || f.status==="dead") return;
    if(f.hiredOn===S.day) return;
    const w = dayFee(f);
    if((r.gold||0) >= w){ r.gold -= w; }
    else {
      f.loyalty = Math.max(0, (f.loyalty||2)-1);
      if(f.loyalty<=0){
        const hit = quitRenownHit(f);
        r.renown = Math.max(0, (r.renown||0)-hit);
        r.faces = r.faces.filter(x=>x!==f);
        rivalNote(r, (f.name||"A face")+" went unpaid and left. Renown -"+hit+", now "+r.renown+".");
      } else rivalNote(r, (f.name||"A face")+" went unpaid. Loyalty "+f.loyalty+".");
    }
  });
  const hire = 2*(20 + (r.faces.length*8));
  const reserve = 5*Math.max(6, wageBill);
  if(r.faces.length < r.bunks && r.gold-hire>=reserve){
    r.gold -= hire;
    const nf = makeRivalFace(pick(Object.keys(CLASSES)), 1);
    nf.hiredOn = S.day;
    r.faces.push(nf);
    rivalNote(r, "Hired "+(nf.name||nf.cls)+" for "+hire+" gold. Gold left "+r.gold+".");
    note(r.name+" hired from the Tap.", "info");
  }
  const nextLv = (r.blv||1)+1;
  const bunkCost = BUILDINGS.barracks.base * nextLv;
  if(!r.braise && r.faces.length>=r.bunks-1 && r.gold-bunkCost>=reserve && nextLv<=BUILDINGS.barracks.max){
    r.gold -= bunkCost;
    r.braise = {to:nextLv, left:raiseDays(nextLv)};
    rivalNote(r, "Started Barracks Lv "+nextLv+" for "+bunkCost+" gold, "+raiseDays(nextLv)+" days. Gold left "+r.gold+".");
    note(r.name+" started raising Barracks to Lv "+nextLv+".", "info");
  }
}
function tickRival(){
  try { healContest(); } catch(e){}
  try { rivalPlay(); } catch(e){}
  const r = ensureRival();
  if(S.contestUntil && S.day>=S.contestUntil){
    S.contestUntil = null;
    const ids = S.contestParty||[];
    S.contestParty = [];
    ids.forEach(id=>{
      const p=(S.people||[]).find(x=>x.id===id);
      if(!p||p.status==="dead") return;
      if(p.mission==="contest"){ p.status="ready"; p.mission=null; p.daysOut=0; }
    });
    const pwr = ids.reduce((n,id)=>{
      const p=(S.people||[]).find(x=>x.id===id);
      return n+(p?(pwrOf(p)||((p.lv||1)*8)):0);
    },0);
    const theirs = S.contestTheir!=null ? S.contestTheir : Math.ceil(1.25*pwr);
    S.contestTheir = null;
    const mine = pwr + ((S.buildings.seer||0)>=4?4:0);
    const bigger = Math.max(mine, theirs);
    const diff = Math.abs(mine-theirs);
    let win = mine >= theirs;
    if(diff < bigger*0.25 && diff>0){
      const odds = Math.max(0.05, 0.35 - diff/Math.max(1,bigger));
      if(Math.random() < odds) win = !win;
    }
    const us0 = S.renown||0, them0 = r.renown||0;
    const gap = Math.abs(us0-them0);
    if(win){
      const ahead = us0>=them0;
      const gain = ahead ? 5 : Math.max(5, Math.floor(gap/2));
      S.renown = us0 + gain;
      if(ahead){ r.renown = Math.max(0, them0-1); rivalNote(r, "Lost the guild contest. Renown -1, now "+r.renown+"."); }
      S.gold = (S.gold||0) + them0;
      S.hallEvent = S.hallEvent || {id:"rival_contest_done", win:true, name:r.name, them:r.renown, us:S.renown, pwr, theirs, gain, gold:them0};
      stampHallEvent();
      if(S.hallEvent) recordHallEvent(S.hallEvent, "roll");
    } else {
      ids.forEach(id=>{
        const p=(S.people||[]).find(x=>x.id===id);
        if(!p||p.status==="dead") return;
        p.status="wounded";
        p.hp=Math.max(1,Math.floor((p.maxhp||8)*0.5));
      });
      const ahead = them0>=us0;
      const gain = ahead ? 5 : Math.max(5, Math.floor(gap/2));
      r.renown = them0 + gain;
      rivalNote(r, "Won the guild contest. Renown +"+gain+", now "+r.renown+".");
      if(ahead) S.renown = Math.max(0, us0-1);
      r.gold = (r.gold||0) + us0;
      S.hallEvent = S.hallEvent || {id:"rival_contest_done", win:false, name:r.name, them:r.renown, us:S.renown, gain, gold:us0};
      stampHallEvent();
      if(S.hallEvent) recordHallEvent(S.hallEvent, "roll");
    }
  }
  if(!r.nextWrit) r.nextWrit = S.day+8;
  if(S.day>=r.nextWrit){
    r.nextWrit = S.day+8;
    const gain = 1;
    r.renown = (r.renown||0) + gain;
    rivalNote(r, "Sealed a writ. Renown +"+gain+", now "+r.renown+".");
    S.rivalWritAsk = {id:"rival_writ", name:r.name, them:r.renown, us:S.renown||0, gain:gain};
  }
}
function fameBand(){

function visitorAim(band){
  if(band<=0) return Math.random()<0.55 ? "flawed" : "common";
  if(band===1) return Math.random()<0.35 ? "flawed" : (Math.random()<0.7 ? "common" : "gifted");
  if(band===2) return Math.random()<0.15 ? "flawed" : (Math.random()<0.45 ? "common" : "gifted");
  if(band===3) return Math.random()<0.08 ? "flawed" : (Math.random()<0.35 ? "common" : (Math.random()<0.75 ? "gifted" : "elite"));
  return Math.random()<0.2 ? "gifted" : (Math.random()<0.55 ? "elite" : "common");
}
function faceGrade(p){

function forceVisitorTraits(aim){
  const good = TRAITS.filter(x=>NEGATIVE_TRAITS.indexOf(x)<0);
  const bad = NEGATIVE_TRAITS.slice();
  function take(pool, n){
    const out=[], bag=pool.slice();
    for(let i=0;i<n && bag.length;i++) out.push(bag.splice(rng(0,bag.length-1),1)[0]);
    return out;
  }
  if(aim==="flawed") return Math.random()<0.55 ? take(bad,1) : take(good,1).concat(take(bad,2));
  if(aim==="gifted") return Math.random()<0.55 ? take(good,2) : take(good,1).concat(take(bad,1));
  if(aim==="elite") return Math.random()<0.6 ? take(good,3) : take(good,2).concat(take(bad,1));
  return take(good,1);
}
function doorGearBand(fame){
  let cap = 1;
  if((S.day||1)>=18) cap = 2;
  if((S.day||1)>=35) cap = 3;
  if((S.day||1)>=55) cap = 4;

function outfitVisitor(p, band){
  const ranks = band<=0 ? ["junk","common"] : band===1 ? ["junk","common","uncommon"] : band===2 ? ["common","uncommon","rare"] : band===3 ? ["uncommon","rare","epic"] : ["rare","epic","artifact"];
  const wt = {junk:8, common:10, uncommon:5, rare:2, epic:1, artifact:1};
  function grab(kind){
    const list = (kind==="weapon"?WEAPONS:kind==="armor"?ARMORS:FOODS).filter(x=>{
      if(x.road) return false;
      if(kind!=="food" && !canWield(p, x)) return false;
      const r = x.r || (x.unique?"artifact":"common");
      if(r==="artifact" && band<4) return false;
      if(r==="epic" && band<3) return false;
      return ranks.indexOf(r)>=0;
    });
    if(!list.length) return null;
    const bag = [];
    list.forEach(it=>{
      const n = wt[it.r || (it.unique?"artifact":"common")] || 3;
      for(let i=0;i<n;i++) bag.push(it);
    });
    return bag.length ? pick(bag) : pick(list);
  }
  const w = grab("weapon") || WEAPONS[0];
  const a = grab("armor") || ARMORS[0];
  p.weapon = w.id; p.armor = a.id;
  if(Math.random() < (0.15+band*0.12)){
    const f = grab("food");
    if(f) p.food = f.id;
  } else p.food = null;
}
function makeVisitor(){
  const band = fameBand();
  const gear = doorGearBand(band);
  const aimBand = (S.day||1)<25 ? Math.min(band, 2) : band;
  const lv = Math.max(1, Math.min(8, 1 + Math.min(band, (S.day||1)<20 ? 2 : band) + rng(0,1)));
  const aim = visitorAim(aimBand);
  const p = makePerson(false, pick(Object.keys(CLASSES)), lv);
  p.lv = lv;
  p.maxhp = CLASSES[p.cls].hp + lv*2;
  p.hp = p.maxhp;
  p.traits = forceVisitorTraits(aim);
  p.trait = p.traits[0];
  p.role = pickRoleId(p.cls, p);
  p.quirk = pickQuirkId(p);
  stampPerson(p);
  outfitVisitor(p, gear);
  p.seeker = true;
  return p;
}

  r.renown=them0+gain;
  if(ahead) S.renown=Math.max(0,us0-1);

  return gain;
}
function contestRefuseGain(){

  return them>=us ? 5 : Math.max(5, Math.floor(Math.abs(us-them)/2));
}

function nextDoorQueue(){
  healHallEvent();
  if(typeof hasLiveRoadUi==="function" && hasLiveRoadUi()) return;
  if(S._roadStall && typeof healRoadStall==="function"){
    try{ if(healRoadStall()) return; }catch(e){}
  }
  if(typeof ENC_BUSY!=="undefined" && ENC_BUSY){
    if(typeof hasLiveRoadUi==="function" && hasLiveRoadUi()) return;
    ENC_BUSY = false;
  }
  if(S.hallEvent && !S.hallEvent.shown && hallEventOverdue()) return showHallEvent();
  if(clearStaleDoorLocks()){
    if(S.hallEvent && !S.hallEvent.shown && hallEventOverdue()) return showHallEvent();
    return;
  }
  if((S._questResults||[]).length){ showQuestResults(); return; }
  if((S.pendingLoot||[]).length){
    if(S.hallEvent && !S.hallEvent.shown && hallEventOverdue()) return showHallEvent();
    if(showFindsPopup()) return;
  }
  if(S.contestDue && !S.contestAsk){
    S.contestAsk = {id:"rival_contest", name:(S.rival&&S.rival.name)||"the other hall"};
  }
  if((S.contestAsk || S.contestDue) && !(S.contestUntil>S.day)){
    if(S.hallEvent && !S.hallEvent.shown && hallEventOverdue()) return showHallEvent();
    S.contestAsk=null; return openContestSheet();
  }
  S.contestAsk=null;
  if(S.seasonAsk){
    if(S.hallEvent && !S.hallEvent.shown && hallEventOverdue()) return showHallEvent();
    return openSeasonSheet();
  }
  if(S.contestWarn && !(S.contestUntil>S.day) && !S.contestDue){
    if(S.hallEvent) return showHallEvent();
    S.hallEvent = S.contestWarn; S.contestWarn = null; stampHallEvent(); recordHallEvent(S.hallEvent, "roll"); return showHallEvent();
  }
  if(S.contestWarn && ((S.contestUntil>S.day) || S.contestDue)) S.contestWarn = null;
  if((S.graveAsk||[]).length) return openGraveAsk();
  if((S.saintAsk||[]).length) return openSaintAsk();
  if((S.bloodAsk||[]).length) return openBloodAsk();
  if((S.quitAsk||[]).length) return openQuitAsk();
  if((S.restlessAsk||[]).length) return openRestlessAsk();
  if(S.seekers && S.seekers.length){
    if(S.hallEvent && !S.hallEvent.shown && hallEventOverdue()) return showHallEvent();
    return openSeekers();
  }
  if(S.rivalWritAsk){
    if(S.hallEvent) return showHallEvent();
    S.hallEvent = S.rivalWritAsk; S.rivalWritAsk = null; stampHallEvent(); recordHallEvent(S.hallEvent, "roll"); return showHallEvent();
  }
  if(S.hallEvent){
    if(!hallEventIsOpen()) return showHallEvent();
    return;
  }
  if(S.featAsk){ S.featBadge = true; S.featAsk = null; }
  closeModal();
}

    ppl.hp = Math.max(1, Math.floor((ppl.maxhp||8)/2));
    ppl.status = "wounded";
    if(typeof saintReady==="function" && saintReady(ppl) && typeof queueSaint==="function") queueSaint(ppl);
    S.hallEvent = {id:"old_wound", name:ppl.name};
  } else if(id==="levy"){
    const bag = ready.filter(x=>x.cls!=="Cleric");
    const ppl = bag[Math.floor(Math.random()*bag.length)];
    ppl.status = "away";
    ppl.daysOut = 5;
    ppl.mission = null;
    ppl.kinUntil = S.day + 5;
    ppl.homeWhy = "levy";
    S.hallEvent = {id:"levy", days:5, name:ppl.name};
  }
  stampHallEvent();
  if(S.hallEvent) recordHallEvent(S.hallEvent, "roll");
}

  const s = e.season||seasonOf();

  if(s==="summer") return `<button type="button" class="act" id="szYes" style="width:100%;margin-top:10px">Shade · 12g · ignore heat</button><button type="button" class="ghost" id="szNo" style="width:100%;margin-top:6px">March in the sun</button>`;
  if(s==="autumn") return `<button type="button" class="act" id="szYes" style="width:100%;margin-top:10px">Store grain · 8g · skip winter wage bump</button><button type="button" class="ghost" id="szNo" style="width:100%;margin-top:6px">Eat it now</button>`;

function tickSeekers(){
  if(S.seekers && S.seekers.length){
    S.forceSeek = false;
    return;
  }
  if(!S.nextSeek) S.nextSeek = S.day + knockGap();
  const forced = !!S.forceSeek;
  S.forceSeek = false;
  if(!forced && S.day < S.nextSeek) return;
  if(!bankLv()){
    S.nextSeek = S.day + knockGap();
    return;
  }
  S.seekers = [makeVisitor(), makeVisitor(), makeVisitor()];
  S.nextSeek = S.day + knockGap();
  note(forced ? "The bell brought three faces to the door." : "Three faces at the door. The Bank drew them.", "level");
}
function seekPrice(p){
  let n = Math.max(8, Math.floor(hireCost(p)*0.65));
  
  if(seasonOf()==="spring") n = Math.max(8, Math.floor(n*0.9));
  if(hallCatActive()) n = Math.max(8, Math.floor(n*0.75));
  return n;
}
function seekerLine(p){
  const g = faceGrade(p);
  const w = catalog("weapon", p.weapon) || {};
  const a = catalog("armor", p.armor) || {};
  const f = foodOf(p);
  const tap = hireCost(p);
  const cost = seekPrice(p);
  return `<div class="card cls-${CLASSES[p.cls].tag}${g==="flawed"?" flawed":g==="elite"?" elite":g==="gifted"?" gifted":""}" data-seeklook="${p.id}" style="cursor:pointer">
    <div class="row"><span class="who">${face(p)}<span>${nameHtml(p,"strong")}<span class="tiny">${p.cls} ${p.lv} · ${g} · PWR ${pwrOf(p)}</span>${mottoHtml(p)}</span></span></div>
    <p class="tiny">${roleLine(p)} · ${specLine(p)} · ${quirkLine(p)}</p>
    <p class="tiny">${traitText(p)}</p>
    <p class="tiny">${itemNameHtml(w)} · ${itemNameHtml(a)}${f?" · "+itemNameHtml(f):""}</p>
    <p class="tiny">Tap would ask ${gp(tap)}. Door price ${gp(cost)}.</p>
    ${livingRoster().length>=cap()
      ? `<button type="button" class="ghost" disabled style="width:100%;margin-top:6px">No bunk · ${p.name.split(" ")[0]}</button>`
      : ((S.gold||0)+(bankLv()?(S.deposit||0):0) >= cost
      ? `<button type="button" class="act" data-seekyes="${p.id}" style="width:100%;margin-top:6px">Take ${p.name.split(" ")[0]} · ${gp(cost)}</button>`
      : `<button type="button" class="ghost" disabled style="width:100%;margin-top:6px;opacity:.7">Not enough gold · ${gp(cost)}</button>`)}
  </div>`;
}

function payWithBank(cost, why){
  cost = Math.max(0, cost||0);
  const purse = S.gold||0;
  const vault = bankLv() ? (S.deposit||0) : 0;
  if(purse + vault < cost){
    toast("Need "+gp(cost)+" · purse "+gp(purse)+(bankLv()?" · vault "+gp(vault):"")+".");
    return false;
  }
  let left = cost;
  let fromVault = 0;
  if(vault && left){
    fromVault = Math.min(vault, left);
    S.deposit = vault - fromVault;
    left -= fromVault;
  }
  if(left){
    S.gold = purse - left;
    left = 0;
  }
  const bits = [];
  if(fromVault) bits.push("vault "+gp(fromVault));
  if(cost-fromVault) bits.push("purse "+gp(cost-fromVault));
  log("Paid "+gp(cost)+(why?(" for "+why):"")+(bits.length?" ("+bits.join(" + ")+")":"")+".");
  return true;
}

  const party = ids.map(id=>S.people.find(p=>p.id===id));

  if(isDarkMission(m) && party.some(p=>!canWalkDark(p))) return toast("Need someone who can walk Dark.");
  if(!S._oathOk && writMatches(m) && party.some(p=>hasTrait(p,"Oath-breaker"))) return oathBreakerWarn(mid, ids);

const BLADED = ["sword","axe","runesword","ridgefang","wellspike","spear","boar","pike","starbit","ditchpike"];
function rarityOf(it){
  if(!it) return "common";
  if(it.kind==="loot") return "junk";
  if(it.r) return it.r;
  if(it.unique) return "artifact";
  const c = it.id ? (WEAPONS.find(x=>x.id===it.id)||ARMORS.find(x=>x.id===it.id)||FOODS.find(x=>x.id===it.id)) : null;
  if(c && c.r) return c.r;
  if(c && c.unique) return "artifact";
  return "common";
}
function rarityColor(r){ return "r-"+(r||"common"); }
function itemNameHtml(it){
  if(!it) return "";
  const src = it.n ? it : (catalog(it.kind||"", it.id)||it);
  let name = (src&&src.n)||it.id||"";
  const kind = (src&&src.kind)||it.kind;
  if(kind==="loot") return name;
  if(/bow|crossbow/i.test(name)) name += " · ranged · two-hand";
  if(isShield(src)) name += " · shield · +"+(src.def||0)+" DEF";
  else if(kind==="armor" || (src&&src.slot) || (src&&src.wt)){
    const slot = armorSlotOf(src||it);
    const wt = armorWtOf(src||it);
    if(!new RegExp(slot,"i").test(name)) name += " · "+slot;
    if(!new RegExp(wt,"i").test(name)) name += " · "+wt;
  }
  if(kind==="weapon" || (src&&src.fam)){
    name = name.replace(/\s*\((junk|common|uncommon|rare|epic|artifact)\)/ig,"");
    const fam = (src&&src.fam)||"";
    const hands = (src&&src.hands)||1;
    const tag = fam==="blade"?"bladed":fam==="blunt"?"blunt":fam==="ranged"?"ranged":fam==="wand"?"wand":"";
    if(tag && !new RegExp(tag,"i").test(name)) name += " · "+tag;
    if(hands>=2 && !/two-hand/i.test(name)) name += " · two-hand";
  }
  return `<span class="${rarityColor(rarityOf(src||it))}">${name}</span>`;
}
function rarityRank(r){

function expandGear(){
  if(expandGear.done) return;
  expandGear.done=true;
  WEAPONS.forEach(w=>{
    w.kind="weapon";
    const n=(w.n||"").toLowerCase();
    if(/bow|crossbow/.test(n)) w.fam="ranged";
    else if(/wand/.test(n)) w.fam="wand";
    else if(/staff|stave/.test(n)) w.fam="blunt";
    else if(w.blade || /sword|dagger|knife|axe|blade|falchion|spear|pike/.test(n)) w.fam="blade";
    else w.fam="blunt";
    w.hands = w.hands || 1;
  });
  ARMORS.forEach(a=>{
    a.kind="armor";
    a.slot=a.slot||"chest";
    if(!a.wt) a.wt = (a.def||0)>=4 ? "heavy" : (a.def||0)>=2 ? "medium" : "light";
  });
  const slots={head:["Cap","Hood","Helm"],chest:["Vest","Jack","Coat"],arms:["Bracers","Sleeves","Vambraces"],legs:["Breeches","Chausses","Greaves"],feet:["Shoes","Boots","Sabatons"],hands:["Gloves","Gauntlets","Mitts"]};
  const wts=["light","medium","heavy"];
  const rar=[["junk",0],["common",1],["uncommon",2],["rare",3],["epic",4]];
  wts.forEach(wt=>{
    ARMOR_SLOTS.forEach(slot=>{
      rar.forEach(([r,def],ri)=>{
        const names=slots[slot];
        const nm=names[wt==="light"?0:wt==="medium"?1:2]+" ("+wt+")";
        const bonus=wt==="heavy"?2:wt==="medium"?1:1;
        ARMORS.push({id:"gen_"+slot+"_"+wt+"_"+r, n:nm, def:def+bonus, cost:6+def*8+bonus*6, r, kind:"armor", slot, wt});
      });
    });
  });
  const blades=[["Dagger",1],["Sword",1],["Axe",1],["Greatsword",2],["Greataxe",2]];
  const blunts=[["Club",1],["Mace",1],["Staff",1],["Maul",2],["Greatclub",2]];
  const ranges=[["Bow",1],["Crossbow",1]];
  function addW(list, fam){
    list.forEach(([nm,hands])=>{
      rar.forEach(([r,atk])=>{
        const bonus=hands===2?2:0;
        WEAPONS.push({id:"gen_"+fam+"_"+nm+"_"+r, n:nm, atk:Math.max(1, atk+bonus+(hands===2?1:0)), cost:8+atk*10+bonus*8, r, kind:"weapon", fam, hands, blade:fam==="blade"});
      });
    });
  }
  addW(blades,"blade"); addW(blunts,"blunt"); addW(ranges,"ranged");
  WEAPONS.push({id:"gen_wand_common", n:"Ash Wand", atk:2, cost:18, r:"common", kind:"weapon", fam:"wand", hands:1});
  WEAPONS.push({id:"gen_wand_rare", n:"Glass Wand", atk:4, cost:60, r:"rare", kind:"weapon", fam:"wand", hands:1});
  [["Buckler",1,"common"],["Round Shield",2,"uncommon"],["Kite Shield",3,"rare"],["Tower Shield",4,"epic"],["Chapel Board",2,"common"],["Iron Heater",3,"uncommon"]].forEach(([n,def,r])=>{
    WEAPONS.push({id:"gen_shield_"+n.replace(/\s/g,""), n, atk:1, def, cost:12+def*14, r, kind:"weapon", fam:"shield", hands:1});
  });
}

function armorSlotOf(it){

  if(it.slot) return it.slot;
  const n=(it.n||"");
  if(/Cap|Hood|Helm/.test(n)) return "head";
  if(/Bracer|Sleeve|Vambrace/.test(n)) return "arms";
  if(/Breeches|Chausses|Greave/.test(n)) return "legs";
  if(/Shoe|Boot|Sabaton/.test(n)) return "feet";
  if(/Glove|Gauntlet|Mitt/.test(n)) return "hands";
  return "chest";
}
function armorWtOf(it){
  if(!it) return "light";
  const n=(it.n||"").toLowerCase();
  if(/\blight\b/.test(n)) return "light";
  if(/\bmedium\b/.test(n)) return "medium";
  if(/\bheavy\b/.test(n)) return "heavy";
  if(it.wt) return it.wt;
  return (it.def||0)>=4?"heavy":(it.def||0)>=2?"medium":"light";
}
function ensureSlots(p){

}
function wornArmor(p){

}

function isShield(it){

  if((src.kind||it.kind)==="loot") return false;

}
function canWield(p, item){
