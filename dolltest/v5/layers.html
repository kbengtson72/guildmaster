<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Guildmaster — leather layers</title>
  <style>
    :root { --bg: #7c7c7c; --ui: #1c1c1e; --ink: #f2f2f7; --muted: #a1a1aa; --accent: #d4a574; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #111; color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { min-height: 100dvh; padding: 12px 12px calc(16px + env(safe-area-inset-bottom)); }
    h1 { font-size: 1.05rem; font-weight: 600; margin: 0 0 2px; }
    .sub { color: var(--muted); font-size: 0.8rem; margin-bottom: 12px; }
    .layout { display: flex; flex-direction: row; align-items: flex-start; gap: 10px; max-width: 980px; margin: 0 auto; }
    .stage-wrap { flex: 0 0 50%; position: sticky; top: 8px; }
    .controls { flex: 1 1 50%; min-width: 0; }
    @media (max-width: 700px) {
      body { padding: 8px 6px calc(12px + env(safe-area-inset-bottom)); }
      .layout { gap: 6px; }
      .stage-wrap { padding: 4px !important; }
      .controls { gap: 6px !important; }
      .controls h1, .controls .sub { display: none; }
      .row { gap: 4px !important; }
      .label { min-width: 0 !important; width: 100%; font-size: 0.66rem !important; }
      button, select { font-size: 0.78rem !important; padding: 5px 7px !important; min-height: 32px !important; }
      select { padding-right: 22px !important; width: 100%; background-position: calc(100% - 12px) 14px, calc(100% - 7px) 14px !important; }
      .slot { flex-wrap: wrap; gap: 2px !important; }
    }
    .stage-wrap { background: #2a2a2a; border-radius: 12px; padding: 10px; }
    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      max-height: 92dvh;
      margin: 0 auto;
      background: var(--bg);
      border-radius: 8px;
      overflow: hidden;
    }
    .stage img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      image-rendering: auto;
    }
    .controls { display: flex; flex-direction: column; gap: 10px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .label { min-width: 4.6rem; font-size: 0.78rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    button, select {
      appearance: none;
      border: 0;
      border-radius: 8px;
      background: var(--ui);
      color: var(--ink);
      font-size: 0.9rem;
      padding: 8px 12px;
      min-height: 40px;
    }
    button { cursor: pointer; }
    button.active { background: var(--accent); color: #1a120a; font-weight: 600; }
    select { padding-right: 28px; background-image: linear-gradient(45deg, transparent 50%, #aaa 50%), linear-gradient(135deg, #aaa 50%, transparent 50%); background-position: calc(100% - 16px) 18px, calc(100% - 11px) 18px; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
    .slot { display: flex; gap: 8px; align-items: center; }
    .slot select { flex: 1; }
    .presets { display: flex; gap: 6px; flex-wrap: wrap; }
    .presets button { flex: 1 1 auto; }
    .randoms { display: flex; flex-wrap: wrap; gap: 6px; flex: 1 1 auto; min-width: 0; }
    .randoms button { flex: 1 1 auto; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="layout">
    <div class="stage-wrap">
      <div class="stage" id="stage" aria-label="Paper doll preview">
        <img id="layer-cloak" alt="">
        <img id="layer-base" alt="">
        <img id="layer-liner" alt="">
        <img id="layer-face" alt="">
        <img id="layer-bootsunder" alt="">
        <img id="layer-pants" alt="">
        <img id="layer-pantsunder" alt="">
        <img id="layer-boots" alt="">
        <img id="layer-chest" alt="">
        <img id="layer-gloves" alt="">
        <img id="layer-hair" alt="">
        <img id="layer-helmet" alt="">
      </div>
    </div>
    <div class="controls">
      <div>
        <h1>Leather paper doll</h1>
        <div class="sub">Mix and match layers. Cloak sits behind the body. Face and hair use the new head layers (Face "Original" shows the old baked head). Your picks are saved in the link.</div>
      </div>
      <div class="row">
        <span class="label">Body</span>
        <button type="button" id="btn-male" class="active">Male</button>
        <button type="button" id="btn-female">Female</button>
      </div>
      <div class="row">
        <span class="label">Set all</span>
        <div class="presets" id="presets"></div>
      </div>
      <div class="row">
        <span class="label">Face</span>
        <select id="sel-face"></select>
        <span class="label" style="min-width:auto">Hair</span>
        <select id="sel-hair"></select>
      </div>
      <div class="row">
        <span class="label">Random</span>
        <div class="randoms">
          <button type="button" id="btn-random-male">Random Male</button>
          <button type="button" id="btn-random-female">Random Female</button>
        </div>
      </div>
      <div id="slots"></div>
    </div>
  </div>
  <script>
    const TIERS = ["common", "masterwork", "green", "blue", "purple"];
    const TIER_LABEL = { common: "Common", masterwork: "Masterwork", green: "Green", blue: "Blue", purple: "Purple" };
    const SLOTS = ["helmet", "cloak", "chest", "gloves", "pants", "boots"];
    const SLOT_LABEL = { helmet: "Helmet", cloak: "Cloak", chest: "Chest", gloves: "Gloves", pants: "Pants", boots: "Boots" };
    // Draw order is fixed in the HTML:
    //   cloak, base, liner, face, boots-underlap, pants, pants-underlap, boots, chest,
    //   gloves, hair, helmet.
    // New heads (face 1-10): base is the headless outfit body, the face sits on it,
    // the outfit goes over the neck, hair goes over collar/shoulders (and over the cloak),
    // and under a helmet the hair is clipped to the helmet's outline.
    // Face "Original" keeps the old path: baked base head, female helmets use the no-hair
    // base plus the tucked hair plate.
    let gender = "male";
    const pick = Object.fromEntries(SLOTS.map((s) => [s, "common"]));
    let face = 1;      // 0 = original baked head, 1-10 = new head layers
    let hair = 1;      // 0 = none, 1-10
    // Bump this whenever layer PNGs change so iOS Safari does not keep stale tiles.
    const LAYER_V = "20261118-cloak-facings";
    const ONBASE = ["common", "masterwork", "green", "blue", "purple"];  // tiers cut from Art's on-base paintings
    // Tiers with hidden pants/boots underlaps (drawn only when both are on) so mixing
    // with another tier's boots or pants does not leave a strip of bare leg.
    const UNDERLAP = ["masterwork", "green", "blue", "purple"];      // tiers with <g>-boots-under.png
    const PANTS_UNDERLAP = ["masterwork", "common", "green", "blue", "purple"]; // tiers with <g>-pants-under.png
    const H = "heads/layers/";

    const $ = (id) => document.getElementById(id);
    const pad = (n) => String(n).padStart(2, "0");
    const v = (p) => p + "?v=" + LAYER_V;

    function layerSrc(slot) {
      const tier = pick[slot];
      if (!tier) return "";
      if (face) {
        if (slot === "chest") return v(H + "chest/" + gender + "-" + tier + ".png");
        if (slot === "helmet") return v(H + "helmet/" + gender + "-" + tier + "-shell.png");
      }
      return v("leather/" + tier + "/layers/" + gender + "-" + slot + ".png");
    }

    const OCCLUDE_SLOTS = ["gloves", "boots", "cloak"];
    let gen = 0;
    const blobs = {};

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const im = new Image();
        im.onload = () => resolve(im);
        im.onerror = reject;
        im.src = src;
      });
    }

    // Draw src, punch out each mask (destination-out), return a blob URL.
    async function punched(src, masks, g0) {
      if (!masks.length) return src;
      const base = await loadImage(src);
      if (g0 !== gen) return null;
      const canvas = document.createElement("canvas");
      canvas.width = base.naturalWidth || base.width;
      canvas.height = base.naturalHeight || base.height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(base, 0, 0);
      for (const m of masks) {
        const mask = await loadImage(m);
        if (g0 !== gen) return null;
        ctx.globalCompositeOperation = "destination-out";
        ctx.drawImage(mask, 0, 0);
        ctx.globalCompositeOperation = "source-over";
      }
      const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
      if (g0 !== gen) return null;
      return URL.createObjectURL(blob);
    }

    function setPunched(id, src, masks, g0) {
      const el = $(id);
      el.style.display = "block";
      punched(src, masks, g0).then((url) => {
        if (!url || g0 !== gen) return;
        if (blobs[id]) { URL.revokeObjectURL(blobs[id]); blobs[id] = null; }
        if (url.startsWith("blob:")) blobs[id] = url;
        el.src = url;
      }).catch(() => {
        if (g0 !== gen) return;
        el.src = src;
      });
    }

    function show(id, src) {
      const el = $(id);
      if (!src) { el.removeAttribute("src"); el.style.display = "none"; }
      else { el.style.display = "block"; el.src = src; }
    }

    function render() {
      const g0 = ++gen;
      const g = gender;
      for (const slot of SLOTS) show("layer-" + slot, layerSrc(slot));
      const both = pick.pants && pick.boots;
      show("layer-bootsunder", both && UNDERLAP.includes(pick.boots)
        ? v("leather/" + pick.boots + "/layers/" + g + "-boots-under.png") : "");
      show("layer-pantsunder", both && PANTS_UNDERLAP.includes(pick.pants)
        ? v("leather/" + pick.pants + "/layers/" + g + "-pants-under.png") : "");
      const occl = OCCLUDE_SLOTS.filter((s) => pick[s]).map((s) => v("occlude/" + g + "-" + s + ".png"));
      // Gloves worn over another tier's chest: punch the glove tier's clip mask out
      // of that chest, so a sleeve end flaring past the glove outline at the wrist
      // doesn't poke out. The mask only covers wrist/forearm rows, beside and below
      // the glove, where the glove tier's own set shows nothing; the base body is
      // never clipped. Matching sets are untouched.
      if (pick.gloves && pick.chest && pick.gloves !== pick.chest) {
        const clip = v("leather/" + pick.gloves + "/layers/" + g + "-gloves-clip.png");
        setPunched("layer-chest", layerSrc("chest"), [clip], g0);
      }
      if (face) {
        setPunched("layer-base", v(H + "body-" + g + "-outfit.png"), occl, g0);
        show("layer-liner", pick.helmet ? v(H + "helmet/" + g + "-" + pick.helmet + "-liner.png") : "");
        show("layer-face", v(H + g + "/face-" + pad(face) + ".png"));
        if (!hair) show("layer-hair", "");
        else {
          const hs = v(H + g + "/hair-" + pad(hair) + ".png");
          if (pick.helmet) setPunched("layer-hair", hs, [v(H + "helmet/" + g + "-" + pick.helmet + "-clip.png")], g0);
          else show("layer-hair", hs);
        }
      } else {
        const useNohair = !!pick.helmet && g === "female";
        setPunched("layer-base", v("base-" + g + (useNohair ? "-nohair" : "") + ".png"), occl, g0);
        show("layer-liner", "");
        show("layer-face", "");
        // Common, masterwork, green, blue and purple female helmets are on-base cuts (single piece that
        // already includes the visible hair), so the extra hair plate is not drawn.
        show("layer-hair", pick.helmet && g === "female" && !ONBASE.includes(pick.helmet)
          ? v("hair/female-helmet-" + pick.helmet + ".png") : "");
      }
      writeHash();
    }

    function writeHash() {
      const p = new URLSearchParams();
      p.set("g", gender);
      p.set("face", face ? String(face) : "orig");
      p.set("hair", hair ? String(hair) : "none");
      for (const s of SLOTS) p.set(s, pick[s] || "none");
      const h = "#" + p.toString();
      if (location.hash !== h) history.replaceState(null, "", h);
    }

    function readHash() {
      const p = new URLSearchParams(location.hash.slice(1));
      if (p.get("g") === "female" || p.get("g") === "male") gender = p.get("g");
      const f = p.get("face");
      if (f === "orig") face = 0;
      else if (f && +f >= 1 && +f <= 10) face = +f;
      const h = p.get("hair");
      if (h === "none") hair = 0;
      else if (h && +h >= 1 && +h <= 10) hair = +h;
      for (const s of SLOTS) {
        const t = p.get(s);
        if (t === "none") pick[s] = "";
        else if (TIERS.includes(t)) pick[s] = t;
      }
    }

    function syncUI() {
      $("btn-male").classList.toggle("active", gender === "male");
      $("btn-female").classList.toggle("active", gender === "female");
      for (const s of SLOTS) $("sel-" + s).value = pick[s] || "none";
      const vals = SLOTS.map((s) => pick[s] || "none");
      const same = vals.every((x) => x === vals[0]) ? vals[0] : null;
      for (const btn of document.querySelectorAll("#presets button")) btn.classList.toggle("active", btn.dataset.tier === same);
      $("sel-face").value = face ? String(face) : "orig";
      fillHair();
      $("sel-hair").value = hair ? String(hair) : "none";
      $("sel-hair").disabled = !face;
    }

    function fillHair() {
      const sel = $("sel-hair");
      sel.innerHTML = "";
      const none = document.createElement("option");
      none.value = "none"; none.textContent = "None";
      sel.appendChild(none);
      for (let i = 1; i <= 10; i++) {
        const o = document.createElement("option");
        o.value = String(i);
        o.textContent = (gender === "male" && i === 2) ? "2 (bald)" : String(i);
        sel.appendChild(o);
      }
    }

    function setGender(next) {
      gender = next;
      syncUI();
      render();
    }

    function setAll(tier) {
      for (const s of SLOTS) pick[s] = tier;
      syncUI();
      render();
    }

    // Random Male / Random Female: everything the tester can show for that body only
    // (the gender is never changed by Random). Face (new head layers 1-10, so
    // hair always applies), hair 1-10, and a tier for every gear slot. Helmet and cloak
    // are sometimes left off, gloves rarely; chest, pants and boots are always worn.
    // Helmet hair clipping / underlaps are handled by render() for any combination.
    const RANDOM_NONE = { helmet: 0.3, cloak: 0.2, gloves: 0.1, chest: 0, pants: 0, boots: 0 };
    const rnd = (n) => Math.floor(Math.random() * n);
    function randomize(g) {
      gender = g;
      face = 1 + rnd(10);
      hair = 1 + rnd(10);
      for (const s of SLOTS) pick[s] = Math.random() < (RANDOM_NONE[s] || 0) ? "" : TIERS[rnd(TIERS.length)];
      syncUI();
      render();
    }

    function buildUI() {
      const presets = $("presets");
      for (const t of TIERS) {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = TIER_LABEL[t];
        b.dataset.tier = t;
        b.addEventListener("click", () => setAll(t));
        presets.appendChild(b);
      }
      const none = document.createElement("button");
      none.type = "button";
      none.textContent = "Bare";
      none.dataset.tier = "none";
      none.addEventListener("click", () => setAll(""));
      presets.appendChild(none);

      const box = $("slots");
      for (const s of SLOTS) {
        const row = document.createElement("div");
        row.className = "slot";
        const lab = document.createElement("span");
        lab.className = "label";
        lab.textContent = SLOT_LABEL[s];
        const sel = document.createElement("select");
        sel.id = "sel-" + s;
        const optNone = document.createElement("option");
        optNone.value = "none";
        optNone.textContent = "None";
        sel.appendChild(optNone);
        for (const t of TIERS) {
          const o = document.createElement("option");
          o.value = t;
          o.textContent = TIER_LABEL[t];
          sel.appendChild(o);
        }
        sel.addEventListener("change", () => {
          pick[s] = sel.value === "none" ? "" : sel.value;
          syncUI();
          render();
        });
        row.appendChild(lab);
        row.appendChild(sel);
        box.appendChild(row);
      }

      const fs = $("sel-face");
      const orig = document.createElement("option");
      orig.value = "orig"; orig.textContent = "Original";
      fs.appendChild(orig);
      for (let i = 1; i <= 10; i++) {
        const o = document.createElement("option");
        o.value = String(i); o.textContent = String(i);
        fs.appendChild(o);
      }
      fs.addEventListener("change", () => { face = fs.value === "orig" ? 0 : +fs.value; syncUI(); render(); });
      $("sel-hair").addEventListener("change", () => {
        const val = $("sel-hair").value;
        hair = val === "none" ? 0 : +val;
        render();
      });
      $("btn-random-male").addEventListener("click", () => randomize("male"));
      $("btn-random-female").addEventListener("click", () => randomize("female"));
      $("btn-male").addEventListener("click", () => setGender("male"));
      $("btn-female").addEventListener("click", () => setGender("female"));
      window.addEventListener("hashchange", () => { readHash(); syncUI(); render(); });
    }

    buildUI();
    readHash();
    syncUI();
    render();
  </script>
</body>
</html>
